          </div>
          <div className="row2">
            <Fl l="КИ" ch={<select className="inp" value={c.creditStatus} onChange={e=>set('creditStatus',e.target.value)}>{CREDIT_ST.map(x=><option key={x.id} value={x.id}>{x.l}</option>)}</select>}/>
            <Fl l="Тип занятости" ch={<select className="inp" value={c.workType} onChange={e=>set('workType',e.target.value)}>{WORK_TYPES.map(w=><option key={w.id} value={w.id}>{w.l}</option>)}</select>}/>
          </div>
          <Fl l="Договор" ch={<select className="inp" value={c.contractType} onChange={e=>{const ct=CONTRACTS.find(x=>x.id===e.target.value);setC(x=>({...x,contractType:e.target.value,contractAmount:ct?.a||x.contractAmount}));}}><option value="">—</option>{CONTRACTS.map(x=><option key={x.id} value={x.id}>{x.l}{x.a>0?' — '+fmt(x.a)+' ₸':''}</option>)}</select>}/>
          {c.contractType&&<Fl l="Сумма договора (₸)" ch={<input className="inp" type="number" value={c.contractAmount} onChange={e=>set('contractAmount',+e.target.value)}/>}/>}
          <div style={{display:'flex',gap:8,marginTop:4}}>
            <Fl l="Ссылка Miro" ch={<input className="inp" value={c.miroLink||''} onChange={e=>set('miroLink',e.target.value)} placeholder="https://miro.com/..."/>}/>
            <Fl l="Google Drive" ch={<input className="inp" value={c.driveLink||''} onChange={e=>set('driveLink',e.target.value)} placeholder="https://drive.google.com/..."/>}/>
          </div>
          {canEdit&&<button className="btn btn-danger btn-sm" onClick={()=>onDelete(c.id)} style={{marginTop:8}}><i className="ti ti-trash"/>Удалить клиента</button>}
        </div>}

        {/* SОПРОВОЖДЕНИЕ + CHECKLIST + COMMENTS PER STAGE */}
        {c.stage==='accompaniment'&&<>
          {/* Overall progress */}
          <div className="card cp" style={{marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontWeight:800,fontSize:14}}>Прогресс сопровождения</div>
              <div style={{fontWeight:900,fontSize:20,color:overallPct===100?'var(--success)':'var(--accent)'}}>{overallPct}%</div>
            </div>
            <Prog pct={overallPct} color={overallPct===100?'var(--success)':'var(--accent)'}/>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:6}}>{totalDone} из {totalItems} пунктов выполнено</div>
          </div>

          {/* AUTO-TRANSITION BANNER */}
          {autoBanner&&<div className="auto-banner">
            <div className="auto-banner-icon">🎉</div>
            <div className="auto-banner-text">
              <div className="auto-banner-title">Этап "{autoBanner.fromName}" завершён!</div>
              <div className="auto-banner-sub">Перейти к следующему этапу: {autoBanner.toName}?</div>
            </div>
            <div style={{display:'flex',gap:8,flexShrink:0}}>
              <button className="btn btn-success btn-sm" onClick={()=>doAutoTransition(autoBanner.toIdx)}><i className="ti ti-arrow-right"/>Перейти</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setAutoBanner(null)}>Позже</button>
            </div>
          </div>}

          {/* Stage dots */}
          <div className="card" style={{marginBottom:14,overflow:'hidden'}}>
            <div style={{padding:'12px 14px',fontWeight:700,fontSize:13,borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>Этапы сопровождения</span>
              <span style={{fontSize:12,color:'var(--muted)',fontWeight:500}}>Текущий: <b style={{color:'var(--accent)'}}>{ACCOMP[c.accompStageIndex]}</b></span>
            </div>
            <div className="stage-dots" style={{padding:'12px 8px',overflowX:'auto'}}>
              {ACCOMP.map((s,i)=>{
                const sd=getSD(i);const items=checklists[s]||[];
                const done=(sd.done||[]).length;const allDone=items.length>0&&done===items.length;
                const isActive=activeAccompIdx===i;
                return <div key={s} className="s-step" onClick={()=>setActiveAccompIdx(i)}>
                  {i<ACCOMP.length-1&&<div style={{position:'absolute',top:12,left:'50%',right:'-50%',height:2,background:allDone?'var(--success)':i<c.accompStageIndex?'var(--accent)':'var(--border)',zIndex:0}}/>}
                  <div className={`s-dot${allDone?' done':isActive?' active':''}`}>{allDone?<i className="ti ti-check" style={{fontSize:10}}/>:i+1}</div>
                  <div className={`s-label${isActive?' active':allDone?' done':''}`}>{s}</div>
                </div>;
              })}
            </div>
          </div>

          {/* Active stage detail */}
          {ACCOMP.map((stageName,si)=>{
            if(si!==activeAccompIdx)return null;
            const sd=getSD(si);
            const items=checklists[stageName]||[];
            const done=sd.done||[];
            const pct=items.length>0?Math.round(done.length/items.length*100):100;
            const isComplete=pct===100||items.length===0;
            const incomplete=items.filter(item=>!done.includes(item.id));

            return <div key={stageName}>
              {/* Checklist */}
              <div className="cl-section">
                <div className="cl-hd">
                  <div className="cl-hd-title">
                    <div style={{width:28,height:28,borderRadius:8,background:isComplete?'var(--success)':'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {isComplete?<i className="ti ti-check" style={{color:'#fff',fontSize:14}}/>:<i className="ti ti-list-check" style={{color:'#fff',fontSize:14}}/>}
                    </div>
                    {stageName}
                    <button className="btn btn-primary btn-sm" onClick={()=>canEdit&&set('accompStageIndex',si)}>📍 Текущий</button>
                  </div>
                  <div className="cl-hd-pct" style={{color:isComplete?'var(--success)':'var(--accent)'}}>{pct}%</div>
                </div>
                <div style={{padding:'6px 16px 0'}}><Prog pct={pct} color={isComplete?'var(--success)':'var(--accent)'} xs/></div>

                {/* Warning */}
                {!isComplete&&<div className="warn-banner" style={{margin:'10px 12px',borderRadius:12}}>
                  <i className="ti ti-alert-triangle" style={{color:'var(--warn)',fontSize:18,marginTop:2}}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:12,color:'#92400e'}}>Незавершённые пункты:</div>
                    <div className="warn-items">
                      {incomplete.map(item=><span key={item.id} className="warn-chip">
                        <i className={`ti ${TP_ICON[item.tp||'check']}`} style={{fontSize:10,color:TP_COL[item.tp||'check']}}/>{item.t}
                      </span>)}
                    </div>
                  </div>
                </div>}

                {items.map(item=>{
                  const isDone=done.includes(item.id);
                  return <div key={item.id} className="cl-item" onClick={()=>canEdit&&toggleCheck(si,item.id)}>
                    <div className={`cl-box${isDone?' ck':''}`}>{isDone&&<i className="ti ti-check" style={{fontSize:12,color:'#fff'}}/>}</div>
                    <div style={{width:26,height:26,borderRadius:8,background:TP_BG[item.tp||'check'],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <i className={`ti ${TP_ICON[item.tp||'check']}`} style={{fontSize:13,color:TP_COL[item.tp||'check']}}/>
                    </div>
                    <div className="cl-text" style={{textDecoration:isDone?'line-through':'none',color:isDone?'var(--muted)':'var(--text)'}}>{item.t}</div>
                    <span className="cl-type" style={{background:TP_BG[item.tp||'check'],color:TP_COL[item.tp||'check']}}>{TP_LBL[item.tp||'check']}</span>
                  </div>;
                })}
              </div>

              {/* Stage comments */}
              <div className="comment-box">
                <div className="card-hd"><span>💬 Комментарии — {stageName}</span><span style={{fontSize:12,fontWeight:500,color:'var(--muted)'}}>{(sd.comments||[]).length}</span></div>
                {(sd.comments||[]).length===0&&<div style={{padding:'14px 16px',fontSize:13,color:'var(--muted)',fontStyle:'italic'}}>Нет комментариев</div>}
                {(sd.comments||[]).map(cm=><div key={cm.id} className="comment-item">
                  <div className="comment-meta"><i className="ti ti-message" style={{fontSize:12}}/><b>{cm.author}</b><span>{cm.date}</span></div>
                  <div className="comment-text">{cm.text}</div>
                </div>)}
                {canEdit&&<div className="comment-add">
                  <input className="inp" value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder={`Заметка к этапу "${stageName}"...`} onKeyDown={e=>e.key==='Enter'&&addComment(si)} style={{flex:1}}/>
                  <button className="btn btn-primary btn-sm" onClick={()=>addComment(si)}><i className="ti ti-send"/></button>
                </div>}
              </div>

              {/* Nav */}
              <div style={{display:'flex',gap:10,marginTop:10,marginBottom:14}}>
                <button className="btn btn-ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>setActiveAccompIdx(Math.max(0,si-1))} disabled={si===0} style={{opacity:si===0?.35:1,flex:1,justifyContent:'center'}}><i className="ti ti-arrow-left"/>Предыдущий</button>
                <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={()=>setActiveAccompIdx(Math.min(ACCOMP.length-1,si+1))} disabled={si===ACCOMP.length-1} style={{opacity:si===ACCOMP.length-1?.35:1,flex:1,justifyContent:'center'}}>Следующий<i className="ti ti-arrow-right"/></button>
              </div>
            </div>;
          })}
        </>}

        {/* GLOBAL HISTORY */}
        <div className="comment-box">
          <div className="card-hd"><span>📝 История клиента</span><span style={{fontSize:12,color:'var(--muted)',fontWeight:500}}>{(c.comments||[]).length}</span></div>
          {(c.comments||[]).length===0&&<div style={{padding:'14px 16px',fontSize:13,color:'var(--muted)',fontStyle:'italic'}}>История пустая</div>}
          {[...(c.comments||[])].reverse().map(cm=><div key={cm.id} className="comment-item">
            <div className="comment-meta"><i className="ti ti-message" style={{fontSize:12}}/><b>{cm.author}</b><span>{cm.date}</span><StageTag id={c.stage}/></div>
            <div className="comment-text">{cm.text}</div>
          </div>)}
          {canEdit&&<div className="comment-add">
            <input className="inp" value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder="Добавьте заметку, результат звонка..." onKeyDown={e=>e.key==='Enter'&&addGlobalComment()} style={{flex:1}}/>
            <button className="btn btn-primary btn-sm" onClick={addGlobalComment}><i className="ti ti-send"/></button>
          </div>}
        </div>

        {/* LINKS */}
        {(c.miroLink||c.driveLink||c.roadmapLink)&&<div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
          {c.miroLink&&<a href={c.miroLink} target="_blank" className="btn btn-ghost"><i className="ti ti-external-link"/>Miro</a>}
          {c.roadmapLink&&<a href={c.roadmapLink} target="_blank" className="btn btn-ghost"><i className="ti ti-map"/>Roadmap</a>}
          {c.driveLink&&<a href={c.driveLink} target="_blank" className="btn btn-ghost"><i className="ti ti-brand-google-drive"/>Drive</a>}
        </div>}

      </div>
    </div>
  </div>;
}

// ═══ IIN SEARCH ═══
function IINSearch({clients,managers,pipeline,onOpen}){
  const [q,setQ]=useState('');
  const results=q.length>=3?clients.filter(c=>c.iin.includes(q)||c.fio.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q)):[];

  return <div style={{maxWidth:640,margin:'0 auto'}}>
    <div style={{textAlign:'center',marginBottom:24}}>
      <div style={{fontSize:40,marginBottom:8}}>🔍</div>
      <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>Поиск по ИИН</div>
      <div style={{fontSize:14,color:'var(--muted)'}}>Введите ИИН, имя или телефон</div>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,background:'#f1f5f9',borderRadius:14,padding:'12px 16px',marginBottom:16}}>
      <i className="ti ti-search" style={{color:'var(--muted)',fontSize:20}}/>
      <input style={{border:'none',background:'transparent',fontSize:16,color:'var(--text)',flex:1,outline:'none'}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Начните вводить ИИН, имя или номер..." autoFocus/>
      {q&&<button style={{border:'none',background:'transparent',color:'var(--muted)',fontSize:20,cursor:'pointer'}} onClick={()=>setQ('')}><i className="ti ti-x"/></button>}
    </div>
    {q.length>0&&q.length<3&&<div style={{textAlign:'center',color:'var(--muted)',padding:20}}>Введите минимум 3 символа...</div>}
    {results.map(c=>{
      const m=managers.find(x=>x.id===c.manager);
      const p=(pipeline||PIPELINE).find(x=>x.id===c.stage);
      const accomp=c.stage==='accompaniment';
      const totalItems=ACCOMP.reduce((s,st)=>s+(DEF_CHECKLISTS[st]||[]).length,0);
      const totalDone=ACCOMP.reduce((s,st,i)=>s+((c.accompStages||{})[i]?.done||[]).length,0);
      const pct=totalItems>0?Math.round(totalDone/totalItems*100):0;
      return <div key={c.id} style={{background:'var(--card)',border:'2px solid var(--accent)',borderRadius:16,padding:'16px',marginBottom:12,cursor:'pointer',transition:'all .15s'}}
        onClick={()=>onOpen(c)} onMouseEnter={e=>e.currentTarget.style.background='var(--accent-bg)'} onMouseLeave={e=>e.currentTarget.style.background='var(--card)'}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div><div style={{fontWeight:800,fontSize:18,marginBottom:4}}>{c.fio||'—'}</div>
            <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{fontFamily:'monospace',fontSize:12,background:'#f1f5f9',padding:'2px 8px',borderRadius:5,color:'var(--muted)'}}>{c.iin}</span>
              <span style={{fontSize:13,color:'var(--muted)'}}>{c.phone}</span>
              <span style={{fontSize:13,color:'var(--muted)'}}>{c.city}</span>
            </div>
          </div>
          {p&&<Tag c={p.c}>{p.l}</Tag>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:accomp?12:0}}>
          {[{l:'Менеджер',v:m?.name||'—'},{l:'Источник',v:SRC[c.source]?.l||'—'},{l:'Договор',v:c.contractAmount>0?fmt(c.contractAmount)+' ₸':'—'},{l:'Дата',v:c.dateIn}].map(({l,v})=><div key={l} style={{background:'#f8fafc',borderRadius:9,padding:'8px 10px'}}>
            <div style={{fontSize:10,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:13}}>{v}</div>
          </div>)}
        </div>
        {accomp&&<>
          <div style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:5}}>Прогресс: {pct}% · Этап: <b>{ACCOMP[c.accompStageIndex]}</b></div>
          <Prog pct={pct} color={pct===100?'var(--success)':pct>50?'var(--accent)':'var(--warn)'} xs/>
        </>}
        <div style={{fontSize:12,color:'var(--accent)',fontWeight:700,marginTop:10,display:'flex',alignItems:'center',gap:4}}><i className="ti ti-arrow-right"/>Открыть карточку</div>
      </div>;
    })}
    {q.length>=3&&results.length===0&&<div className="empty"><i className="ti ti-search"/><p>Клиент не найден: "{q}"</p></div>}
  </div>;
}

// ═══ TASKS ═══
function Tasks({clients,managers,onOpen}){
  const all=clients.flatMap(c=>c.tasks.map(t=>({...t,cFio:c.fio,client:c})));
  const open=all.filter(t=>!t.done);
  const overdue=open.filter(t=>t.due&&t.due<today());
  const todayT=open.filter(t=>t.due===today());
  const rest=open.filter(t=>!t.due||(t.due>today()));
  return <div>
    <div className="mg mg3" style={{marginBottom:16}}>
      {[{l:'Открытых',v:open.length,c:'#f59e0b'},{l:'🔴 Просрочено',v:overdue.length,c:'#ef4444'},{l:'Завершено',v:all.filter(t=>t.done).length,c:'#10b981'}]
        .map(({l,v,c})=><div key={l} className="mc" style={{'--c':c}}><div className="mc-l">{l}</div><div className="mc-v">{v}</div></div>)}
    </div>
    {overdue.length>0&&<div style={{background:'var(--danger-bg)',border:'2px solid #fecaca',borderRadius:14,overflow:'hidden',marginBottom:14}}>
      <div style={{padding:'12px 14px',fontWeight:800,fontSize:13,color:'var(--danger)',borderBottom:'1px solid #fecaca',background:'#fff5f5'}}>🔴 Просроченные ({overdue.length})</div>
      <div className="tbl-wrap" style={{border:'none',borderRadius:0}}>
        <table><thead><tr>{['Задача','Клиент','Срок',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{overdue.map(t=><tr key={t.id} onClick={()=>onOpen(t.client)}>
          <td style={{fontWeight:700}}>{t.type}{t.text&&<div style={{fontSize:11,color:'var(--muted)'}}>{t.text}</div>}</td>
          <td style={{fontWeight:600}}>{t.cFio}</td>
          <td style={{color:'var(--danger)',fontWeight:700}}>{t.due} ⚠️</td>
          <td><i className="ti ti-arrow-right" style={{color:'var(--light)'}}/></td>
        </tr>)}</tbody></table>
      </div>
    </div>}
    {todayT.length>0&&<div style={{marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:13,color:'var(--accent)',marginBottom:10}}>📅 Сегодня ({todayT.length})</div>
      <div className="tbl-wrap"><table><thead><tr>{['Задача','Клиент',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{todayT.map(t=><tr key={t.id} onClick={()=>onOpen(t.client)}>
        <td style={{fontWeight:600}}>{t.type}{t.text&&<div style={{fontSize:11,color:'var(--muted)'}}>{t.text}</div>}</td>
        <td>{t.cFio}</td><td><i className="ti ti-arrow-right" style={{color:'var(--light)'}}/></td>
      </tr>)}</tbody></table></div>
    </div>}
    {rest.length>0&&<div>
      <div style={{fontWeight:800,fontSize:13,color:'var(--muted)',marginBottom:10}}>📋 Остальные ({rest.length})</div>
      <div className="tbl-wrap"><table><thead><tr>{['Задача','Клиент','Срок',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{rest.map(t=><tr key={t.id} onClick={()=>onOpen(t.client)}>
        <td style={{fontWeight:600}}>{t.type}{t.text&&<div style={{fontSize:11,color:'var(--muted)'}}>{t.text}</div>}</td>
        <td>{t.cFio}</td><td style={{color:'var(--muted)',fontSize:12}}>{t.due||'—'}</td>
        <td><i className="ti ti-arrow-right" style={{color:'var(--light)'}}/></td>
      </tr>)}</tbody></table></div>
    </div>}
  </div>;
}

// ═══ KPI ═══
function KPI({clients,managers,user}){
  const [period,setPeriod]=useState('month');
  const range=period==='week'?wkStart():period==='month'?moStart():'2000-01-01';
  const stats=managers.map(m=>{
    const all=clients.filter(c=>c.manager===m.id);
    const pCl=all.filter(c=>c.createdAt>=range);
    const ct=all.filter(c=>c.contractType);
    const pCt=pCl.filter(c=>c.contractType);
    const rev=ct.reduce((s,c)=>s+c.contractAmount,0);
    const pRev=pCt.reduce((s,c)=>s+c.contractAmount,0);
    const appr=all.filter(c=>['approval','deal','issuance','closed'].includes(c.stage));
    const clsd=all.filter(c=>c.stage==='closed');
    const tasks=all.flatMap(c=>c.tasks);
    const ovrdue=tasks.filter(t=>!t.done&&t.due&&t.due<today());
    const conv=all.length?Math.round(ct.length/all.length*100):0;
    return {m,all:all.length,pLeads:pCl.length,contracts:ct.length,pCt:pCt.length,rev,pRev,approved:appr.length,closed:clsd.length,conv,convCA:ct.length?Math.round(appr.length/ct.length*100):0,overdue:ovrdue.length,done:tasks.filter(t=>t.done).length,total:tasks.length};
  }).sort((a,b)=>b.rev-a.rev);
  const maxRev=Math.max(...stats.map(s=>s.rev),1);
  const totalRev=stats.reduce((s,x)=>s+x.rev,0);

  return <div>
    <div style={{display:'flex',gap:8,marginBottom:20}}>
      {[{id:'week',l:'Неделя'},{id:'month',l:'Месяц'},{id:'all',l:'Всё время'}].map(p=><button key={p.id} className={`btn${period===p.id?' btn-primary':' btn-ghost'}`} onClick={()=>setPeriod(p.id)}>{p.l}</button>)}
    </div>
    <div className="mg mg4" style={{marginBottom:18}}>
      {[{l:'Всего клиентов',v:clients.length,c:'#6366f1'},{l:'Договоров',v:clients.filter(c=>c.contractType).length,c:'#ec4899'},{l:'Выручка',v:fmt(totalRev)+' ₸',c:'#10b981'},{l:'Закрыто',v:clients.filter(c=>c.stage==='closed').length,c:'#22c55e'}]
        .map(({l,v,c})=><div key={l} className="mc" style={{'--c':c}}><div className="mc-l">{l}</div><div className="mc-v">{v}</div></div>)}
    </div>
    {stats.map(s=><div key={s.m.id} style={{background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:16,padding:'18px',marginBottom:12,boxShadow:'var(--sh)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
        <div style={{width:44,height:44,borderRadius:14,background:s.m.color+'22',color:s.m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:18,flexShrink:0}}>{s.m.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:800,fontSize:15}}>{s.m.name}</div><div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{s.all} клиентов · {s.contracts} договоров · конверсия {s.conv}%</div></div>
        <div style={{textAlign:'right'}}><div style={{fontWeight:900,fontSize:22,color:s.m.color,letterSpacing:'-1px'}}>{fmt(s.rev)} ₸</div><div style={{fontSize:11,color:'var(--muted)'}}>всего выручки</div></div>
      </div>
      <div className="kpi-bar" style={{height:8,background:'var(--border)',borderRadius:20,overflow:'hidden',marginBottom:12}}>
        <div style={{height:'100%',width:`${Math.round(s.rev/maxRev*100)}%`,background:s.m.color,borderRadius:20,transition:'width .4s'}}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:7}}>
        {[['В работе',s.all-s.closed,'#0ea5e9'],['Дог.',s.contracts,'#ec4899'],['Одобр.',s.approved,'#10b981'],['Закр.',s.closed,'#22c55e'],['Лид→Дог',s.conv+'%',s.conv>=50?'#10b981':s.conv>=25?'#f59e0b':'#ef4444'],['Дог→Одоб',s.convCA+'%',s.convCA>=50?'#10b981':s.convCA>=25?'#f59e0b':'#ef4444'],['Задачи',`${s.done}/${s.total}`,'#14b8a6'],['Просроч.',s.overdue,s.overdue>0?'#ef4444':'#10b981']]
          .map(([l,v,c])=><div key={l} style={{background:'#f8fafc',border:'1px solid var(--border)',borderRadius:10,padding:'9px 6px',textAlign:'center'}}>
            <div style={{fontWeight:800,fontSize:16,color:c,letterSpacing:'-.5px'}}>{v}</div>
            <div style={{fontSize:9,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em',marginTop:3}}>{l}</div>
          </div>)}
      </div>
      <div style={{marginTop:10,padding:'9px 12px',background:'#f8fafc',borderRadius:10,display:'flex',gap:20,flexWrap:'wrap'}}>
        <span style={{fontSize:12}}><span style={{color:'var(--muted)'}}>За период: </span><b style={{color:s.m.color}}>{s.pLeads} лидов</b></span>
        <span style={{fontSize:12}}><span style={{color:'var(--muted)'}}>Договоров: </span><b style={{color:s.m.color}}>{s.pCt}</b></span>
        <span style={{fontSize:12}}><span style={{color:'var(--muted)'}}>Выручка: </span><b style={{color:s.m.color}}>{fmt(s.pRev)} ₸</b></span>
      </div>
    </div>)}
  </div>;
}

// ═══ ADMIN PANEL ═══
function AdminPanel({store,managers,pipeline,checklists,onSaveManager,onDelManager,onSaveChecklist,onSavePipeline,onModal}){
  const [tab,setTab]=useState('managers');
  return <div>
    <div style={{background:'linear-gradient(135deg,var(--navy),#1e3a5f)',borderRadius:16,padding:'18px',marginBottom:18,color:'#fff'}}>
      <div style={{fontSize:20,fontWeight:900,marginBottom:4}}>⚙️ Панель техника</div>
      <div style={{fontSize:13,color:'#94a3b8'}}>Полный контроль над системой. Вы можете изменить всё что угодно.</div>
    </div>
    <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
      {[{id:'managers',l:'👤 Менеджеры'},{id:'pipeline',l:'🔄 Воронка'},{id:'checklists',l:'✅ Чек-листы'},{id:'users',l:'🔐 Пользователи'}].map(t=><button key={t.id} className={`btn${tab===t.id?' btn-primary':' btn-ghost'}`} onClick={()=>setTab(t.id)}>{t.l}</button>)}
    </div>

    {/* MANAGERS */}
    {tab==='managers'&&<>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:16}}>Менеджеры ({managers.length})</div>
        <button className="btn btn-primary" onClick={()=>onModal({type:'mgr_edit',item:{id:uid(),name:'',phone:'',role:'manager',color:'#3b82f6',active:true}})}><i className="ti ti-plus"/>Добавить</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {managers.map(m=><div key={m.id} className="card cp" style={{border:`2px solid ${m.color}33`}}>
          <div style={{display:'flex',gap:12,marginBottom:12,alignItems:'center'}}>
            <div style={{width:46,height:46,borderRadius:14,background:m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:18}}>{m.name[0]}</div>
            <div style={{flex:1}}><div style={{fontWeight:800,fontSize:15}}>{m.name}</div><div style={{fontSize:12,color:'var(--muted)'}}>{m.phone}</div></div>
            <span style={{background:m.active?'#f0fdf4':'#fef2f2',color:m.active?'var(--success)':'var(--danger)',border:`1px solid ${m.active?'#bbf7d0':'#fecaca'}`,borderRadius:20,padding:'3px 9px',fontSize:11,fontWeight:700}}>{m.active?'Активен':'Неакт.'}</span>
          </div>
          <div className="color-row" style={{marginBottom:12}}>
            {COLORS.map(c=><div key={c} className={`color-dot${m.color===c?' sel':''}`} style={{background:c}} onClick={()=>onSaveManager({...m,color:c})}/>)}
          </div>
          <div style={{display:'flex',gap:7}}>
            <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>onModal({type:'mgr_edit',item:{...m}})}><i className="ti ti-edit"/>Изменить</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>onSaveManager({...m,active:!m.active})}>{m.active?<i className="ti ti-eye-off"/>:<i className="ti ti-eye"/>}</button>
            <button className="btn btn-danger btn-sm" onClick={()=>onDelManager(m.id)}><i className="ti ti-trash"/></button>
          </div>
        </div>)}
      </div>
    </>}

    {/* PIPELINE */}
    {tab==='pipeline'&&<>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:16}}>Этапы воронки ({pipeline.length})</div>
        <button className="btn btn-primary" onClick={()=>onModal({type:'pipe_edit'})}><i className="ti ti-edit"/>Редактировать воронку</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {pipeline.map((p,i)=><div key={p.id} className="card cp" style={{display:'flex',alignItems:'center',gap:12,border:`1.5px solid ${p.c}33`}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--muted)',width:24}}>{i+1}.</span>
          <span className="dot" style={{background:p.c,width:10,height:10}}/>
          <span style={{flex:1,fontWeight:700,fontSize:14,color:p.c}}>{p.l}</span>
          <span style={{fontFamily:'monospace',fontSize:11,color:'var(--light)',background:'#f1f5f9',padding:'2px 7px',borderRadius:5}}>{p.id}</span>
          <div style={{display:'flex',gap:6}}>
            {COLORS.map(c=><div key={c} className={`color-dot${p.c===c?' sel':''}`} style={{background:c,width:18,height:18}} onClick={()=>onSavePipeline(pipeline.map(x=>x.id===p.id?{...x,c}:x))}/>)}
          </div>
        </div>)}
      </div>
    </>}

    {/* CHECKLISTS */}
    {tab==='checklists'&&<>
      <div style={{fontWeight:800,fontSize:16,marginBottom:8}}>Чек-листы по этапам</div>
      <div style={{background:'var(--warn-bg)',border:'1.5px solid #fde68a',borderRadius:12,padding:'12px 14px',marginBottom:14,fontSize:13,color:'#92400e',display:'flex',gap:8,alignItems:'center'}}>
        <i className="ti ti-info-circle" style={{fontSize:16}}/>Нажмите на этап чтобы настроить пункты. Типы: ✓ Пункт, 🔏 ЭЦП, 📄 Документ
      </div>
      {ACCOMP.map(stage=>{
        const items=checklists[stage]||[];
        return <div key={stage} className="card cp" style={{marginBottom:9,cursor:'pointer',border:'1.5px solid var(--border)',transition:'all .15s'}} onClick={()=>onModal({type:'cl_edit',stage,items:JSON.parse(JSON.stringify(items))})} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>{stage}</div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {items.slice(0,5).map(item=><span key={item.id} style={{background:TP_BG[item.tp||'check'],border:`1px solid`,borderColor:TP_COL[item.tp||'check']+'33',borderRadius:6,padding:'2px 8px',fontSize:11,color:TP_COL[item.tp||'check'],display:'inline-flex',alignItems:'center',gap:3,fontWeight:600}}>
                  <i className={`ti ${TP_ICON[item.tp||'check']}`} style={{fontSize:10}}/>{item.t}
                </span>)}
                {items.length>5&&<span style={{fontSize:11,color:'var(--muted)',fontStyle:'italic'}}>+{items.length-5}</span>}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontWeight:700,fontSize:13,color:'var(--muted)'}}>{items.length} пунктов</span>
              <button className="btn btn-ghost btn-sm"><i className="ti ti-edit"/>Настроить</button>
            </div>
          </div>
        </div>;
      })}
    </>}

    {/* USERS */}
    {tab==='users'&&<>
      <div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Пользователи системы</div>
      <div style={{background:'var(--warn-bg)',border:'1.5px solid #fde68a',borderRadius:12,padding:'12px 14px',marginBottom:14,fontSize:13,color:'#92400e'}}>
        <i className="ti ti-info-circle"/> Для добавления пользователей нужна версия с Supabase Auth. Сейчас: localStorage. Логины/пароли можно изменить в коде файла (массив DEF_USERS).
      </div>
      <div className="tbl-wrap">
        <table>
          <thead><tr>{['Пользователь','Логин','Пароль','Роль'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>{(store.users||DEF_USERS).map(u=>{const r=ROLE[u.role];return <tr key={u.id}>
            <td style={{fontWeight:700}}>{u.name}</td>
            <td style={{fontFamily:'monospace',color:'var(--muted)'}}>{u.login}</td>
            <td style={{fontFamily:'monospace',color:'var(--muted)'}}>{u.pwd}</td>
            <td>{r&&<Tag c={r.c}>{r.l}</Tag>}</td>
          </tr>;})}
          </tbody>
        </table>
      </div>
    </>}
  </div>;
}

// ═══ MODALS ═══
function ClientEditModal({client,isNew,managers,user,onSave,onDelete,onClose}){
  const [f,sf]=useState({...client});
  const set=(k,v)=>sf(x=>({...x,[k]:v}));
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-md">
      <MH title={isNew?'Новый клиент':'Редактировать клиента'} onClose={onClose}/>
      <div className="modal-body" style={{padding:'16px 20px'}}>
        <div className="row3">
          <Fl l="ФИО *" ch={<input className="inp" value={f.fio} onChange={e=>set('fio',e.target.value)} placeholder="Фамилия Имя"/>}/>
          <Fl l="ИИН" ch={<input className="inp" value={f.iin} onChange={e=>set('iin',e.target.value)} placeholder="123456789012" maxLength={12}/>}/>
          <Fl l="Телефон *" ch={<input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="+7 701 ..."/>}/>
        </div>
        <div className="row3">
          <Fl l="Город" ch={<select className="inp" value={f.city} onChange={e=>set('city',e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select>}/>
          <Fl l="Менеджер" ch={<select className="inp" value={f.manager} onChange={e=>set('manager',e.target.value)}><option value="">—</option>{managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>}/>
          <Fl l="Источник" ch={<select className="inp" value={f.source} onChange={e=>set('source',e.target.value)}>{SOURCES.map(s=><option key={s.id} value={s.id}>{s.l}</option>)}</select>}/>
        </div>
        <div className="row2">
          <Fl l="Этап" ch={<select className="inp" value={f.stage} onChange={e=>set('stage',e.target.value)}>{PIPELINE.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}</select>}/>
          <Fl l="КИ" ch={<select className="inp" value={f.creditStatus} onChange={e=>set('creditStatus',e.target.value)}>{CREDIT_ST.map(c=><option key={c.id} value={c.id}>{c.l}</option>)}</select>}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 13px',background:'#f8fafc',borderRadius:12,border:'2px solid var(--border)',marginBottom:14}}>
          <i className="ti ti-brand-whatsapp" style={{fontSize:19,color:'#25d366'}}/>
          <span style={{fontWeight:600,flex:1}}>Лид из WhatsApp</span>
          <Toggle on={f.isWhatsApp} onClick={()=>set('isWhatsApp',!f.isWhatsApp)}/>
        </div>
        <Fl l="Контактный статус" ch={<div className="status-row">{CONTACT_ST.map(s=><button key={s} className={`status-chip${f.contactStatus===s?' act':''}`} onClick={()=>set('contactStatus',s)}>{s}</button>)}</div>}/>
        <Fl l="Договор" ch={<select className="inp" value={f.contractType} onChange={e=>{const ct=CONTRACTS.find(x=>x.id===e.target.value);sf(x=>({...x,contractType:e.target.value,contractAmount:ct?.a||x.contractAmount}));}}>
          <option value="">Не выбран</option>{CONTRACTS.map(c=><option key={c.id} value={c.id}>{c.l}{c.a>0?' — '+fmt(c.a)+' ₸':''}</option>)}
        </select>}/>
        {f.contractType&&<Fl l="Сумма договора (₸)" ch={<input className="inp" type="number" value={f.contractAmount} onChange={e=>set('contractAmount',+e.target.value)}/>}/>}
        <div className="row2">
          <Fl l="Офиц. доход (₸)" ch={<input className="inp" type="number" value={f.officialIncome} onChange={e=>set('officialIncome',e.target.value)}/>}/>
          <Fl l="Доп. доход (₸)" ch={<input className="inp" type="number" value={f.extraIncome} onChange={e=>set('extraIncome',e.target.value)}/>}/>
        </div>
        {!isNew&&<div style={{marginTop:8}}><button className="btn btn-danger btn-sm" onClick={()=>onDelete(f.id)}><i className="ti ti-trash"/>Удалить клиента</button></div>}
      </div>
      <MA onClose={onClose} onSave={()=>onSave(f)} label={isNew?'Создать клиента':'Сохранить'}/>
    </div>
  </div>;
}

function MgrModal({item,onSave,onClose}){
  const [f,sf]=useState({...item});
  const set=(k,v)=>sf(x=>({...x,[k]:v}));
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-sm">
      <MH title={item.name?`Изменить: ${item.name}`:'Новый менеджер'} onClose={onClose}/>
      <div style={{padding:'16px 20px'}}>
        <Fl l="ФИО *" ch={<input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Фамилия Имя"/>}/>
        <Fl l="Телефон" ch={<input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="+7 701 000-00-00"/>}/>
        <Fl l="Роль" ch={<select className="inp" value={f.role} onChange={e=>set('role',e.target.value)}>{ROLES.filter(r=>r.id!=='admin').map(r=><option key={r.id} value={r.id}>{r.l}</option>)}</select>}/>
        <Fl l="Цвет" ch={<div className="color-row">{COLORS.map(c=><div key={c} className={`color-dot${f.color===c?' sel':''}`} style={{background:c}} onClick={()=>set('color',c)}/>)}</div>}/>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 13px',background:'#f8fafc',borderRadius:12,border:'2px solid var(--border)',marginTop:4}}>
          <span style={{fontWeight:600,flex:1}}>Активен</span><Toggle on={f.active!==false} onClick={()=>set('active',!f.active)}/>
        </div>
      </div>
      <MA onClose={onClose} onSave={()=>onSave(f)}/>
    </div>
  </div>;
}

function ChecklistEditModal({stage,items:init,onSave,onClose}){
  const [items,setItems]=useState([...(init||[])]);
  const [nItem,setNItem]=useState({t:'',tp:'check'});
  function add(){if(!nItem.t.trim())return;setItems(x=>[...x,{id:uid(),...nItem}]);setNItem({t:'',tp:'check'});}
  function del(id){setItems(x=>x.filter(i=>i.id!==id));}
  function move(id,dir){const idx=items.findIndex(i=>i.id===id);if(idx<0)return;const arr=[...items];const t=arr[idx];arr[idx]=arr[idx+dir];arr[idx+dir]=t;setItems(arr);}
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-lg">
      <MH title={`Чек-лист: ${stage}`} sub={`${items.length} пунктов`} onClose={onClose}/>
      <div className="modal-body" style={{padding:'16px 20px'}}>
        <div style={{background:'#f8fafc',borderRadius:14,padding:'14px',border:'1.5px solid var(--border)',marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>Добавить пункт</div>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            {[{id:'check',l:'✓ Пункт'},{id:'ecp',l:'🔏 ЭЦП'},{id:'doc',l:'📄 Документ'}].map(t=><button key={t.id} className={`btn btn-sm${nItem.tp===t.id?' btn-primary':' btn-ghost'}`} onClick={()=>setNItem(x=>({...x,tp:t.id}))}>{t.l}</button>)}
          </div>
          <div style={{display:'flex',gap:8}}>
            <input className="inp" value={nItem.t} onChange={e=>setNItem(x=>({...x,t:e.target.value}))} placeholder="Текст пункта..." onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1}}/>
            <button className="btn btn-primary" onClick={add}><i className="ti ti-plus"/>Добавить</button>
          </div>
        </div>
        {items.length===0&&<div className="empty"><i className="ti ti-list-check"/><p>Добавьте пункты</p></div>}
        {items.map((item,idx)=><div key={item.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'#f8fafc',borderRadius:10,border:'1.5px solid var(--border)',marginBottom:7}}>
          <div style={{width:28,height:28,borderRadius:8,background:TP_BG[item.tp||'check'],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <i className={`ti ${TP_ICON[item.tp||'check']}`} style={{fontSize:14,color:TP_COL[item.tp||'check']}}/>
          </div>
          <span style={{flex:1,fontSize:13,fontWeight:500}}>{item.t}</span>
          <span style={{fontSize:10,fontWeight:700,background:TP_BG[item.tp||'check'],color:TP_COL[item.tp||'check'],borderRadius:6,padding:'2px 7px'}}>{TP_LBL[item.tp||'check']}</span>
          <div style={{display:'flex',gap:4}}>
            <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>idx>0&&move(item.id,-1)} disabled={idx===0} style={{opacity:idx===0?.3:1}}><i className="ti ti-arrow-up" style={{fontSize:12}}/></button>
            <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>idx<items.length-1&&move(item.id,1)} disabled={idx===items.length-1} style={{opacity:idx===items.length-1?.3:1}}><i className="ti ti-arrow-down" style={{fontSize:12}}/></button>
            <button className="btn btn-danger btn-sm btn-icon" onClick={()=>del(item.id)}><i className="ti ti-trash" style={{fontSize:12}}/></button>
          </div>
        </div>)}
      </div>
      <MA onClose={onClose} onSave={()=>onSave(stage,items)} label="Сохранить чек-лист"/>
    </div>
  </div>;
}

function PipelineEditModal({pipeline,onSave,onClose}){
  const [stages,setStages]=useState(JSON.parse(JSON.stringify(pipeline)));
  function upd(id,field,val){setStages(s=>s.map(x=>x.id===id?{...x,[field]:val}:x));}
  function add(){setStages(s=>[...s,{id:'stage_'+uid(),l:'Новый этап',c:'#64748b'}]);}
  function del(id){setStages(s=>s.filter(x=>x.id!==id));}
  function move(id,dir){const idx=stages.findIndex(x=>x.id===id);if(idx<0)return;const arr=[...stages];const t=arr[idx];arr[idx]=arr[idx+dir];arr[idx+dir]=t;setStages(arr);}
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-lg">
      <MH title="Редактировать воронку" sub="Изменяйте этапы, порядок, цвета" onClose={onClose}/>
      <div className="modal-body" style={{padding:'16px 20px'}}>
        <button className="btn btn-primary btn-sm" onClick={add} style={{marginBottom:14}}><i className="ti ti-plus"/>Добавить этап</button>
        {stages.map((p,i)=><div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',background:'#f8fafc',borderRadius:12,border:'1.5px solid var(--border)',marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--muted)',width:22}}>{i+1}.</span>
          <input className="inp" value={p.l} onChange={e=>upd(p.id,'l',e.target.value)} style={{flex:1,minWidth:0}}/>
          <div className="color-row" style={{gap:5}}>
            {COLORS.map(c=><div key={c} className={`color-dot${p.c===c?' sel':''}`} style={{background:c,width:20,height:20}} onClick={()=>upd(p.id,'c',c)}/>)}
          </div>
          <div style={{display:'flex',gap:4}}>
            <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>i>0&&move(p.id,-1)} style={{opacity:i===0?.3:1}}><i className="ti ti-arrow-up" style={{fontSize:12}}/></button>
            <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>i<stages.length-1&&move(p.id,1)} style={{opacity:i===stages.length-1?.3:1}}><i className="ti ti-arrow-down" style={{fontSize:12}}/></button>
            <button className="btn btn-danger btn-sm btn-icon" onClick={()=>del(p.id)}><i className="ti ti-trash" style={{fontSize:12}}/></button>
          </div>
        </div>)}
      </div>
      <MA onClose={onClose} onSave={()=>onSave(stages)} label="Сохранить воронку"/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
