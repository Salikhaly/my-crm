<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ипотека CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --accent:#3b82f6;--accent2:#1d4ed8;--accent-bg:#eff6ff;
  --success:#10b981;--success-bg:#f0fdf4;
  --warn:#f59e0b;--warn-bg:#fffbeb;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --purple:#8b5cf6;--purple-bg:#f5f3ff;
  --teal:#14b8a6;--orange:#f97316;--pink:#ec4899;
  --bg:#f0f4f8;--card:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 20px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sb{width:230px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo-icon{font-size:26px;margin-bottom:6px}
.sb-logo-title{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px}
.sb-logo-sub{font-size:11px;color:#475569;margin-top:2px}
.sb-nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.sb-section{padding:10px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;color:#374151;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#64748b;font-size:13px;font-weight:500;transition:all .15s;user-select:none;border:none;background:transparent;width:100%;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#94a3b8}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600}
.nav-btn i{font-size:18px;width:20px;flex-shrink:0}
.nav-chip{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff}
.nav-btn.active .nav-chip{background:rgba(255,255,255,.25)}
.sb-footer{padding:14px;border-top:1px solid rgba(255,255,255,.06)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer}
.user-pill:hover{background:rgba(255,255,255,.08)}
.user-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:#94a3b8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-role{font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;white-space:nowrap}

/* ── MAIN ── */
.main{flex:1;overflow:auto;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.topbar-title{font-size:18px;font-weight:800;letter-spacing:-.4px;flex:1}
.content{padding:22px 24px;flex:1}

/* ── BUTTONS ── */
.btn{padding:9px 16px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh);white-space:nowrap;line-height:1}
.btn:hover{background:var(--bg);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{background:var(--accent2)}
.btn-success{background:var(--success);color:#fff;border-color:transparent}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--bg);transform:none}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:14px}
.btn-icon{padding:8px;border-radius:10px;width:36px;height:36px;justify-content:center}

/* ── CARDS ── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--sh)}
.card-p{padding:18px}

/* ── METRIC CARDS ── */
.metric-grid{display:grid;gap:12px;margin-bottom:20px}
.metric-grid-4{grid-template-columns:repeat(4,1fr)}
.metric-grid-3{grid-template-columns:repeat(3,1fr)}
.metric-grid-2{grid-template-columns:repeat(2,1fr)}
.m-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.m-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.m-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--c,var(--accent));border-radius:4px 4px 0 0}
.m-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.m-value{font-size:28px;font-weight:800;letter-spacing:-1px;color:var(--c,var(--text));line-height:1}
.m-sub{font-size:11px;color:var(--light);margin-top:5px}
.m-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.08}

/* ── TABLE ── */
.tbl-wrap{border-radius:16px;overflow:hidden;border:1.5px solid var(--border);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--border);background:#f8fafc}
td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:#f8fafc}

/* ── INPUT ── */
.input{background:#f8fafc;border:1.5px solid var(--border2);border-radius:10px;padding:10px 13px;color:var(--text);font-size:13px;font-family:inherit;width:100%;outline:none;transition:all .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12);background:#fff}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:72px}
.input-lg{padding:12px 15px;font-size:15px;border-radius:12px}
.field{margin-bottom:14px}
.field-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── BADGE ── */
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dot{display:inline-block;border-radius:50%;flex-shrink:0}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}

/* ── KANBAN ── */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}
.kanban::-webkit-scrollbar{height:6px}
.kanban::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.k-col{background:#f0f4f8;border:1.5px solid var(--border);border-radius:16px;min-width:190px;flex:0 0 190px;display:flex;flex-direction:column;transition:all .15s}
.k-col.dov{border-color:var(--accent);background:var(--accent-bg)}
.k-head{padding:12px 13px 10px;border-bottom:1.5px solid var(--border)}
.k-stage-row{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.k-cnt{font-size:11px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:1px 7px;color:var(--muted);margin-left:auto;font-weight:600}
.k-total{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.k-body{padding:8px;flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:65vh}
.k-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
.k-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1),var(--sh2);transform:translateY(-2px)}
.k-name{font-size:13px;font-weight:700;margin-bottom:2px}
.k-phone{font-size:11px;color:var(--muted);margin-bottom:6px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.25);max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-xl{width:980px}
.modal-lg{width:700px}
.modal-md{width:520px}
.modal-sm{width:420px}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid var(--border);flex-shrink:0}
.modal-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
.modal-body{flex:1;overflow-y:auto}
.modal-ft{padding:14px 22px;border-top:1.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* ── TABS ── */
.tabs-wrap{display:flex;gap:0;padding:0 22px;border-bottom:1.5px solid var(--border);background:#f8fafc;overflow-x:auto;flex-shrink:0}
.tabs-wrap::-webkit-scrollbar{height:3px}
.tab{padding:12px 15px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .15s;margin-bottom:-1.5px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.tab-body{padding:20px 22px}

/* ── STAGE DOTS ── */
.stage-line{display:flex;overflow-x:auto;padding:4px 0 8px;gap:0}
.stage-line::-webkit-scrollbar{height:4px}
.stage-step{flex:1;min-width:65px;text-align:center;position:relative;cursor:pointer}
.stage-step::before{content:'';position:absolute;top:12px;left:0;right:0;height:2px;background:var(--border);z-index:0}
.stage-step:first-child::before{left:50%}
.stage-step:last-child::before{right:50%}
.s-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:10px;font-weight:700;position:relative;z-index:1;color:var(--muted);transition:all .2s;cursor:pointer}
.s-dot.done{background:var(--success);border-color:var(--success);color:#fff}
.s-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(59,130,246,.2)}
.s-dot.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.s-label{font-size:9px;color:var(--muted);line-height:1.2;font-weight:500}
.s-label.active{color:var(--accent);font-weight:700}
.s-label.done{color:var(--success)}

/* ── CHECKLIST ── */
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .1s;border:1.5px solid transparent}
.cl-item:hover{background:#f8fafc;border-color:var(--border)}
.cl-item.done-item{background:#f0fdf4;border-color:#bbf7d0}
.cl-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cl-box.checked{border-color:var(--success);background:var(--success)}

/* ── PROGRESS ── */
.prog{height:8px;background:var(--border);border-radius:20px;overflow:hidden}
.prog-bar{height:100%;border-radius:20px;transition:width .4s}
.prog-sm{height:5px}
.prog-xs{height:4px}

/* ── TOGGLE ── */
.toggle{width:44px;height:24px;background:var(--border2);border-radius:20px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:23px}

/* ── SEARCH ── */
.search-wrap{position:relative}
.search-wrap i.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-wrap input{padding-left:36px}

/* ── IIN SEARCH ── */
.iin-result{background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:16px;margin-top:10px;cursor:pointer;transition:all .15s}
.iin-result:hover{background:var(--accent-bg);box-shadow:var(--sh2)}

/* ── CREDIT GRID ── */
.cr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cr-opt{border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;text-align:center;transition:all .15s}
.cr-opt:hover{border-color:var(--border2);transform:translateY(-1px)}
.cr-opt.sel{border-color:var(--accent);background:var(--accent-bg)}

/* ── COMMENT/TASK ── */
.c-item{padding:12px;background:#f8fafc;border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.c-item:last-child{margin-bottom:0}
.c-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:5px}
.task-row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;transition:all .15s}
.task-row:hover{border-color:var(--border2);box-shadow:var(--sh)}
.t-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}

/* ── REPORT TABS ── */
.report-tabs{display:flex;gap:6px;margin-bottom:18px}
.r-tab{padding:8px 18px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.r-tab.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.3)}

/* ── KPI BLOCK ── */
.kpi-mgr{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.kpi-bar{height:8px;background:var(--border);border-radius:20px;overflow:hidden}
.kpi-fill{height:100%;border-radius:20px;transition:width .4s}
.kpi-stat{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.kpi-stat-val{font-size:18px;font-weight:800;letter-spacing:-.5px}
.kpi-stat-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1e3a5f)}
.login-box{background:var(--card);border-radius:24px;padding:40px;width:400px;box-shadow:0 25px 80px rgba(0,0,0,.3)}

/* ── QUICK ACTION ── */
.quick-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 12px;border-radius:16px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;text-align:center;font-weight:600;font-size:13px;color:var(--text);box-shadow:var(--sh)}
.quick-action:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--accent);color:var(--accent)}
.quick-action i{font-size:26px}

/* ── STATUS PILL ── */
.contact-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted)}
.contact-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.contact-btn:hover:not(.active){border-color:var(--border2);color:var(--text)}

/* ── CONTRACT CARD ── */
.ct-card{border:2px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .15s;background:var(--bg)}
.ct-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ct-card.sel{border-color:var(--accent);background:var(--accent-bg)}
.ct-name{font-weight:700;font-size:13px}
.ct-amount{font-weight:800;font-size:16px;color:var(--accent);margin-top:2px}

/* ── ACCOMP STAGE CARD ── */
.accomp-card{border-radius:14px;border:2px solid var(--border);overflow:hidden;margin-bottom:10px;transition:all .15s}
.accomp-card.active-stage{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.1)}
.accomp-card.done-stage{border-color:var(--success)}
.accomp-card-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:#f8fafc}
.accomp-card.active-stage .accomp-card-hd{background:var(--accent-bg)}
.accomp-card.done-stage .accomp-card-hd{background:var(--success-bg)}
.accomp-card-body{padding:14px 16px;border-top:1.5px solid var(--border)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;box-shadow:var(--sh2);display:flex;align-items:center;gap:8px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── SECTION HDR ── */
.sec-hdr{font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;padding-bottom:8px;border-bottom:1.5px solid var(--border)}

/* ── WA ── */
.wa-btn{background:#25d366;color:#fff;border-color:transparent}
.wa-btn:hover{background:#1da851}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state i{font-size:44px;display:block;margin-bottom:12px;opacity:.25}
.empty-state p{font-size:15px;font-weight:500}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const SK='crm_v4';

// ═══════ CONSTANTS ════════
const PIPELINE=[
  {id:'new_lead',l:'Новый лид',c:'#6366f1'},
  {id:'in_work',l:'Взят в работу',c:'#0ea5e9'},
  {id:'analysis',l:'Анализ клиента',c:'#f59e0b'},
  {id:'consultation',l:'Платная консульт.',c:'#a855f7'},
  {id:'contract',l:'Договор',c:'#ec4899'},
  {id:'accompaniment',l:'Сопровождение',c:'#14b8a6'},
  {id:'approval',l:'Одобрение',c:'#10b981'},
  {id:'deal',l:'Сделка',c:'#f97316'},
  {id:'issuance',l:'Выдача ипотеки',c:'#22c55e'},
  {id:'closed',l:'Закрыто',c:'#64748b'},
];
const PL=Object.fromEntries(PIPELINE.map(p=>[p.id,p]));

function nowStr(){return new Date().toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

// ═══════ HELPERS ════════
function MH({title,sub,onClose}){return <div className="modal-hd"><div><div className="modal-title">{title}</div>{sub&&<div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>{sub}</div>}</div><button className="btn btn-ghost btn-icon" onClick={onClose}><i className="ti ti-x"/></button></div>;}
function Fl({label,req,children}){return <div className="field"><div className="field-label">{label}{req&&<span style={{color:'var(--danger)',marginLeft:3}}>*</span>}</div>{children}</div>}
function MA({onClose,onSave,label='Сохранить'}){return <div className="modal-ft"><button className="btn" onClick={onClose}>Отмена</button><button className="btn btn-primary" onClick={onSave}><i className="ti ti-device-floppy"/>{label}</button></div>;}
function Tag({c,children}){return <span className="badge" style={{background:c+'22',color:c}}>{children}</span>}
function StageTag({id}){const p=PL[id];return p?<Tag c={p.c}>{p.l}</Tag>:null}
function SrcTag({id}){const s=SRC[id];return s?<span style={{background:s.c+'22',color:s.c,padding:'2px 7px',borderRadius:4,fontSize:10,fontWeight:700}}>{s.l}</span>:null}
function CrTag({id}){const c=CR[id];return c?<Tag c={c.c}>{c.l}</Tag>:null}
function Toggle({on,onClick}){return <div className={`toggle${on?' on':''}`} onClick={onClick}/>}
function MgrName({id,managers}){const m=(managers||DEF_MANAGERS).find(x=>x.id===id);return <span>{m?m.name:id||'—'}</span>}
function Prog({pct,color,size=''}){return <div className={`prog${size?' prog-'+size:''}`}><div className="prog-bar" style={{width:`${pct}%`,background:color||'var(--accent)'}}/></div>}

// ═══════ APP ════════
function App(){
  const [store,setStore]=useState(()=>{
    try{const s=localStorage.getItem(SK);if(s)return JSON.parse(s);}catch{}
    return {clients:genDemoClients(),managers:DEF_MANAGERS,users:DEF_USERS,stageChecklists:DEFAULT_STAGE_CHECKLISTS};
  });
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [modal,setModal]=useState(null);
  const [search,setSearch]=useState('');
  const [fMgr,setFMgr]=useState('');
  const [fStage,setFStage]=useState('');
  const [dragId,setDragId]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [toast,setToast]=useState(null);
  const toastRef=useRef(null);

  useEffect(()=>{try{localStorage.setItem(SK,JSON.stringify(store));}catch{}},[store]);

  function showToast(msg,type='ok'){setToast({msg,type});clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2800);}
  function upd(fn){setStore(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);return n;});}

  const saveClient=c=>{upd(s=>{const i=s.clients.findIndex(x=>x.id===c.id);i>=0?s.clients.splice(i,1,c):s.clients.push(c);});showToast(c.fio?`✅ ${c.fio} сохранён`:'✅ Клиент добавлен');setModal(null);};
  const delClient=id=>{upd(s=>{s.clients.splice(s.clients.findIndex(x=>x.id===id),1)});showToast('🗑 Удалено');setModal(null);};
  const moveClient=(id,stage)=>{upd(s=>{const c=s.clients.find(x=>x.id===id);if(c)c.stage=stage;});showToast(`📌 ${PL[stage]?.l}`);};
  const saveManager=m=>{upd(s=>{const i=s.managers.findIndex(x=>x.id===m.id);i>=0?s.managers.splice(i,1,m):s.managers.push(m)});showToast('✅ Сохранено');setModal(null);};
  const delManager=id=>{upd(s=>{s.managers.splice(s.managers.findIndex(x=>x.id===id),1)});showToast('🗑 Удалено');setModal(null);};
  const saveStageChecklist=(stage,items)=>{upd(s=>{s.stageChecklists={...s.stageChecklists,[stage]:items}});showToast('✅ Чек-лист сохранён');setModal(null);};

  const mgrs=store.managers||DEF_MANAGERS;
  const stageChecklists=store.stageChecklists||DEFAULT_STAGE_CHECKLISTS;

  const canSee=p=>{
    if(!user)return false;
    const r=user.role;
    if(r==='admin'||r==='head')return true;
    if(r==='manager')return['dashboard','clients','tasks','iin'].includes(p);
    if(r==='specialist')return['dashboard','clients','tasks'].includes(p);
    if(r==='qa')return['dashboard','clients','kpi'].includes(p);
    return false;
  };

  const allClients=store.clients||[];
  const myClients=user?.role==='manager'?allClients.filter(c=>c.manager===user.managerId):allClients;

  const filtered=myClients.filter(c=>{
    if(search){const q=search.toLowerCase();if(!c.fio.toLowerCase().includes(q)&&!c.phone.includes(q)&&!c.iin.includes(q))return false;}
    if(fMgr&&c.manager!==fMgr)return false;
    if(fStage&&c.stage!==fStage)return false;
    return true;
  });

  const NAV=[
    {id:'dashboard',l:'Дашборд',i:'ti-layout-dashboard'},
    {id:'clients',l:'Клиенты',i:'ti-users'},
    {id:'iin',l:'Поиск по ИИН',i:'ti-search'},
    {id:'tasks',l:'Задачи',i:'ti-checkbox'},
    {id:'kpi',l:'KPI и Отчёты',i:'ti-chart-bar'},
    {id:'whatsapp',l:'WhatsApp лиды',i:'ti-brand-whatsapp'},
    {id:'settings',l:'Настройки',i:'ti-settings'},
  ].filter(n=>canSee(n.id)||['settings'].includes(n.id)&&user?.role==='admin');

  if(!user)return <LoginPage users={store.users||DEF_USERS} onLogin={u=>{setUser(u);setPage('dashboard');}}/>;

  const role=ROLE[user.role];

  return <div className="app">
    <div className="sb">
      <div className="sb-logo">
        <div className="sb-logo-icon">🏠</div>
        <div className="sb-logo-title">Ипотека CRM</div>
        <div className="sb-logo-sub">Система управления клиентами</div>
      </div>
      <div className="sb-nav">
        <div className="sb-section">Навигация</div>
        {NAV.map(n=>{
          const cnt=n.id==='tasks'?myClients.flatMap(c=>c.tasks).filter(t=>!t.done).length:n.id==='whatsapp'?myClients.filter(c=>c.isWhatsApp&&c.stage==='new_lead').length:0;
          return <button key={n.id} className={`nav-btn${page===n.id?' active':''}`} onClick={()=>{setPage(n.id);setSearch('');setFMgr('');setFStage('');}}>
            <i className={`ti ${n.i}`}/>{n.l}
            {cnt>0&&<span className="nav-chip">{cnt}</span>}
          </button>;
        })}
        <div className="sb-section" style={{marginTop:12}}>Воронка</div>
        {PIPELINE.map(p=>{
          const cnt=myClients.filter(c=>c.stage===p.id).length;
          return <button key={p.id} className="nav-btn" style={{justifyContent:'space-between'}} onClick={()=>{setPage('clients');setFStage(p.id);}}>
            <span style={{display:'flex',alignItems:'center',gap:8}}><span style={{width:8,height:8,borderRadius:'50%',background:p.c,display:'inline-block'}}/>{p.l}</span>
            {cnt>0&&<span style={{background:p.c+'33',color:p.c,borderRadius:20,padding:'1px 7px',fontSize:10,fontWeight:700}}>{cnt}</span>}
          </button>;
        })}
      </div>
      <div className="sb-footer">
        <div className="user-pill" onClick={()=>setUser(null)} title="Нажмите для выхода">
          <div className="user-av" style={{background:role?.c||'#3b82f6'}}>{user.name[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="user-name">{user.name}</div>
            <span className="user-role" style={{background:role?.c+'22',color:role?.c}}>{role?.l}</span>
          </div>
          <i className="ti ti-logout" style={{fontSize:15,color:'#475569'}}/>
        </div>
      </div>
    </div>

    <div className="main">
      <div className="topbar">
        <div className="topbar-title">{NAV.find(n=>n.id===page)?.l||'CRM'}</div>
        {page==='clients'&&<>
          <div className="search-wrap"><i className="si ti-search"/><input className="input" style={{width:210}} placeholder="Поиск: имя, телефон, ИИН..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          {user.role!=='manager'&&<select className="input" style={{width:150}} value={fMgr} onChange={e=>setFMgr(e.target.value)}><option value="">Все менеджеры</option>{mgrs.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>}
          <select className="input" style={{width:160}} value={fStage} onChange={e=>setFStage(e.target.value)}><option value="">Все этапы</option>{PIPELINE.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}</select>
        </>}
        <button className="btn btn-primary" onClick={()=>setModal({type:'client',item:emptyClient(user.managerId||'')})}><i className="ti ti-plus"/>Новый клиент</button>
        <button className="btn" onClick={()=>setPage('iin')}><i className="ti ti-search"/>Поиск по ИИН</button>
      </div>
      <div className="content">

        {page==='tasks'&&<TasksPage clients={myClients} managers={mgrs} onOpen={c=>setModal({type:'client',item:c})}/>}
        {page==='kpi'&&<KPIPage clients={myClients} managers={mgrs} user={user}/>}

        {page==='settings'&&user.role==='admin'&&<SettingsPage store={store} managers={mgrs} stageChecklists={stageChecklists} onSaveManager={saveManager} onDelManager={delManager} onSaveChecklist={saveStageChecklist} onModal={setModal}/>}

    {modal?.type==='client'&&<ClientModal key={modal.item.id} client={modal.item} managers={mgrs} stageChecklists={stageChecklists} user={user} onSave={saveClient} onDelete={delClient} onClose={()=>setModal(null)}/>}

// ═══════ DASHBOARD ════════
function Dashboard({clients,managers,user,onOpen,onAdd}){
  const now=new Date();
  const ms=monthStart();
  const ws=weekStart();
  const thisMonth=clients.filter(c=>c.createdAt>=ms);
  const thisWeek=clients.filter(c=>c.createdAt>=ws);
  const withCt=clients.filter(c=>c.contractType);
  const rev=withCt.reduce((s,c)=>s+c.contractAmount,0);
  const waCnt=clients.filter(c=>c.isWhatsApp&&c.stage==='new_lead').length;
  const openTasks=clients.flatMap(c=>c.tasks).filter(t=>!t.done).length;

  const topMgrs=managers.map(m=>{
    const mc=clients.filter(c=>c.manager===m.id);
    const ct=mc.filter(c=>c.contractType);
    const r=ct.reduce((s,c)=>s+c.contractAmount,0);
    return {...m,leads:mc.length,contracts:ct.length,revenue:r,conv:mc.length?Math.round(ct.length/mc.length*100):0};
  }).sort((a,b)=>b.revenue-a.revenue);
  const maxRev=Math.max(...topMgrs.map(m=>m.revenue),1);

  return <div>
    <div className="metric-grid metric-grid-4">
      {[
        {l:'Новых лидов',v:thisMonth.length,sub:`${thisWeek.length} за неделю`,c:'#6366f1',i:'ti-user-plus'},
        {l:'Договоров',v:withCt.length,sub:`${Math.round(withCt.length/Math.max(clients.length,1)*100)}% конверсия`,c:'#ec4899',i:'ti-file-certificate'},
        {l:'Выручка',v:fmt(rev)+' ₸',sub:`Среднее: ${fmt(rev/Math.max(withCt.length,1))} ₸`,c:'#10b981',i:'ti-cash'},
        {l:'Открытых задач',v:openTasks,sub:`${waCnt} WhatsApp лидов`,c:openTasks>5?'#ef4444':'#f59e0b',i:'ti-checkbox'},
      ].map(({l,v,sub,c,i})=><div key={l} className="m-card" style={{'--c':c}}>
        <div className="m-label">{l}</div>
        <div className="m-value">{v}</div>
        <div className="m-sub">{sub}</div>
        <i className={`ti ${i} m-icon`}/>
      </div>)}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <div className="card card-p">
        <div style={{fontWeight:800,fontSize:14,marginBottom:14}}>Воронка продаж</div>
        {PIPELINE.map(p=>{
          const cnt=clients.filter(c=>c.stage===p.id).length;
          const pct=Math.round(cnt/Math.max(clients.length,1)*100);
          return <div key={p.id} style={{marginBottom:11}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
              <span style={{display:'flex',alignItems:'center',gap:6,fontWeight:500}}><span style={{width:8,height:8,borderRadius:'50%',background:p.c,display:'inline-block'}}/>{p.l}</span>
              <span style={{fontWeight:700,color:'var(--muted)'}}>{cnt}</span>
            </div>
            <Prog pct={pct} color={p.c} size='sm'/>
          </div>;
        })}
      </div>

      <div className="card card-p">
        <div style={{fontWeight:800,fontSize:14,marginBottom:14}}>Рейтинг менеджеров</div>
        {topMgrs.map((m,i)=><div key={m.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <div style={{width:26,height:26,borderRadius:'50%',background:m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:12,flexShrink:0}}>{m.name[0]}</div>
          <div style={{flex:1}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontWeight:700,fontSize:12}}>{m.name}</span>
              <span style={{fontWeight:800,color:'var(--success)',fontSize:12}}>{m.revenue>0?fmt(m.revenue)+' ₸':'—'}</span>

          <div style={{fontSize:11,color:'var(--muted)',fontWeight:700,flexShrink:0}}>{m.conv}%</div>
        </div>)}
      </div>
    </div>

    {/* Quick actions */}
    <div className="card card-p" style={{marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:14,marginBottom:14}}>Быстрые действия</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
        {[
          {i:'ti-user-plus',l:'Новый клиент',c:'#3b82f6',onClick:onAdd},
          {i:'ti-search',l:'Поиск по ИИН',c:'#8b5cf6',onClick:()=>{}},
          {i:'ti-brand-whatsapp',l:'WhatsApp лид',c:'#25d366',onClick:()=>{}},
          {i:'ti-chart-bar',l:'KPI отчёт',c:'#f59e0b',onClick:()=>{}},
          {i:'ti-list-check',l:'Мои задачи',c:'#14b8a6',onClick:()=>{}},
        ].map(({i,l,c,onClick})=><div key={l} className="quick-action" onClick={onClick} style={{'--c':c}}>
          <i className={`ti ${i}`} style={{fontSize:26,color:c}}/><span style={{fontSize:12,fontWeight:600}}>{l}</span>
        </div>)}

    {/* WhatsApp alert */}
    {waCnt>0&&<div className="card card-p" style={{background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'1.5px solid #86efac'}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>

      </div>

  </div>;
}

// ═══════ IIN SEARCH ════════
function IINSearch({clients,managers,onOpen}){
  const [q,setQ]=useState('');
  const results=q.length>=3?clients.filter(c=>c.iin.includes(q)||c.fio.toLowerCase().includes(q.toLowerCase())||c.phone.includes(q)):[];

  function getProgress(c){
    const total=ACCOMP_STAGES.reduce((s,st)=>{const items=(DEFAULT_STAGE_CHECKLISTS[st]||[]);return s+items.length;},0);
    const done=ACCOMP_STAGES.reduce((s,st,i)=>{const sd=(c.accompStages||{})[i]||{};return s+(sd.done||[]).length;},0);
    return total>0?Math.round(done/total*100):0;
  }

  return <div>
    <div style={{maxWidth:600,margin:'0 auto'}}>
      <div style={{textAlign:'center',marginBottom:24}}>
        <div style={{fontSize:40,marginBottom:8}}>🔍</div>
        <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>Поиск по ИИН</div>
        <div style={{fontSize:14,color:'var(--muted)'}}>Введите ИИН, имя или телефон — мгновенно увидите все данные клиента</div>
      </div>
      <div className="search-wrap" style={{marginBottom:16}}>
        <i className="si ti-search" style={{fontSize:20}}/>
        <input className="input input-lg" value={q} onChange={e=>setQ(e.target.value)} placeholder="Введите ИИН, имя или телефон..." autoFocus style={{paddingLeft:44,fontSize:16}}/>
      </div>
      {q.length>0&&q.length<3&&<div style={{textAlign:'center',color:'var(--muted)',padding:'20px',fontSize:13}}>Введите минимум 3 символа...</div>}
      {results.map(c=>{
        const m=managers.find(x=>x.id===c.manager);
        const p=PL[c.stage];
        const pct=getProgress(c);
        const openTasks=c.tasks.filter(t=>!t.done).length;
        const allItems=ACCOMP_STAGES.reduce((s,st)=>s+(DEFAULT_STAGE_CHECKLISTS[st]||[]).length,0);
        const doneTasks=ACCOMP_STAGES.reduce((s,st,i)=>s+((c.accompStages||{})[i]?.done||[]).length,0);
        return <div key={c.id} className="iin-result" onClick={()=>onOpen(c)}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12}}>
            <div>
              <div style={{fontWeight:800,fontSize:18,marginBottom:3}}>{c.fio||'—'}</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                <span style={{fontSize:12,color:'var(--muted)',fontFamily:'monospace',background:'#f1f5f9',padding:'2px 7px',borderRadius:5}}>ИИН: {c.iin}</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{c.phone}</span>
                <span style={{fontSize:12,color:'var(--muted)'}}>{c.city}</span>
              </div>
            </div>
            {p&&<span className="badge" style={{background:p.c+'22',color:p.c,fontSize:12}}>{p.l}</span>}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:12}}>
            {[
              {l:'Менеджер',v:m?.name||'—',i:'ti-user'},
              {l:'Источник',v:SRC[c.source]?.l||'—',i:'ti-antenna'},
              {l:'Задачи',v:`${openTasks} открытых`,i:'ti-checkbox',warn:openTasks>0},
              {l:'Договор',v:c.contractAmount>0?fmt(c.contractAmount)+' ₸':'—',i:'ti-cash'},
            ].map(({l,v,i,warn})=><div key={l} style={{background:'#f8fafc',borderRadius:8,padding:'8px 10px'}}>
              <div style={{fontSize:10,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',marginBottom:3}}>{l}</div>
              <div style={{fontWeight:700,fontSize:13,color:warn?'var(--warn)':'var(--text)'}}>{v}</div>
            </div>)}
          </div>
          {c.stage==='accompaniment'&&<>
            <div style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:5}}>Прогресс сопровождения: {pct}% ({doneTasks}/{allItems} пунктов)</div>
            <Prog pct={pct} color={pct===100?'var(--success)':pct>50?'var(--accent)':'var(--warn)'} size='sm'/>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:6}}>📍 Остановился на: <b>{ACCOMP_STAGES[c.accompStageIndex]}</b></div>
          </>}
          <div style={{fontSize:11,color:'var(--accent)',fontWeight:600,marginTop:10,display:'flex',alignItems:'center',gap:4}}>
            <i className="ti ti-arrow-right"/>Открыть карточку клиента
          </div>
        </div>;
      })}
      {q.length>=3&&results.length===0&&<div className="empty-state"><i className="ti ti-search"/><p>Клиент не найден по запросу "{q}"</p></div>}
    </div>
  </div>;
}

          <span style={{color:'var(--muted)',fontSize:12}}>{managers.find(m=>m.id===f.manager)?.name}</span>

        {tab==='analysis'&&<AnalysisTab f={f} set={set} canEdit={canEdit}/>}
        {tab==='credit'&&<CreditTab f={f} set={set} canEdit={canEdit}/>}
        {tab==='otbasy'&&<OtbasyTab f={f} set={set}/>}

// ─── ACCOMP TAB ───
function AccompTab({f,set,sf,managers,canEdit,stageChecklists,user}){
  const [activeIdx,setActiveIdx]=useState(f.accompStageIndex||0);
  const [newComments,setNewComments]=useState({});
  const [newTasks,setNewTasks]=useState({});

  const accompStages=f.accompStages||{};
  function getSD(i){return accompStages[i]||{done:[],comments:[],tasks:[]};}
  function setSD(i,data){set('accompStages',{...accompStages,[i]:data});}
  function toggleCheck(si,itemId){
    const sd=getSD(si);const done=sd.done||[];
    setSD(si,{...sd,done:done.includes(itemId)?done.filter(x=>x!==itemId):[...done,itemId]});
  }
  function addComment(si){
    const txt=(newComments[si]||'').trim();if(!txt)return;
    const sd=getSD(si);
    setSD(si,{...sd,comments:[...(sd.comments||[]),{id:uid(),text:txt,date:nowStr(),author:user.name}]});
    setNewComments(x=>({...x,[si]:''}));
  }
  function addStageTask(si){
    const t=newTasks[si];if(!t?.text?.trim())return;
    const task={id:uid(),type:t.type||'📞 Позвонить',text:t.text,due:t.due||'',done:false,created:nowStr(),stage:ACCOMP_STAGES[si],isStageTask:true};
    // add to global tasks
    sf(x=>({...x,tasks:[...(x.tasks||[]),task]}));
    // add to stage
    const sd=getSD(si);
    setSD(si,{...sd,tasks:[...(sd.tasks||[]),task]});
    setNewTasks(x=>({...x,[si]:{type:'📞 Позвонить',text:'',due:''}}));
  }
  function delComment(si,cid){const sd=getSD(si);setSD(si,{...sd,comments:(sd.comments||[]).filter(c=>c.id!==cid)});}
  function toggleStageTask(si,tid){
    const sd=getSD(si);
    setSD(si,{...sd,tasks:(sd.tasks||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)});
    sf(x=>({...x,tasks:(x.tasks||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)}));
  }

  const totalItems=ACCOMP_STAGES.reduce((s,st)=>{const items=(stageChecklists[st]||[]);return s+items.length;},0);
  const totalDone=ACCOMP_STAGES.reduce((s,st,i)=>s+((accompStages[i]?.done)||[]).length,0);
  const overallPct=totalItems>0?Math.round(totalDone/totalItems*100):0;

  return <>
    {/* Header */}
    <div className="field-row" style={{marginBottom:14}}>
      <Fl label="Ответственный менеджер"><select className="input" value={f.responsibleManager} onChange={e=>set('responsibleManager',e.target.value)} disabled={!canEdit}>
        <option value="">Не назначен</option>{managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
      </select></Fl>
      <Fl label="Ипотечный специалист"><input className="input" value={f.mortgageSpecialist} onChange={e=>set('mortgageSpecialist',e.target.value)} placeholder="ФИО специалиста"/></Fl>
    </div>

    {/* Overall progress */}
    <div style={{background:'linear-gradient(135deg,#eff6ff,#f0fdf4)',border:'1.5px solid #bfdbfe',borderRadius:14,padding:'14px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:14,color:'var(--accent)',marginBottom:8}}>Общий прогресс сопровождения</div>
        <Prog pct={overallPct} color={overallPct===100?'var(--success)':'var(--accent)'}/>
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontWeight:900,fontSize:28,color:overallPct===100?'var(--success)':'var(--accent)',letterSpacing:'-1px'}}>{overallPct}%</div>
        <div style={{fontSize:11,color:'var(--muted)'}}>{totalDone}/{totalItems}</div>
      </div>
    </div>

    {/* Stage dots */}
    <div className="stage-line" style={{marginBottom:14}}>
      {ACCOMP_STAGES.map((s,i)=>{
        const items=stageChecklists[s]||[];
        const sd=getSD(i);
        const done=(sd.done||[]).length;
        const allDone=items.length>0&&done===items.length;
        const hasTasks=(sd.tasks||[]).filter(t=>!t.done).length;
        const isActive=activeIdx===i;
        return <div key={s} className="stage-step" onClick={()=>setActiveIdx(i)}>
          {i<ACCOMP_STAGES.length-1&&<div style={{position:'absolute',top:12,left:'50%',right:'-50%',height:2,background:allDone?'var(--success)':isActive?'var(--accent)':'var(--border)',zIndex:0}}/>}
          <div className={`s-dot${allDone?' done':isActive?' active':hasTasks>0?' warn':''}`}>
            {allDone?<i className="ti ti-check" style={{fontSize:10}}/>:hasTasks>0&&!isActive?<i className="ti ti-flag" style={{fontSize:10}}/>:i+1}
          </div>
          <div className={`s-label${isActive?' active':allDone?' done':''}`}>{s}</div>
        </div>;
      })}
    </div>

    {/* Active stage */}
    {ACCOMP_STAGES.map((stageName,si)=>{
      if(si!==activeIdx)return null;
      const items=stageChecklists[stageName]||[];
      const sd=getSD(si);
      const done=sd.done||[];
      const stageTasks=sd.tasks||[];
      const stageComments=sd.comments||[];
      const pct=items.length>0?Math.round(done.length/items.length*100):100;
      const incomplete=items.filter(item=>!done.includes(item.id));
      const isComplete=pct===100||items.length===0;
      const nt=newTasks[si]||{type:'📞 Позвонить',text:'',due:''};

      return <div key={stageName}>
        {/* Stage header card */}
        <div className={`accomp-card${isComplete?' done-stage':' active-stage'}`}>
          <div className="accomp-card-hd">
            <div style={{width:36,height:36,borderRadius:12,background:isComplete?'var(--success)':'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {isComplete?<i className="ti ti-check" style={{fontSize:18,color:'#fff'}}/>:<i className="ti ti-loader" style={{fontSize:18,color:'#fff'}}/>}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:15,color:isComplete?'var(--success)':'var(--accent)'}}>{stageName}</div>

                  <i className={`ti ${ICON_MAP[item.type||'check']}`} style={{fontSize:11,color:ICON_COL[item.type||'check']}}/>{item.text}
                </span>)}

                  <div style={{width:26,height:26,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:TYPE_COL[item.type||'check'],flexShrink:0}}>
                    <i className={`ti ${ICON_MAP[item.type||'check']}`} style={{fontSize:13,color:ICON_COL[item.type||'check']}}/>
                  </div>
                  <span style={{flex:1,fontSize:13,fontWeight:500,textDecoration:isDone?'line-through':'none',color:isDone?'var(--muted)':'var(--text)'}}>{item.text}</span>
                  <span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:6,background:TYPE_COL[item.type||'check'],color:ICON_COL[item.type||'check']}}>{TYPE_LBL[item.type||'check']}</span>

                </div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13,textDecoration:t.done?'line-through':'none',color:t.done?'var(--muted)':'var(--text)'}}>{t.type}</div>
                  {t.text&&<div style={{fontSize:12,color:'var(--muted)'}}>{t.text}</div>}
                  {t.due&&<div style={{fontSize:11,color:t.due<today()&&!t.done?'var(--danger)':'var(--light)'}}>📅 {t.due}</div>}
                </div>
                <div style={{fontSize:10,color:'var(--light)'}}>{t.created}</div>

                <div style={{fontWeight:600,fontSize:12,color:'var(--muted)',marginBottom:8}}>+ Добавить задачу для сотрудника</div>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <select className="input" style={{width:180}} value={nt.type} onChange={e=>setNewTasks(x=>({...x,[si]:{...nt,type:e.target.value}}))}>{TASK_TYPES.map(t=><option key={t}>{t}</option>)}</select>
                  <input className="input" type="date" style={{width:150}} value={nt.due||''} onChange={e=>setNewTasks(x=>({...x,[si]:{...nt,due:e.target.value}}))}/>

                </div>
              </div>}
            </div>

            {/* Comments */}
            <div>
              <div style={{fontWeight:700,fontSize:12,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>💬 Комментарии к этапу ({stageComments.length})</div>
              {stageComments.length===0&&<div style={{color:'var(--light)',fontSize:12,fontStyle:'italic',marginBottom:8,padding:'8px 0'}}>Нет комментариев</div>}
              {stageComments.map(c=><div key={c.id} className="c-item" style={{marginBottom:7}}>
                <div className="c-meta">
                  <i className="ti ti-message" style={{fontSize:12}}/><span style={{fontWeight:700}}>{c.author}</span><span>{c.date}</span>
                  {canEdit&&<button className="btn btn-ghost" style={{padding:'0 4px',fontSize:11,color:'var(--danger)',marginLeft:'auto'}} onClick={()=>delComment(si,c.id)}><i className="ti ti-trash" style={{fontSize:11}}/></button>}
                </div>
                <div style={{fontSize:13,lineHeight:1.5}}>{c.text}</div>
              </div>)}
              {canEdit&&<div style={{display:'flex',gap:8,marginTop:8}}>
                <input className="input" value={newComments[si]||''} onChange={e=>setNewComments(x=>({...x,[si]:e.target.value}))} placeholder={`Заметка к "${stageName}"...`} onKeyDown={e=>e.key==='Enter'&&addComment(si)}/>
                <button className="btn btn-primary btn-sm" onClick={()=>addComment(si)}><i className="ti ti-send"/></button>
              </div>}
            </div>

        </div>

        {/* Navigation */}
        <div style={{display:'flex',justifyContent:'space-between',marginTop:10}}>
          <button className="btn" onClick={()=>setActiveIdx(Math.max(0,si-1))} disabled={si===0} style={{opacity:si===0?.35:1}}><i className="ti ti-arrow-left"/>Предыдущий</button>
          <button className="btn btn-primary" onClick={()=>setActiveIdx(Math.min(ACCOMP_STAGES.length-1,si+1))} disabled={si===ACCOMP_STAGES.length-1} style={{opacity:si===ACCOMP_STAGES.length-1?.35:1}}>Следующий<i className="ti ti-arrow-right"/></button>
        </div>
      </div>;
    })}
  </>;
}

// ─── TASKS TAB ───
function TasksTab({f,set,user,canEdit}){
  const [nTask,setNTask]=useState({type:TASK_TYPES[0],text:'',due:''});
  function addTask(){if(!nTask.text.trim())return;set('tasks',[...f.tasks,{id:uid(),...nTask,done:false,created:nowStr()}]);setNTask({type:TASK_TYPES[0],text:'',due:''});}
  function toggle(id){set('tasks',f.tasks.map(t=>t.id===id?{...t,done:!t.done}:t));}
  function del(id){set('tasks',f.tasks.filter(t=>t.id!==id));}
  const open=f.tasks.filter(t=>!t.done);
  const done=f.tasks.filter(t=>t.done);
  return <>
    {canEdit&&<div style={{background:'#f8fafc',borderRadius:14,padding:'14px',border:'1.5px solid var(--border)',marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>Новая задача</div>
      <div className="field-row">
        <Fl label="Тип задачи"><select className="input" value={nTask.type} onChange={e=>setNTask(x=>({...x,type:e.target.value}))}>{TASK_TYPES.map(t=><option key={t}>{t}</option>)}</select></Fl>
        <Fl label="Срок выполнения"><input className="input" type="date" value={nTask.due} onChange={e=>setNTask(x=>({...x,due:e.target.value}))}/></Fl>
      </div>
      <Fl label="Описание"><input className="input" value={nTask.text} onChange={e=>setNTask(x=>({...x,text:e.target.value}))} placeholder="Что нужно сделать?" onKeyDown={e=>e.key==='Enter'&&addTask()}/></Fl>
      <button className="btn btn-primary" onClick={addTask}><i className="ti ti-plus"/>Добавить задачу</button>
    </div>}
    {open.length===0&&done.length===0&&<div className="empty-state"><i className="ti ti-checkbox"/><p>Нет задач</p></div>}
    {open.map(t=><div key={t.id} className="task-row" style={{marginBottom:8}}>
      <div className="t-chk" style={{borderColor:'var(--border2)'}} onClick={()=>toggle(t.id)}/>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:13}}>{t.type}</div>
        {t.text&&<div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{t.text}</div>}
        {t.due&&<div style={{fontSize:11,color:t.due<today()?'var(--danger)':'var(--light)',marginTop:2,fontWeight:t.due<today()?700:400}}>📅 {t.due}{t.due<today()?' ⚠️ Просрочено!':''}</div>}
      </div>
      {canEdit&&<button className="btn btn-ghost btn-icon btn-sm" style={{color:'var(--danger)'}} onClick={()=>del(t.id)}><i className="ti ti-trash"/></button>}
    </div>)}
    {done.length>0&&<div style={{marginTop:16,opacity:.6}}>
      <div style={{fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>Завершённые ({done.length})</div>
      {done.map(t=><div key={t.id} className="task-row" style={{marginBottom:6,background:'#f0fdf4',borderColor:'#bbf7d0'}}>
        <div className="t-chk" style={{background:'var(--success)',borderColor:'var(--success)'}} onClick={()=>toggle(t.id)}><i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/></div>
        <div style={{flex:1,textDecoration:'line-through',color:'var(--muted)',fontSize:13}}>{t.type}{t.text?` — ${t.text}`:''}</div>
      </div>)}
    </div>}
  </>;
}

// ═══════ KPI PAGE ════════
function KPIPage({clients,managers,user}){
  const [period,setPeriod]=useState('month');
  const now=new Date();
  const ms=monthStart();
  const ws=weekStart();

  function getRange(){
    if(period==='week')return ws;
    if(period==='month')return ms;
    return '2000-01-01';
  }

  const range=getRange();

  const stats=managers.map(m=>{
    const all=clients.filter(c=>c.manager===m.id);
    const period_clients=all.filter(c=>c.createdAt>=range);
    const contracts=all.filter(c=>c.contractType);
    const period_ct=period_clients.filter(c=>c.contractType);
    const rev=contracts.reduce((s,c)=>s+c.contractAmount,0);
    const period_rev=period_ct.reduce((s,c)=>s+c.contractAmount,0);
    const approved=all.filter(c=>['approval','deal','issuance','closed'].includes(c.stage));
    const closed=all.filter(c=>c.stage==='closed');
    const inWork=all.filter(c=>!['new_lead','closed'].includes(c.stage));
    const allTasks=all.flatMap(c=>c.tasks);
    const doneTasks=allTasks.filter(t=>t.done);
    const overdueTasks=allTasks.filter(t=>!t.done&&t.due&&t.due<today());
    const conv=all.length?Math.round(contracts.length/all.length*100):0;
    return {m,all:all.length,period_leads:period_clients.length,contracts:contracts.length,period_ct:period_ct.length,rev,period_rev,approved:approved.length,closed:closed.length,inWork:inWork.length,allTasks:allTasks.length,doneTasks:doneTasks.length,overdueTasks:overdueTasks.length,conv,convCA:contracts.length?Math.round(approved.length/contracts.length*100):0};
  }).sort((a,b)=>b.rev-a.rev);

  const maxRev=Math.max(...stats.map(s=>s.rev),1);
  const totalRev=stats.reduce((s,x)=>s+x.rev,0);
  const totalLeads=stats.reduce((s,x)=>s+x.all,0);
  const totalCt=stats.reduce((s,x)=>s+x.contracts,0);
  const totalClosed=stats.reduce((s,x)=>s+x.closed,0);

  return <div>
    <div style={{display:'flex',gap:7,marginBottom:20}}>
      {[{id:'week',l:'За неделю'},{id:'month',l:'За месяц'},{id:'all',l:'Все время'}].map(p=><button key={p.id} className={`r-tab${period===p.id?' active':''}`} onClick={()=>setPeriod(p.id)}>{p.l}</button>)}
    </div>

    <div className="metric-grid metric-grid-4" style={{marginBottom:18}}>
      {[
        {l:'Всего клиентов',v:totalLeads,c:'#6366f1',i:'ti-users'},
        {l:'Договоров',v:totalCt,c:'#ec4899',i:'ti-file-certificate'},
        {l:'Общая выручка',v:fmt(totalRev)+' ₸',c:'#10b981',i:'ti-cash'},
        {l:'Успешно закрыто',v:totalClosed,c:'#22c55e',i:'ti-circle-check'},
      ].map(({l,v,c,i})=><div key={l} className="m-card" style={{'--c':c}}><div className="m-label">{l}</div><div className="m-value">{v}</div><i className={`ti ${i} m-icon`}/></div>)}
    </div>

    {stats.map((s,idx)=>{
      const COLORS=['#6366f1','#10b981','#f59e0b','#ec4899'];
      const col=s.m.color||COLORS[idx%4];
      return <div key={s.m.id} className="kpi-mgr">
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
          <div style={{width:44,height:44,borderRadius:14,background:col+'22',color:col,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:17,flexShrink:0}}>{s.m.name[0]}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:16,letterSpacing:'-.3px'}}>{s.m.name}</div>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{s.all} клиентов · {s.contracts} договоров · {s.conv}% конверсия</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontWeight:900,fontSize:24,color:col,letterSpacing:'-1px'}}>{fmt(s.rev)} ₸</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>общая выручка</div>
          </div>
        </div>
        <div className="kpi-bar" style={{marginBottom:16}}><div className="kpi-fill" style={{width:`${Math.round(s.rev/maxRev*100)}%`,background:col}}/></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:7}}>
          {[
            {l:'В работе',v:s.inWork,c:'#0ea5e9'},
            {l:'Договоры',v:s.contracts,c:'#ec4899'},
            {l:'Одобрений',v:s.approved,c:'#10b981'},
            {l:'Закрыто',v:s.closed,c:'#22c55e'},
            {l:'Лид→Дог',v:s.conv+'%',c:s.conv>=50?'#10b981':s.conv>=25?'#f59e0b':'#ef4444'},
            {l:'Дог→Одоб',v:s.convCA+'%',c:s.convCA>=50?'#10b981':s.convCA>=25?'#f59e0b':'#ef4444'},
            {l:'Задачи ✅',v:`${s.doneTasks}/${s.allTasks}`,c:'#14b8a6'},
            {l:'⚠️ Просроч',v:s.overdueTasks,c:s.overdueTasks>0?'#ef4444':'#10b981'},
          ].map(({l,v,c})=><div key={l} className="kpi-stat">
            <div className="kpi-stat-val" style={{color:c}}>{v}</div>
            <div className="kpi-stat-lbl">{l}</div>
          </div>)}
        </div>
        {/* Period stats */}
        <div style={{marginTop:12,padding:'10px 12px',background:'#f8fafc',borderRadius:10,border:'1px solid var(--border)',display:'flex',gap:20}}>
          <div style={{fontSize:12}}><span style={{color:'var(--muted)',fontWeight:500}}>За период: </span><span style={{fontWeight:800,color:col}}>{s.period_leads} лидов</span></div>
          <div style={{fontSize:12}}><span style={{color:'var(--muted)',fontWeight:500}}>Договоров: </span><span style={{fontWeight:800,color:col}}>{s.period_ct}</span></div>
          <div style={{fontSize:12}}><span style={{color:'var(--muted)',fontWeight:500}}>Выручка: </span><span style={{fontWeight:800,color:col}}>{fmt(s.period_rev)} ₸</span></div>
        </div>
      </div>;
    })}
  </div>;
}

// ═══════ WHATSAPP PAGE ════════
function WAPage({clients,managers,onOpen,onImport}){
  const [f,setF]=useState({fio:'',phone:'',assignTo:'',rawText:''});
  const wa=clients.filter(c=>c.isWhatsApp);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  function importLead(){
    const c={...emptyClient(f.assignTo),fio:f.fio,phone:f.phone,source:'whatsapp',isWhatsApp:true,waMsgPreview:f.rawText,stage:'new_lead'};
    onImport(c);setF({fio:'',phone:'',assignTo:'',rawText:''});
  }
  return <div>
    <div className="metric-grid metric-grid-3" style={{marginBottom:18}}>
      {[{l:'WhatsApp лидов',v:wa.length,c:'#25d366'},{l:'Ждут обработки',v:wa.filter(c=>c.stage==='new_lead').length,c:'#f59e0b'},{l:'В работе',v:wa.filter(c=>c.stage!=='new_lead'&&c.stage!=='closed').length,c:'var(--accent)'}]
        .map(({l,v,c})=><div key={l} className="m-card" style={{'--c':c}}><div className="m-label">{l}</div><div className="m-value">{v}</div></div>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
      <div className="card card-p">
        <div style={{fontWeight:800,fontSize:14,marginBottom:14,display:'flex',alignItems:'center',gap:8}}><i className="ti ti-user-plus" style={{color:'#25d366',fontSize:18}}/>Добавить WhatsApp лид вручную</div>
        <Fl label="Имя клиента"><input className="input" value={f.fio} onChange={e=>s('fio',e.target.value)} placeholder="Как написал в чате"/></Fl>
        <Fl label="Телефон"><input className="input" value={f.phone} onChange={e=>s('phone',e.target.value)} placeholder="+7 701 000-00-00"/></Fl>
        <Fl label="Назначить менеджеру"><select className="input" value={f.assignTo} onChange={e=>s('assignTo',e.target.value)}><option value="">—</option>{managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></Fl>
        <Fl label="Сообщение из чата"><textarea className="input" value={f.rawText} onChange={e=>s('rawText',e.target.value)} placeholder="Вставьте текст переписки..."/></Fl>
        <button className="btn wa-btn btn-lg" style={{width:'100%',justifyContent:'center'}} onClick={importLead}><i className="ti ti-brand-whatsapp"/>Добавить как лид</button>
      </div>
      <div className="card card-p" style={{background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'1.5px solid #86efac'}}>
        <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:'#065f46'}}>🔗 Автоинтеграция с WhatsApp Business</div>
        <div style={{fontSize:13,color:'#047857',lineHeight:1.7,marginBottom:12}}>
          Чтобы лиды автоматически попадали в CRM из WhatsApp:
        </div>
        {[
          {n:'1','t':'WhatsApp Business API','d':'Регистрация на business.whatsapp.com'},
          {n:'2','t':'n8n или Make','d':'Автоматизация: сообщение → лид в CRM'},
          {n:'3','t':'Webhook на Supabase','d':'POST /functions/v1/wa-lead'},
          {n:'4','t':'Telegram-бот','d':'Альтернатива: бот пересылает заявки'},
        ].map(step=><div key={step.n} style={{display:'flex',gap:10,marginBottom:10,padding:'10px',background:'rgba(255,255,255,.6)',borderRadius:10}}>
          <div style={{width:24,height:24,borderRadius:'50%',background:'#25d366',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:12,flexShrink:0}}>{step.n}</div>
          <div><div style={{fontWeight:700,fontSize:13,color:'#065f46'}}>{step.t}</div><div style={{fontSize:11,color:'#047857'}}>{step.d}</div></div>
        </div>)}
      </div>
    </div>
    {wa.length>0&&<div className="tbl-wrap">
      <table>
        <thead><tr>{['Клиент','Телефон','Менеджер','Этап',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{wa.map(c=>{
          const m=managers.find(x=>x.id===c.manager);
          const p=PL[c.stage];
          return <tr key={c.id} onClick={()=>onOpen(c)}>
            <td><div style={{fontWeight:700}}>{c.fio||c.phone}</div>{c.waMsgPreview&&<div style={{fontSize:11,color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:200}}>{c.waMsgPreview}</div>}</td>
            <td><a href={`https://wa.me/${(c.phone||'').replace(/\D/g,'')}`} target="_blank" style={{color:'#25d366',fontWeight:700,textDecoration:'none'}} onClick={e=>e.stopPropagation()}><i className="ti ti-brand-whatsapp"/> {c.phone}</a></td>
            <td>{m?<span style={{display:'flex',alignItems:'center',gap:5,fontWeight:600}}><span style={{width:8,height:8,borderRadius:'50%',background:m.color,display:'inline-block'}}/>{m.name}</span>:'—'}</td>
            <td>{p&&<Tag c={p.c}>{p.l}</Tag>}</td>
            <td><button className="btn btn-ghost btn-sm"><i className="ti ti-arrow-right"/></button></td>
          </tr>;
        })}</tbody>
      </table>
    </div>}
  </div>;
}

// ═══════ SETTINGS PAGE ════════
function SettingsPage({store,managers,stageChecklists,onSaveManager,onDelManager,onSaveChecklist,onModal}){
  const [tab,setTab]=useState('managers');
  const COLORS=['#6366f1','#10b981','#f59e0b','#ec4899','#0ea5e9','#14b8a6','#ef4444','#8b5cf6','#f97316','#64748b'];
  return <div>
    <div style={{display:'flex',gap:6,marginBottom:20,background:'var(--card)',borderRadius:12,padding:'5px',border:'1.5px solid var(--border)',width:'fit-content',boxShadow:'var(--sh)'}}>
      {[{id:'managers',l:'👤 Менеджеры'},{id:'checklists',l:'✅ Чек-листы этапов'},{id:'users',l:'🔐 Пользователи'}].map(t=><button key={t.id} className={`btn${tab===t.id?' btn-primary':''}`} style={{boxShadow:'none',border:'none'}} onClick={()=>setTab(t.id)}>{t.l}</button>)}
    </div>

    {tab==='managers'&&<>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontWeight:800,fontSize:16}}>Менеджеры ({managers.length})</div>
        <button className="btn btn-primary" onClick={()=>onModal({type:'manager',item:{id:uid(),name:'',phone:'',role:'manager',color:'#3b82f6',active:true}})}><i className="ti ti-plus"/>Добавить менеджера</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
        {managers.map(m=><div key={m.id} className="card card-p" style={{border:`2px solid ${m.color}33`}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
            <div style={{width:46,height:46,borderRadius:14,background:m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:18}}>{m.name[0]}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:15}}>{m.name}</div>
              <div style={{fontSize:12,color:'var(--muted)'}}>{m.phone}</div>
            </div>
            <span style={{background:m.active?'#f0fdf4':'#fef2f2',color:m.active?'var(--success)':'var(--danger)',border:`1px solid ${m.active?'#bbf7d0':'#fecaca'}`,borderRadius:20,padding:'3px 9px',fontSize:11,fontWeight:700}}>{m.active?'Активен':'Неактивен'}</span>
          </div>
          <div style={{display:'flex',gap:6,marginBottom:12}}>
            {COLORS.map(c=><div key={c} onClick={()=>onSaveManager({...m,color:c})} style={{width:20,height:20,borderRadius:5,background:c,cursor:'pointer',border:`3px solid ${m.color===c?'#1a1a1a':'transparent'}`,transition:'border .1s'}}/>)}
          </div>
          <div style={{display:'flex',gap:7}}>
            <button className="btn btn-sm" style={{flex:1,justifyContent:'center'}} onClick={()=>onModal({type:'manager',item:{...m}})}><i className="ti ti-edit"/>Изменить</button>
            <button className="btn btn-sm btn-danger" onClick={()=>onDelManager(m.id)}><i className="ti ti-trash"/></button>
          </div>
        </div>)}
      </div>
    </>}

    {tab==='checklists'&&<>
      <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>Чек-листы по этапам сопровождения</div>
      <div style={{background:'#fffbeb',border:'1.5px solid #fde68a',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'#92400e',display:'flex',gap:8,alignItems:'center'}}>
        <i className="ti ti-info-circle" style={{fontSize:16,flexShrink:0}}/>
        Нажмите на этап чтобы настроить его чек-лист. Изменения применятся ко всем новым сделкам.
      </div>
      {ACCOMP_STAGES.map(stage=>{
        const items=stageChecklists[stage]||[];
        const done_types={check:items.filter(i=>i.type==='check').length,ecp:items.filter(i=>i.type==='ecp').length,doc:items.filter(i=>i.type==='doc').length};
        return <div key={stage} className="card card-p" style={{marginBottom:10,cursor:'pointer',transition:'all .15s'}} onClick={()=>onModal({type:'stage_checklist',stage,items:JSON.parse(JSON.stringify(items))})} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:5}}>{stage}</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {items.slice(0,4).map(item=><span key={item.id} style={{background:TYPE_COL[item.type||'check'],border:`1px solid`,borderColor:ICON_COL[item.type||'check']+'33',borderRadius:6,padding:'2px 8px',fontSize:11,color:ICON_COL[item.type||'check'],display:'inline-flex',alignItems:'center',gap:3,fontWeight:600}}>
                  <i className={`ti ${ICON_MAP[item.type||'check']}`} style={{fontSize:11}}/>{item.text}
                </span>)}
                {items.length>4&&<span style={{fontSize:11,color:'var(--muted)',fontStyle:'italic'}}>+{items.length-4} ещё</span>}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
              <span style={{fontWeight:700,fontSize:13,color:'var(--muted)'}}>{items.length} пунктов</span>
              <button className="btn btn-sm"><i className="ti ti-edit"/>Настроить</button>
            </div>
          </div>
        </div>;
      })}
    </>}

    {tab==='users'&&<>
      <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>Пользователи системы</div>
      <div style={{background:'#fffbeb',border:'1.5px solid #fde68a',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:13,color:'#92400e'}}>
        <i className="ti ti-info-circle"/> Для добавления нового пользователя — нужна версия с Supabase (бэкенд). Текущая версия: localStorage.
      </div>
      <div className="tbl-wrap">
        <table>
          <thead><tr>{['Пользователь','Логин','Роль'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>{(store.users||DEF_USERS).map(u=>{const r=ROLE[u.role];return <tr key={u.id}><td style={{fontWeight:700}}>{u.name}</td><td style={{fontFamily:'monospace',fontSize:12,color:'var(--muted)'}}>{u.login}</td><td>{r&&<Tag c={r.c}>{r.l}</Tag>}</td></tr>;})}</tbody>
        </table>
      </div>
    </>}
  </div>;
}

// ═══════ MANAGER MODAL ════════
function ManagerModal({item,onSave,onClose}){
  const [f,sf]=useState({...item});
  const set=(k,v)=>sf(x=>({...x,[k]:v}));
  const COLORS=['#6366f1','#10b981','#f59e0b','#ec4899','#0ea5e9','#14b8a6','#ef4444','#8b5cf6','#f97316','#64748b'];
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-sm">
      <MH title={f.name?`Редактировать: ${f.name}`:'Новый менеджер'} onClose={onClose}/>
      <div style={{padding:'18px 22px'}}>
        <Fl label="ФИО" req><input className="input" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Фамилия Имя"/></Fl>
        <Fl label="Телефон"><input className="input" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="+7 701 000-00-00"/></Fl>
        <Fl label="Цвет в системе">
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {COLORS.map(c=><div key={c} onClick={()=>set('color',c)} style={{width:28,height:28,borderRadius:8,background:c,cursor:'pointer',border:`3px solid ${f.color===c?'#1a1a1a':'transparent'}`,transition:'all .12s'}}/>)}
          </div>
        </Fl>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',background:'#f8fafc',borderRadius:12,border:'1.5px solid var(--border)',marginTop:4}}>
          <span style={{fontWeight:600,flex:1}}>Менеджер активен</span>
          <Toggle on={f.active!==false} onClick={()=>set('active',!f.active)}/>
        </div>
      </div>
      <MA onClose={onClose} onSave={()=>onSave(f)}/>
    </div>
  </div>;
}

// ═══════ STAGE CHECKLIST MODAL ════════
function StageChecklistModal({stage,items:initItems,onSave,onClose}){
  const [items,setItems]=useState([...(initItems||[])]);
  const [nItem,setNItem]=useState({text:'',type:'check'});
  function add(){if(!nItem.text.trim())return;setItems(x=>[...x,{id:uid(),...nItem}]);setNItem({text:'',type:'check'});}
  function del(id){setItems(x=>x.filter(i=>i.id!==id));}
  function move(id,dir){
    const idx=items.findIndex(i=>i.id===id);if(idx<0)return;
    const arr=[...items];const t=arr[idx];arr[idx]=arr[idx+dir];arr[idx+dir]=t;setItems(arr);
  }
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal modal-lg">
      <MH title={`Чек-лист: ${stage}`} sub={`${items.length} пунктов`} onClose={onClose}/>
      <div style={{padding:'18px 22px',overflow:'auto',maxHeight:'68vh'}}>
        <div style={{background:'#f8fafc',borderRadius:12,padding:'14px',border:'1.5px solid var(--border)',marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>Добавить пункт</div>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            {[{id:'check',l:'✓ Пункт'},{id:'ecp',l:'🔏 ЭЦП'},{id:'doc',l:'📄 Документ'}].map(t=><button key={t.id} className={`btn btn-sm${nItem.type===t.id?' btn-primary':''}`} onClick={()=>setNItem(x=>({...x,type:t.id}))}>{t.l}</button>)}
          </div>
          <div style={{display:'flex',gap:8}}>
            <input className="input" value={nItem.text} onChange={e=>setNItem(x=>({...x,text:e.target.value}))} placeholder="Текст пункта..." onKeyDown={e=>e.key==='Enter'&&add()}/>
            <button className="btn btn-primary" onClick={add}><i className="ti ti-plus"/>Добавить</button>
          </div>
        </div>
        {items.length===0&&<div className="empty-state"><i className="ti ti-list-check"/><p>Нет пунктов. Добавьте выше.</p></div>}
        {items.map((item,idx)=>{
          const tc=TYPE_COL[item.type||'check'];
          const ic=ICON_COL[item.type||'check'];
          return <div key={item.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#f8fafc',borderRadius:10,border:'1.5px solid var(--border)',marginBottom:7}}>
            <div style={{width:28,height:28,borderRadius:8,background:tc,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className={`ti ${ICON_MAP[item.type||'check']}`} style={{fontSize:14,color:ic}}/></div>
            <span style={{flex:1,fontSize:13,fontWeight:500}}>{item.text}</span>
            <span style={{fontSize:10,fontWeight:700,background:tc,color:ic,borderRadius:6,padding:'2px 7px'}}>{TYPE_LBL[item.type||'check']}</span>
            <div style={{display:'flex',gap:4}}>
              <button className="btn btn-ghost btn-sm btn-icon" style={{width:28,height:28}} onClick={()=>idx>0&&move(item.id,-1)} disabled={idx===0}><i className="ti ti-arrow-up" style={{fontSize:12}}/></button>
              <button className="btn btn-ghost btn-sm btn-icon" style={{width:28,height:28}} onClick={()=>idx<items.length-1&&move(item.id,1)} disabled={idx===items.length-1}><i className="ti ti-arrow-down" style={{fontSize:12}}/></button>
              <button className="btn btn-ghost btn-sm btn-icon" style={{width:28,height:28,color:'var(--danger)'}} onClick={()=>del(item.id)}><i className="ti ti-trash" style={{fontSize:12}}/></button>
            </div>
          </div>;
        })}
      </div>
      <MA onClose={onClose} onSave={()=>onSave(stage,items)} label="Сохранить чек-лист"/>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
