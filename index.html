<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ипотека CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --accent:#3b82f6;--accent2:#2563eb;--accent-bg:#eff6ff;
  --success:#10b981;--success-bg:#f0fdf4;
  --warn:#f59e0b;--warn-bg:#fffbeb;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --purple:#8b5cf6;--teal:#14b8a6;--pink:#ec4899;--orange:#f97316;
  --navy:#0f172a;--navy2:#1e293b;
  --bg:#f1f5f9;--card:#ffffff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --r:14px;--sh:0 1px 4px rgba(0,0,0,.07);--sh2:0 8px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;outline:none}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1;border:2px solid transparent}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:#fecaca}
.btn-warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn-lg{padding:14px 24px;font-size:16px;border-radius:16px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px}

/* ─── INPUTS ─── */
.inp{background:#f8fafc;border:2px solid var(--border2);border-radius:10px;padding:10px 13px;color:var(--text);font-size:14px;width:100%;transition:border .15s}
.inp:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
select.inp{cursor:pointer;-webkit-appearance:none}
textarea.inp{resize:none;min-height:75px}
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ─── LAYOUT ─── */
.app{display:flex;min-height:100vh}
.sb{width:220px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-emoji{font-size:22px;margin-bottom:5px}
.sb-title{font-size:15px;font-weight:800;color:#fff}
.sb-sub{font-size:10px;color:#475569;margin-top:2px}
.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.sb-sec{padding:9px 10px 3px;font-size:9px;font-weight:700;letter-spacing:.09em;color:#374151;text-transform:uppercase;margin-top:6px}
.sb-btn{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;color:#64748b;font-size:13px;font-weight:500;transition:all .15s;width:100%;text-align:left}
.sb-btn:hover{background:rgba(255,255,255,.07);color:#94a3b8}
.sb-btn.act{background:var(--accent);color:#fff;font-weight:700}
.sb-btn i{font-size:17px;width:18px;flex-shrink:0}
.sb-cnt{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.12)}
.sb-btn.act .sb-cnt{background:rgba(255,255,255,.25)}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.user-pill{display:flex;align-items:center;gap:9px;padding:9px 11px;background:rgba(255,255,255,.06);border-radius:12px;cursor:pointer;width:100%;transition:background .15s}
.user-pill:hover{background:rgba(255,255,255,.1)}
.user-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:11px;font-weight:600;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role-chip{font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;display:inline-block;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1}
.page{padding:20px 22px;flex:1}

/* ─── CARDS ─── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--sh)}
.cp{padding:16px}
.card-hd{padding:13px 16px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--border);background:#f8fafc;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between}

/* ─── METRICS ─── */
.mg{display:grid;gap:10px;margin-bottom:18px}
.mg4{grid-template-columns:repeat(4,1fr)}
.mg3{grid-template-columns:repeat(3,1fr)}
.mg2{grid-template-columns:repeat(2,1fr)}
.mc{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:default}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent))}
.mc-l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.mc-v{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--c,var(--text));line-height:1}
.mc-s{font-size:11px;color:var(--light);margin-top:4px}
.mc-i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:30px;opacity:.07}

/* ─── TABLE ─── */
.tbl-wrap{border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th{padding:10px 13px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--border);background:#f8fafc}
td{padding:12px 13px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:#f8fafc}

/* ─── BADGE ─── */
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ─── PROGRESS ─── */
.prog{height:7px;background:var(--border);border-radius:20px;overflow:hidden}
.prog-bar{height:100%;border-radius:20px;transition:width .4s}
.prog-xs{height:4px}

/* ─── TOGGLE ─── */
.toggle{width:42px;height:23px;background:var(--border2);border-radius:20px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;display:inline-block}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:22px}

/* ─── MODAL ─── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.22);max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-xl{width:960px}
.modal-lg{width:660px}
.modal-md{width:500px}
.modal-sm{width:400px}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1.5px solid var(--border);flex-shrink:0}
.modal-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
.modal-body{flex:1;overflow-y:auto}
.modal-ft{padding:13px 20px;border-top:1.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#f8fafc}

/* ─── KANBAN (manager) ─── */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.kanban::-webkit-scrollbar{height:6px}
.kanban::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.k-col{background:#f1f5f9;border:1.5px solid var(--border);border-radius:16px;min-width:190px;flex:0 0 190px;display:flex;flex-direction:column;transition:all .15s}
.k-col.dov{border-color:var(--accent);background:var(--accent-bg)}
.k-head{padding:12px;border-bottom:1.5px solid var(--border)}
.k-sr{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.k-cnt{margin-left:auto;font-size:11px;font-weight:700;background:#fff;border:1px solid var(--border);border-radius:20px;padding:1px 7px;color:var(--muted)}
.k-total{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.k-body{padding:7px;flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:64vh}
.k-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:11px;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
.k-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1);transform:translateY(-1px)}
.k-name{font-size:13px;font-weight:700;margin-bottom:2px}
.k-phone{font-size:11px;color:var(--muted);margin-bottom:6px}

/* ─── CLIENT DETAIL (manager simple view) ─── */
.client-hero{background:linear-gradient(135deg,var(--navy),#1e3a5f);padding:20px;border-radius:16px;margin-bottom:14px;color:#fff}
.client-hero-name{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.client-hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hero-tag{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
.hero-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hero-info-item{background:rgba(255,255,255,.1);border-radius:10px;padding:10px}
.hero-info-label{font-size:10px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.hero-info-value{font-size:13px;font-weight:700}

/* ─── STAGE FLOW ─── */
.stage-flow{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.stage-flow-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.stage-dots{display:flex;overflow-x:auto;padding-bottom:4px;gap:0}
.stage-dots::-webkit-scrollbar{height:4px}
.s-step{flex:1;min-width:64px;text-align:center;position:relative;cursor:pointer}
.s-step::before{content:'';position:absolute;top:12px;left:0;right:0;height:2px;background:var(--border);z-index:0}
.s-step:first-child::before{left:50%}
.s-step:last-child::before{right:50%}
.s-dot{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border2);background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:10px;font-weight:700;color:var(--muted);position:relative;z-index:1;transition:all .2s;cursor:pointer}
.s-dot.done{background:var(--success);border-color:var(--success);color:#fff}
.s-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(59,130,246,.2)}
.s-label{font-size:9px;color:var(--muted);line-height:1.2;font-weight:500;padding:0 2px}
.s-label.active{color:var(--accent);font-weight:700}
.s-label.done{color:var(--success)}

/* ─── CHECKLIST ─── */
.cl-section{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px}
.cl-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1.5px solid var(--border);background:#f8fafc}
.cl-hd-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.cl-hd-pct{font-size:12px;font-weight:700}
.cl-prog{height:4px;background:var(--border);margin:0 16px 0}
.cl-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.cl-item:last-child{border-bottom:none}
.cl-item:hover{background:#f8fafc}
.cl-item:active{background:#f0f4f8}
.cl-box{width:22px;height:22px;border-radius:6px;border:2.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.cl-box.ck{background:var(--success);border-color:var(--success)}
.cl-text{flex:1;font-size:13px;font-weight:500}
.cl-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}

/* ─── AUTO-TRANSITION BANNER ─── */
.auto-banner{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #86efac;border-radius:16px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.auto-banner-icon{width:44px;height:44px;border-radius:14px;background:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.auto-banner-text{flex:1}
.auto-banner-title{font-size:15px;font-weight:800;color:#065f46;margin-bottom:3px}
.auto-banner-sub{font-size:12px;color:#047857}

/* ─── WARN BANNER ─── */
.warn-banner{background:var(--warn-bg);border:1.5px solid #fde68a;border-radius:14px;padding:13px 15px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.warn-items{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.warn-chip{background:#fff;border:1px solid #fde68a;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;color:#92400e;display:inline-flex;align-items:center;gap:4px}

/* ─── COMMENT ─── */
.comment-box{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px}
.comment-item{padding:13px 16px;border-bottom:1px solid var(--border)}
.comment-item:last-child{border-bottom:none}
.comment-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px}
.comment-text{font-size:13px;line-height:1.55}
.comment-add{display:flex;gap:8px;padding:12px}

/* ─── TASKS ─── */
.task-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.task-item:last-child{border-bottom:none}
.task-item:hover{background:#f8fafc}
.t-chk{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.t-chk.done{background:var(--success);border-color:var(--success)}

/* ─── STATUS SELECTOR ─── */
.status-row{display:flex;gap:7px;flex-wrap:wrap}
.status-chip{padding:8px 14px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted)}
.status-chip.act{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}

/* ─── ADMIN PANEL ─── */
.admin-section{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px}
.admin-sec-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1.5px solid var(--border);background:#f8fafc}
.admin-sec-title{font-size:14px;font-weight:700}
.admin-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);transition:background .1s}
.admin-row:last-child{border-bottom:none}
.admin-row:hover{background:#f8fafc}

/* ─── COLOR PICKER ─── */
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:8px;cursor:pointer;transition:all .15s;flex-shrink:0}
.color-dot.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px #1a1a1a}

/* ─── LOGIN ─── */
.login-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border-radius:24px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-emoji{font-size:44px;display:block;margin-bottom:10px}
.login-title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.login-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:9999;box-shadow:var(--sh2);display:flex;align-items:center;gap:9px;animation:slideUp .2s ease;white-space:nowrap}
@keyframes slideUp{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ─── MISC ─── */
.divider{height:1.5px;background:var(--border);margin:16px 0}
.sec-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;padding-bottom:8px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty i{font-size:44px;display:block;margin-bottom:12px;opacity:.2}
.empty p{font-size:15px;font-weight:500}
.src-tag{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* ─── MOBILE ─── */
@media(max-width:768px){
  .sb{display:none}
  .main{width:100%}
  .mg4{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr 1fr}
  .hero-info-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:10px 14px}
  .page{padding:14px}
  .kanban{flex-direction:column}
  .k-col{min-width:unset;flex:unset}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const SK='crm_clean_v1';

// ═══ CONSTANTS ═══
const PIPELINE=[
  {id:'new_lead',l:'Новый лид',c:'#6366f1'},
  {id:'in_work',l:'Взят в работу',c:'#0ea5e9'},
  {id:'analysis',l:'Анализ',c:'#f59e0b'},
  {id:'consultation',l:'Консультация',c:'#a855f7'},
  {id:'contract',l:'Договор',c:'#ec4899'},
  {id:'accompaniment',l:'Сопровождение',c:'#14b8a6'},
  {id:'approval',l:'Одобрение',c:'#10b981'},
  {id:'deal',l:'Сделка',c:'#f97316'},
  {id:'issuance',l:'Выдача ипотеки',c:'#22c55e'},
  {id:'closed',l:'Закрыто',c:'#64748b'},
];
const PL=Object.fromEntries(PIPELINE.map(p=>[p.id,p]));

function uid(){return Math.random().toString(36).slice(2,9)}
function fmt(n){return n?new Intl.NumberFormat('ru').format(Math.round(n)):'—'}
function today(){return new Date().toISOString().split('T')[0]}
function nowStr(){return new Date().toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function wkStart(){const d=new Date();d.setDate(d.getDate()-d.getDay()+1);return d.toISOString().split('T')[0]}
function moStart(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`}

// ═══ HELPERS ═══
function Fl({l,req,ch}){return <div className="field"><div className="field-label">{l}{req&&<span style={{color:'var(--danger)',marginLeft:3}}>*</span>}</div>{ch}</div>}
function Tag({c,children}){return <span className="badge" style={{background:c+'22',color:c}}>{children}</span>}
function StageTag({id}){const p=PL[id];return p?<Tag c={p.c}>{p.l}</Tag>:null}
function SrcTag({id}){const s=SRC[id];return s?<span className="src-tag" style={{background:s.c+'22',color:s.c}}>{s.l}</span>:null}
function CrTag({id}){const c=CR[id];return c?<Tag c={c.c}>{c.l}</Tag>:null}
function Prog({pct,color,xs}){return <div className={`prog${xs?' prog-xs':''}`}><div className="prog-bar" style={{width:`${pct}%`,background:color||'var(--accent)'}}/></div>}
function Toggle({on,onClick}){return <div className={`toggle${on?' on':''}`} onClick={onClick}/>}
function MH({title,sub,onClose}){return <div className="modal-hd"><div><div className="modal-title">{title}</div>{sub&&<div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>{sub}</div>}</div><button className="btn btn-ghost btn-icon btn-sm" onClick={onClose}><i className="ti ti-x"/></button></div>}
function MA({onClose,onSave,label='Сохранить'}){return <div className="modal-ft"><button className="btn btn-ghost" onClick={onClose}>Отмена</button><button className="btn btn-primary" onClick={onSave}><i className="ti ti-device-floppy"/>{label}</button></div>}
function MgrName({id,managers}){const m=(managers||[]).find(x=>x.id===id);return m?m.name:'—'}

// ═══ APP ═══
function App(){
  const [store,setStore]=useState(()=>{try{const s=localStorage.getItem(SK);if(s)return JSON.parse(s);}catch{}return{clients:genDemo(),managers:DEF_MANAGERS,users:DEF_USERS,checklists:DEF_CHECKLISTS};});
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [modal,setModal]=useState(null);
  const [selectedClient,setSelectedClient]=useState(null);
  const [search,setSearch]=useState('');
  const [fMgr,setFMgr]=useState('');
  const [fStage,setFStage]=useState('');
  const [dragId,setDragId]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [toast,setToast]=useState(null);
  const toastRef=useRef(null);

  useEffect(()=>{try{localStorage.setItem(SK,JSON.stringify(store));}catch{}},[store]);

  function showToast(msg){setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2800);}
  function upd(fn){setStore(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);return n;});}

  const saveClient=c=>{
    upd(s=>{const i=s.clients.findIndex(x=>x.id===c.id);i>=0?s.clients.splice(i,1,c):s.clients.push(c);});
    // update selected if open
    if(selectedClient?.id===c.id)setSelectedClient(c);
    showToast('✅ Сохранено');setModal(null);
  };
  const delClient=id=>{upd(s=>{s.clients.splice(s.clients.findIndex(x=>x.id===id),1)});setSelectedClient(null);showToast('🗑 Удалено');setModal(null);};
  const moveClient=(id,stage)=>{
    upd(s=>{const c=s.clients.find(x=>x.id===id);if(c)c.stage=stage;});
    if(selectedClient?.id===id)setSelectedClient(c=>({...c,stage}));
    showToast(`📌 ${PL[stage]?.l}`);
  };
  const saveManager=m=>{upd(s=>{const i=s.managers.findIndex(x=>x.id===m.id);i>=0?s.managers.splice(i,1,m):s.managers.push(m)});showToast('✅ Менеджер сохранён');setModal(null);};
  const delManager=id=>{upd(s=>{s.managers.splice(s.managers.findIndex(x=>x.id===id),1)});showToast('🗑 Менеджер удалён');setModal(null);};
  const saveChecklist=(stage,items)=>{upd(s=>{s.checklists={...s.checklists,[stage]:items}});showToast('✅ Чек-лист сохранён');setModal(null);};
  const savePipeline=stages=>{upd(s=>{s.pipeline=stages});showToast('✅ Воронка сохранена');setModal(null);};

  const mgrs=store.managers||DEF_MANAGERS;
  const checklists=store.checklists||DEF_CHECKLISTS;
  const pipeline=store.pipeline||PIPELINE;

  // update selectedClient when store changes
  useEffect(()=>{
    if(selectedClient)setSelectedClient(store.clients.find(c=>c.id===selectedClient.id)||null);
  },[store.clients]);

  const isAdmin=user?.role==='admin';
  const isHead=user?.role==='head';
  const isMgr=user?.role==='manager';

  const myClients=isMgr?store.clients.filter(c=>c.manager===user.mid):store.clients;

  const filtered=myClients.filter(c=>{
    if(search){const q=search.toLowerCase();if(!c.fio.toLowerCase().includes(q)&&!c.phone.includes(q)&&!c.iin.includes(q))return false;}
    if(fMgr&&c.manager!==fMgr)return false;
    if(fStage&&c.stage!==fStage)return false;
    return true;
  });

  const openTasks=myClients.flatMap(c=>c.tasks).filter(t=>!t.done).length;
  const waNew=myClients.filter(c=>c.isWhatsApp&&c.stage==='new_lead').length;

  const NAV=[
    {id:'dashboard',l:'Дашборд',i:'ti-layout-dashboard'},
    {id:'clients',l:'Клиенты',i:'ti-users'},
    {id:'search',l:'Поиск по ИИН',i:'ti-search'},
    {id:'tasks',l:'Задачи',i:'ti-checkbox',cnt:openTasks},
    {id:'kpi',l:'KPI',i:'ti-chart-bar'},
    ...(isAdmin?[{id:'admin',l:'Панель техника',i:'ti-settings-2'}]:[]),
  ];

  if(!user)return <Login users={store.users||DEF_USERS} onLogin={u=>{setUser(u);setPage('dashboard');}}/>;

  const role=ROLE[user.role];

  // If client is selected, show detail view
  if(selectedClient){
    return <ClientDetail
      client={selectedClient}
      clients={store.clients}
      managers={mgrs}
      checklists={checklists}
      pipeline={pipeline}
      user={user}
      onSave={saveClient}
      onDelete={delClient}
      onMove={moveClient}
      onBack={()=>setSelectedClient(null)}
      showToast={showToast}
    />;
  }

  return <div className="app">
    {/* SIDEBAR */}
    <div className="sb">
      <div className="sb-logo">
        <div className="sb-emoji">🏠</div>
        <div className="sb-title">Ипотека CRM</div>
        <div className="sb-sub">Система управления клиентами</div>
      </div>
      <div className="sb-nav">
        {NAV.map(n=><button key={n.id} className={`sb-btn${page===n.id?' act':''}`} onClick={()=>setPage(n.id)}>
          <i className={`ti ${n.i}`}/>{n.l}
          {n.cnt>0&&<span className="sb-cnt">{n.cnt}</span>}
        </button>)}
        <div className="sb-sec">Воронка</div>
        {pipeline.map(p=>{const cnt=myClients.filter(c=>c.stage===p.id).length;return <button key={p.id} className="sb-btn" style={{justifyContent:'space-between'}} onClick={()=>{setPage('clients');setFStage(p.id);}}>
          <span style={{display:'flex',alignItems:'center',gap:8}}><span className="dot" style={{background:p.c}}/>{p.l}</span>
          {cnt>0&&<span style={{background:p.c+'33',color:p.c,borderRadius:20,padding:'1px 7px',fontSize:10,fontWeight:700}}>{cnt}</span>}
        </button>;})}
      </div>
      <div className="sb-foot">
        <button className="user-pill" onClick={()=>setUser(null)}>
          <div className="user-av" style={{background:role?.c||'#3b82f6'}}>{user.name[0]}</div>
          <div className="user-info">
            <div className="user-name">{user.name}</div>
            <span className="user-role-chip" style={{background:role?.c+'22',color:role?.c}}>{role?.l}</span>
          </div>
          <i className="ti ti-logout" style={{fontSize:14,color:'#475569'}}/>
        </button>
      </div>
    </div>

    {/* MAIN */}
    <div className="main">
      <div className="topbar">
        <div className="topbar-title">{NAV.find(n=>n.id===page)?.l||'CRM'}</div>
        {page==='clients'&&<>
          <div style={{display:'flex',alignItems:'center',gap:7,background:'#f1f5f9',borderRadius:10,padding:'8px 12px',flex:1,maxWidth:240}}>
            <i className="ti ti-search" style={{color:'var(--muted)',fontSize:15}}/>
            <input style={{border:'none',background:'transparent',fontSize:14,color:'var(--text)',width:'100%',outline:'none'}} placeholder="Имя, телефон, ИИН..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          {!isMgr&&<select className="inp" style={{width:150}} value={fMgr} onChange={e=>setFMgr(e.target.value)}>
            <option value="">Все менеджеры</option>{mgrs.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
          </select>}
          <select className="inp" style={{width:160}} value={fStage} onChange={e=>setFStage(e.target.value)}>
            <option value="">Все этапы</option>{pipeline.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}
          </select>
        </>}
        <button className="btn btn-primary" onClick={()=>{
          const c=emptyClient(user.mid||'');
          setModal({type:'client_edit',client:c,isNew:true});
        }}><i className="ti ti-plus"/>Новый клиент</button>
      </div>

      <div className="page">
        {page==='dashboard'&&<Dashboard clients={myClients} managers={mgrs} user={user} pipeline={pipeline} onOpenClient={c=>setSelectedClient(c)} onNewClient={()=>{const c=emptyClient(user.mid||'');setModal({type:'client_edit',client:c,isNew:true});}}/>}
        {page==='clients'&&<Clients clients={filtered} managers={mgrs} pipeline={pipeline} onOpen={c=>setSelectedClient(c)} dragId={dragId} setDragId={setDragId} dragOver={dragOver} setDragOver={setDragOver} onMove={moveClient}/>}
        {page==='search'&&<IINSearch clients={myClients} managers={mgrs} pipeline={pipeline} onOpen={c=>setSelectedClient(c)}/>}
        {page==='tasks'&&<Tasks clients={myClients} managers={mgrs} onOpen={c=>setSelectedClient(c)}/>}
        {page==='kpi'&&<KPI clients={myClients} managers={mgrs} user={user}/>}
        {page==='admin'&&isAdmin&&<AdminPanel store={store} managers={mgrs} pipeline={pipeline} checklists={checklists} onSaveManager={saveManager} onDelManager={delManager} onSaveChecklist={saveChecklist} onSavePipeline={savePipeline} onModal={setModal}/>}
      </div>
    </div>

    {/* MODALS */}
    {modal?.type==='client_edit'&&<ClientEditModal client={modal.client} isNew={modal.isNew} managers={mgrs} user={user} onSave={saveClient} onDelete={delClient} onClose={()=>setModal(null)}/>}
    {modal?.type==='mgr_edit'&&<MgrModal item={modal.item} onSave={saveManager} onClose={()=>setModal(null)}/>}
    {modal?.type==='cl_edit'&&<ChecklistEditModal stage={modal.stage} items={modal.items} onSave={saveChecklist} onClose={()=>setModal(null)}/>}
    {modal?.type==='pipe_edit'&&<PipelineEditModal pipeline={pipeline} onSave={savePipeline} onClose={()=>setModal(null)}/>}

    {toast&&<div className="toast">{toast}</div>}
  </div>;
}

function Login({users,onLogin}){

  function go(){const u=users.find(x=>x.login===login&&x.pwd===pwd);u?onLogin(u):setErr('Неверный логин или пароль');}
  const hints=[{l:'admin',p:'admin123',r:'Техник/Администратор'},{l:'head',p:'head123',r:'Руководитель'},{l:'aigerim',p:'a123',r:'Менеджер'},{l:'daniyar',p:'d123',r:'Менеджер'}];
  return <div className="login-wrap">

      <div className="login-logo"><span className="login-emoji">🏠</span><div className="login-title">Ипотека CRM</div><div className="login-sub">Войдите в систему</div></div>
      <Fl l="Логин" ch={<input className="inp" value={login} onChange={e=>{setLogin(e.target.value);setErr('')}} placeholder="Ваш логин" onKeyDown={e=>e.key==='Enter'&&go()} style={{fontSize:16}}/>}/>
      <Fl l="Пароль" ch={<input className="inp" type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setErr('')}} placeholder="Ваш пароль" onKeyDown={e=>e.key==='Enter'&&go()} style={{fontSize:16}}/>}/>
      {err&&<div style={{background:'var(--danger-bg)',color:'var(--danger)',border:'1.5px solid #fecaca',borderRadius:10,padding:'10px 13px',fontSize:13,fontWeight:600,marginBottom:12,textAlign:'center'}}>{err}</div>}
      <button className="btn btn-primary btn-block btn-lg" onClick={go} style={{justifyContent:'center',marginBottom:18}}><i className="ti ti-login"/>Войти</button>
      <div style={{background:'#f8fafc',borderRadius:12,border:'1px solid var(--border)',overflow:'hidden'}}>
        <div style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Нажмите для входа:</div>
        {hints.map(h=><div key={h.l} onClick={()=>{setLogin(h.l);setPwd(h.p);setErr('')}} style={{display:'flex',justifyContent:'space-between',padding:'11px 14px',borderBottom:'1px solid var(--border)',cursor:'pointer',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background='#e2e8f0'} onMouseLeave={e=>e.currentTarget.style.background=''}>
          <span style={{fontWeight:700,fontSize:13}}>{h.l} / {h.p}</span><span style={{color:'var(--muted)',fontSize:12}}>{h.r}</span>
        </div>)}
      </div>
    </div>
  </div>;
}

// ═══ CLIENT DETAIL (SIMPLE MANAGER VIEW) ═══
function ClientDetail({client,clients,managers,checklists,pipeline,user,onSave,onDelete,onMove,onBack,showToast}){
  const [c,setC]=useState(JSON.parse(JSON.stringify(client)));
  const [activeAccompIdx,setActiveAccompIdx]=useState(c.accompStageIndex||0);
  const [newComment,setNewComment]=useState('');
  const [autoBanner,setAutoBanner]=useState(null);
  const [editMode,setEditMode]=useState(false);
  const isMgr=user.role==='manager'||user.role==='specialist';
  const canEdit=user.role!=='qa';

  const set=(k,v)=>setC(x=>({...x,[k]:v}));
  const pl=pipeline||PIPELINE;

  const mgr=managers.find(m=>m.id===c.manager);
  const stageObj=pl.find(p=>p.id===c.stage);
  const cr=CR[c.creditStatus];
  const ct=c.contractType?{id:c.contractType,...CONTRACTS.find(x=>x.id===c.contractType),...{l:CONTRACTS.find(x=>x.id===c.contractType)?.l}}:null;

  // Accomp
  const accompStages=c.accompStages||{};
  function getSD(i){return accompStages[i]||{done:[],comments:[],tasks:[]};}
  function setSD(i,data){setC(x=>({...x,accompStages:{...x.accompStages,[i]:data}}));}

  function toggleCheck(si,itemId){
    const sd=getSD(si);const done=sd.done||[];
    const newDone=done.includes(itemId)?done.filter(x=>x!==itemId):[...done,itemId];
    const newSd={...sd,done:newDone};
    const stageName=ACCOMP[si];
    const items=checklists[stageName]||[];
    // Auto-transition check
    if(newDone.length===items.length&&items.length>0&&si<ACCOMP.length-1){
      setAutoBanner({fromIdx:si,toIdx:si+1,fromName:stageName,toName:ACCOMP[si+1]});
    }else{setAutoBanner(null);}
    setSD(si,newSd);
  }

  function doAutoTransition(toIdx){
    setC(x=>({...x,accompStageIndex:toIdx}));
    setActiveAccompIdx(toIdx);
    setAutoBanner(null);
    showToast(`✅ Перешли на: ${ACCOMP[toIdx]}`);
  }

  function addComment(si){
    const txt=newComment.trim();if(!txt)return;
    const sd=getSD(si);
    const nc={id:uid(),text:txt,date:nowStr(),author:user.name};
    setSD(si,{...sd,comments:[...(sd.comments||[]),nc]});
    setNewComment('');
  }

  function addGlobalComment(){
    const txt=newComment.trim();if(!txt)return;
    setC(x=>({...x,comments:[...(x.comments||[]),{id:uid(),text:txt,date:nowStr(),author:user.name}]}));
    setNewComment('');
  }

  function save(){onSave({...c});}

  // overall progress
  const totalItems=ACCOMP.reduce((s,st)=>{const items=checklists[st]||[];return s+items.length;},0);
  const totalDone=ACCOMP.reduce((s,st,i)=>s+((accompStages[i]?.done)||[]).length,0);
  const overallPct=totalItems>0?Math.round(totalDone/totalItems*100):0;

  const stageColor=stageObj?.c||'var(--accent)';

  return <div className="app">
    <div className="sb">
      <div className="sb-logo">
        <div className="sb-emoji">🏠</div>
        <div className="sb-title">Ипотека CRM</div>
        <div className="sb-sub">Карточка клиента</div>
      </div>
      <div className="sb-nav" style={{paddingTop:8}}>
        <button className="sb-btn" onClick={onBack}><i className="ti ti-arrow-left"/>Назад к списку</button>
        <div className="sb-sec">Этапы воронки</div>
        {pl.map(p=><button key={p.id} className={`sb-btn${c.stage===p.id?' act':''}`} onClick={()=>canEdit&&set('stage',p.id)} style={{justifyContent:'space-between'}}>
          <span style={{display:'flex',alignItems:'center',gap:8}}><span className="dot" style={{background:p.c}}/>{p.l}</span>
          {c.stage===p.id&&<i className="ti ti-check" style={{fontSize:13}}/>}
        </button>)}
      </div>
      <div className="sb-foot">
        <button className="user-pill">
          <div className="user-av" style={{background:ROLE[user.role]?.c||'#3b82f6'}}>{user.name[0]}</div>
          <div className="user-info"><div className="user-name">{user.name}</div></div>
        </button>
      </div>
    </div>

    <div className="main">
      <div className="topbar">
        <button className="btn btn-ghost" onClick={onBack}><i className="ti ti-arrow-left"/>Назад</button>
        <div className="topbar-title" style={{fontSize:16}}>{c.fio||'Новый клиент'}</div>
        {canEdit&&<button className="btn btn-ghost btn-sm" onClick={()=>setEditMode(!editMode)}><i className={`ti ti-${editMode?'check':'edit'}`}/>{editMode?'Режим просмотра':'Редактировать'}</button>}
        {canEdit&&<button className="btn btn-primary" onClick={save}><i className="ti ti-device-floppy"/>Сохранить</button>}
      </div>

      <div className="page">
        {/* HERO */}
        <div className="client-hero" style={{background:`linear-gradient(135deg,var(--navy),${stageColor}66)`}}>
          <div className="client-hero-name">{c.fio||'—'}</div>
          <div className="client-hero-tags">
            <StageTag id={c.stage}/>
            {c.isWhatsApp&&<span className="hero-tag" style={{background:'#25d36633',color:'#25d366'}}>WhatsApp</span>}
            {cr&&<Tag c={cr.c}>{cr.l}</Tag>}
            {ct&&ct.l&&<span className="hero-tag">{ct.l}</span>}
          </div>
          <div className="hero-info-grid">
            <div className="hero-info-item"><div className="hero-info-label">Телефон</div><div className="hero-info-value">{c.phone||'—'}</div></div>
            <div className="hero-info-item"><div className="hero-info-label">ИИН</div><div className="hero-info-value">{c.iin||'—'}</div></div>
            <div className="hero-info-item"><div className="hero-info-label">Менеджер</div><div className="hero-info-value">{mgr?.name||'—'}</div></div>
