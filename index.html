                  {c.driveLink&&<a href={c.driveLink} target="_blank" className="btn btn-gh btn-sm" style={{flexShrink:0}}><i className="ti ti-external-link"/>Открыть</a>}
                </div>
                <div style={{fontSize:11,color:'var(--mu)',marginTop:5}}>💡 Создайте папку в Google Drive с этим именем для хранения документов клиента</div>
              </div>
            </div>}

            {/* PAYMENTS */}
            {tab==='payments'&&<PaymentsTab c={c} setC={v=>{setC(v);setIsDirty(true);setHasChanges(true);}} pipeline={pl} canEdit={canEdit}/>}

            {/* REASSIGNMENT */}
            {tab==='reassignment'&&<div>
              <div style={{display:'flex',alignItems:'center',gap:11,padding:'13px',background:'#f8fafc',borderRadius:13,border:'2px solid var(--br)',marginBottom:14}}>
                <span style={{fontWeight:700,fontSize:15,flex:1}}>🔄 Переуступка</span>
                <Tgl on={c.isReassignment} onClick={()=>canEdit&&set('isReassignment',!c.isReassignment)}/>
              </div>
              {c.isReassignment&&<>
                <div className="r2">
                  <Fl l="Жилой комплекс" ch={<input className="inp" value={c.reassignmentComplex} onChange={e=>set('reassignmentComplex',e.target.value)}/>}/>
                  <Fl l="Застройщик" ch={<input className="inp" value={c.reassignmentDeveloper} onChange={e=>set('reassignmentDeveloper',e.target.value)}/>}/>
                </div>
                <div className="r3">
                  <Fl l="Сумма (₸)" ch={<input className="inp" type="number" value={c.reassignmentAmount} onChange={e=>set('reassignmentAmount',e.target.value)}/>}/>
                  <Fl l="Остаток ипотеки (₸)" ch={<input className="inp" type="number" value={c.mortgageBalance} onChange={e=>set('mortgageBalance',e.target.value)}/>}/>
                  <Fl l="Банк" ch={<input className="inp" value={c.reassignmentBank} onChange={e=>set('reassignmentBank',e.target.value)}/>}/>
                </div>
              </>}
            </div>}

            {/* ACCOMPANIMENT */}
            {tab==='accomp'&&<AccompTab c={c} setC={v=>{setC(v);setIsDirty(true);setHasChanges(true);}} managers={managers} canEdit={canEdit} checklists={checklists} pipeline={pl} user={user} accIdx={accIdx} setAccIdx={setAccIdx} autoBanner={autoBanner} setAutoBanner={setAutoBanner} toggleCheck={toggleCheck} overallPct={overallPct} totalDone={totalDone} totalItems={totalItems} getSD={getSD} setSD={setSD} toast$={toast$}/>}

            {/* TASKS */}
            {tab==='tasks'&&<TasksTab c={c} setC={v=>{setC(v);setIsDirty(true);setHasChanges(true);}} user={user} canEdit={canEdit}/>}

            {/* HISTORY */}
            {tab==='history'&&<HistoryTab c={c} setC={v=>{setC(v);setIsDirty(true);setHasChanges(true);}} user={user}/>}
          </div>
        </div>
      </div>
    </div>
  </div>;
}

// ═══ PAYMENTS TAB ═══
function PaymentsTab({c,setC,pipeline,canEdit}){
  const [showAdd,setShowAdd]=useState(false);
  const [nPay,setNPay]=useState({name:'',amount:'',type:'stage',stageTrigger:'contract',dateTrigger:'',status:'pending',paidAmount:0,paidDate:'',note:''});

  const payments=c.payments||[];
  const totalPaid=payments.filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0);
  const totalPartial=payments.filter(p=>p.status==='partial').reduce((s,p)=>s+p.paidAmount,0);
  const totalPending=payments.filter(p=>p.status==='pending').reduce((s,p)=>s+p.amount,0);

  function updPay(id,key,val){setC({...c,payments:payments.map(p=>p.id===id?{...p,[key]:val}:p)});}
  function setStatus(id,status){
    const p=payments.find(x=>x.id===id);
    if(status==='paid'){setC({...c,payments:payments.map(x=>x.id===id?{...x,status:'paid',paidAmount:x.amount,paidDate:new Date().toLocaleDateString('ru',{day:'numeric',month:'short'})}:x)});}
    else{updPay(id,'status',status);}
  }
  function addPay(){
    if(!nPay.name||!nPay.amount)return;
    setC({...c,payments:[...payments,{...nPay,id:uid(),amount:+nPay.amount}]});
    setNPay({name:'',amount:'',type:'stage',stageTrigger:'contract',dateTrigger:'',status:'pending',paidAmount:0,paidDate:'',note:''});
    setShowAdd(false);
  }
  function delPay(id){setC({...c,payments:payments.filter(p=>p.id!==id)});}

  const payPct=c.contractAmount>0?Math.round((totalPaid+totalPartial)/c.contractAmount*100):0;

  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:9,marginBottom:14}}>
      {[{l:'Получено',v:fmt(totalPaid+totalPartial)+' ₸',c:'#10b981'},{l:'Ожидается',v:fmt(totalPending)+' ₸',c:'#f59e0b'},{l:'Сумма договора',v:fmt(c.contractAmount)+' ₸',c:'#3b82f6'}]
        .map(({l,v,col,c:col2})=><div key={l} style={{background:'#f8fafc',borderRadius:10,padding:'12px',border:'1.5px solid var(--br)'}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>{l}</div>
          <div style={{fontWeight:800,fontSize:18,color:col2,letterSpacing:'-1px'}}>{v}</div>
        </div>)}
    </div>
    {c.contractAmount>0&&<div style={{marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:5}}>
        <span style={{fontWeight:600}}>Прогресс оплаты</span><span style={{fontWeight:800,color:payPct===100?'#10b981':'var(--A)'}}>{payPct}%</span>
      </div>
      <Prog pct={payPct} c={payPct===100?'#10b981':payPct>0?'#3b82f6':'var(--br2)'} sz='h'/>
    </div>}

    {payments.map(p=>{
      const ps=PAY_STATUS[p.status]||PAY_STATUS.pending;
      const stageName=(pipeline||PIPELINE).find(x=>x.id===p.stageTrigger)?.l;
      return <div key={p.id} className={`pay-card ${p.status}`}>
        <div style={{display:'flex',alignItems:'flex-start',gap:11,marginBottom:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>{p.name}</div>
            <div style={{fontSize:12,color:'var(--mu)'}}>
              {p.type==='stage'&&stageName&&<span>🎯 Срабатывает при этапе: <b>{stageName}</b></span>}
              {p.type==='date'&&p.dateTrigger&&<span>📅 До: <b>{p.dateTrigger}</b></span>}
              {p.note&&<div style={{marginTop:2}}>{p.note}</div>}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontWeight:800,fontSize:18,color:p.status==='paid'?'#10b981':p.status==='partial'?'#0ea5e9':'#f59e0b',letterSpacing:'-1px'}}>{fmt(p.amount)} ₸</div>
            <span className="badge" style={{background:ps.bg,color:ps.c}}>{ps.l}</span>
          </div>
        </div>
        {p.status==='partial'&&<div style={{marginBottom:9}}>
          <div style={{fontSize:11,color:'var(--mu)',marginBottom:4}}>Получено: <b>{fmt(p.paidAmount)} ₸</b> из {fmt(p.amount)} ₸</div>
          <Prog pct={Math.round(p.paidAmount/p.amount*100)} c='#0ea5e9' sz='sm'/>
        </div>}
        {p.status==='paid'&&p.paidDate&&<div style={{fontSize:12,color:'#10b981',fontWeight:600}}>✅ Оплачено: {p.paidDate}</div>}
        {canEdit&&<div style={{display:'flex',gap:7,marginTop:9,flexWrap:'wrap'}}>
          {p.status!=='paid'&&<button className="btn btn-g btn-sm" onClick={()=>setStatus(p.id,'paid')}><i className="ti ti-check"/>Отметить оплаченным</button>}
          {p.status==='pending'&&<button className="btn btn-w btn-sm" onClick={()=>setStatus(p.id,'partial')}><i className="ti ti-clock"/>Частично</button>}
          {p.status==='partial'&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
            <input className="inp" type="number" value={p.paidAmount} onChange={e=>updPay(p.id,'paidAmount',+e.target.value)} style={{width:120}} placeholder="Сумма"/>
            <span style={{fontSize:12,color:'var(--mu)'}}>₸</span>
          </div>}
          {p.status==='paid'&&<button className="btn btn-gh btn-sm" onClick={()=>setStatus(p.id,'pending')}><i className="ti ti-arrow-back-up"/>Отменить</button>}
          <button className="btn btn-r btn-sm" onClick={()=>delPay(p.id)}><i className="ti ti-trash"/></button>
        </div>}
      </div>;
    })}

    {canEdit&&<div>
      {!showAdd&&<button className="btn btn-p btn-sm" onClick={()=>setShowAdd(true)}><i className="ti ti-plus"/>Добавить платёж</button>}
      {showAdd&&<div style={{background:'#f8fafc',borderRadius:13,padding:'14px',border:'1.5px solid var(--br)',marginTop:12}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:11,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.04em'}}>Новый платёж</div>
        <Fl l="Название" ch={<input className="inp" value={nPay.name} onChange={e=>setNPay(x=>({...x,name:e.target.value}))} placeholder="Предоплата 30%"/>}/>
        <div className="r2">
          <Fl l="Сумма (₸)" ch={<input className="inp" type="number" value={nPay.amount} onChange={e=>setNPay(x=>({...x,amount:e.target.value}))} placeholder="0"/>}/>
          <Fl l="Тип срабатывания" ch={<select className="inp" value={nPay.type} onChange={e=>setNPay(x=>({...x,type:e.target.value}))}>
            <option value="stage">По этапу</option>
            <option value="date">По дате</option>
            <option value="manual">Вручную</option>
          </select>}/>
        </div>
        {nPay.type==='stage'&&<Fl l="При достижении этапа" ch={<select className="inp" value={nPay.stageTrigger} onChange={e=>setNPay(x=>({...x,stageTrigger:e.target.value}))}>
          {(pipeline||PIPELINE).map(p=><option key={p.id} value={p.id}>{p.l}</option>)}
        </select>}/>}
        {nPay.type==='date'&&<Fl l="Дата платежа" ch={<input className="inp" type="date" value={nPay.dateTrigger} onChange={e=>setNPay(x=>({...x,dateTrigger:e.target.value}))}/>}/>}
        <Fl l="Заметка" ch={<input className="inp" value={nPay.note} onChange={e=>setNPay(x=>({...x,note:e.target.value}))} placeholder="Условия оплаты..."/>}/>
        <div style={{display:'flex',gap:8}}><button className="btn btn-p btn-sm" onClick={addPay}><i className="ti ti-plus"/>Добавить</button><button className="btn btn-gh btn-sm" onClick={()=>setShowAdd(false)}>Отмена</button></div>
      </div>}
    </div>}
    {payments.length===0&&<div className="empty"><i className="ti ti-cash"/><p>Нет платежей. Добавьте расписание оплаты.</p></div>}
  </div>;
}

// ═══ ACCOMP TAB ═══
function AccompTab({c,setC,managers,canEdit,checklists,pipeline,user,accIdx,setAccIdx,autoBanner,setAutoBanner,toggleCheck,overallPct,totalDone,totalItems,getSD,setSD,toast$}){
  const [newCmt,setNewCmt]=useState({});
  const [newTask,setNewTask]=useState({});
  const [docDrag,setDocDrag]=useState(null);
  const fileRefs=useRef({});

  function addCmt(si){const t=(newCmt[si]||'').trim();if(!t)return;const sd=getSD(si);setSD(si,{...sd,comments:[...(sd.comments||[]),{id:uid(),text:t,date:nowStr(),author:user.name}]});setNewCmt(x=>({...x,[si]:''}));}
  function delCmt(si,cid){const sd=getSD(si);setSD(si,{...sd,comments:(sd.comments||[]).filter(c=>c.id!==cid)});}
  function addTask(si){const t=newTask[si];if(!t?.text?.trim())return;const sd=getSD(si);const task={id:uid(),type:t.type||'📞 Позвонить',text:t.text,due:t.due||'',done:false,created:nowStr(),stage:ACCOMP[si],isStageTask:true};setSD(si,{...sd,tasks:[...(sd.tasks||[]),task]});setC({...c,tasks:[...(c.tasks||[]),task]});setNewTask(x=>({...x,[si]:{type:'📞 Позвонить',text:'',due:''}}));}
  function toggleTask(si,tid){const sd=getSD(si);setSD(si,{...sd,tasks:(sd.tasks||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)});setC({...c,tasks:(c.tasks||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)});}

  // Document handling
  function handleFiles(si,files){
    const sd=getSD(si);
    const existing=sd.docs||[];
    let loaded=0;
    Array.from(files).forEach(file=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const doc={id:uid(),name:file.name,type:getDocType(file),base64:e.target.result,size:file.size,uploadDate:nowStr(),note:'',driveUrl:'',stage:ACCOMP[si]};
        const newDocs=[...existing,doc];
        if(++loaded===files.length){setSD(si,{...sd,docs:newDocs});toast$('📎 '+files.length+' файл(а) добавлено');}
        else{const sdCurr=getSD(si);setSD(si,{...sdCurr,docs:[...(sdCurr.docs||[]),doc]});}
      };
      reader.readAsDataURL(file);
    });
  }
  function getDocType(file){if(file.type.includes('image'))return 'photo';if(file.name.toLowerCase().includes('паспорт')||file.name.toLowerCase().includes('удостовер'))return 'id';if(file.name.toLowerCase().includes('справк'))return 'income';return 'other';}
  function delDoc(si,did){const sd=getSD(si);setSD(si,{...sd,docs:(sd.docs||[]).filter(d=>d.id!==did)});}

  const aStages=c.accompStages||{};
  const nt=newTask[accIdx]||{type:'📞 Позвонить',text:'',due:''};

  return <div>
    <div className="r2" style={{marginBottom:13}}>
      <Fl l="Ответственный менеджер" ch={<select className="inp" value={c.responsibleManager} onChange={e=>setC({...c,responsibleManager:e.target.value})} disabled={!canEdit}><option value="">Не назначен</option>{managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>}/>
      <Fl l="Ипотечный специалист" ch={<input className="inp" value={c.mortgageSpecialist} onChange={e=>setC({...c,mortgageSpecialist:e.target.value})} placeholder="ФИО специалиста"/>}/>
    </div>

    {/* Overall */}
    <div className="card cp" style={{marginBottom:13}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
        <div style={{fontWeight:800,fontSize:14}}>Общий прогресс</div>
        <div style={{fontWeight:900,fontSize:22,color:overallPct===100?'#10b981':'#3b82f6',letterSpacing:'-1px'}}>{overallPct}%</div>
      </div>
      <Prog pct={overallPct} c={overallPct===100?'#10b981':'#3b82f6'} sz='h'/>
      <div style={{fontSize:12,color:'var(--mu)',marginTop:5}}>{totalDone} из {totalItems} пунктов выполнено</div>
    </div>

    {/* AUTO TRANSITION */}
    {autoBanner&&<div className="abanner">
      <div style={{width:40,height:40,borderRadius:12,background:'#10b981',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:20}}>🎉</div>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:14,color:'#065f46'}}>"{autoBanner.fromName}" завершён!</div>
        <div style={{fontSize:12,color:'#047857',marginTop:2}}>Перейти к: {autoBanner.toName}?</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-g btn-sm" onClick={()=>{setC({...c,accompStageIndex:autoBanner.toIdx});setAccIdx(autoBanner.toIdx);setAutoBanner(null);toast$('📍 Перешли: '+autoBanner.toName);}}><i className="ti ti-arrow-right"/>Перейти</button>
        <button className="btn btn-gh btn-sm" onClick={()=>setAutoBanner(null)}>Позже</button>
      </div>
    </div>}

    {/* Stage dots */}
    <div className="card" style={{marginBottom:13,overflow:'hidden'}}>
      <div style={{padding:'11px 14px',fontWeight:700,fontSize:13,borderBottom:'1px solid var(--br)',display:'flex',justifyContent:'space-between'}}>
        <span>Этапы сопровождения</span>
        <span style={{fontSize:12,color:'var(--mu)',fontWeight:500}}>Текущий: <b style={{color:'#3b82f6'}}>{ACCOMP[c.accompStageIndex]}</b></span>
      </div>
      <div className="sdots" style={{padding:'11px 8px'}}>
        {ACCOMP.map((s,i)=>{
          const sd=aStages[i]||{};const items=checklists[s]||[];const done=(sd.done||[]).length;const allDone=items.length>0&&done===items.length;const isAct=accIdx===i;
          return <div key={s} className="ss" onClick={()=>setAccIdx(i)}>
            {i<ACCOMP.length-1&&<div style={{position:'absolute',top:11,left:'50%',right:'-50%',height:2,background:allDone?'#10b981':i<c.accompStageIndex?'#3b82f6':'var(--br)',zIndex:0}}/>}
            <div className={`sd${allDone?' dn':isAct?' ac':''}`}>{allDone?<i className="ti ti-check" style={{fontSize:9}}/>:i+1}</div>
            <div className={`sl${isAct?' ac':allDone?' dn':''}`}>{s}</div>
          </div>;
        })}
      </div>
    </div>

    {/* Active stage */}
    {ACCOMP.map((sName,si)=>{
      if(si!==accIdx)return null;
      const sd=aStages[si]||{};const items=checklists[sName]||[];const done=sd.done||[];const pct=items.length>0?Math.round(done.length/items.length*100):100;const isComplete=pct===100||items.length===0;const incomplete=items.filter(item=>!done.includes(item.id));const stageTasks=sd.tasks||[];const stageDocs=sd.docs||[];const stageCmts=sd.comments||[];

      return <div key={sName}>
        {/* Stage header */}
        <div className="card" style={{marginBottom:10,overflow:'hidden',border:`2px solid ${isComplete?'#10b981':'var(--A)'}`}}>
          <div style={{padding:'13px 15px',background:isComplete?'#f0fdf4':'var(--Ab)',display:'flex',alignItems:'center',gap:11}}>
            <div style={{width:36,height:36,borderRadius:11,background:isComplete?'#10b981':'var(--A)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {isComplete?<i className="ti ti-check" style={{color:'#fff',fontSize:17}}/>:<i className="ti ti-clock" style={{color:'#fff',fontSize:17}}/>}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:15,color:isComplete?'#065f46':'#1d4ed8'}}>{sName}</div>
              <div style={{fontSize:12,color:isComplete?'#047857':'#3b82f6',marginTop:1}}>{isComplete?'Все пункты выполнены ✓':`${done.length} из ${items.length}`}</div>
            </div>
            <div style={{fontWeight:900,fontSize:22,color:isComplete?'#10b981':'#3b82f6'}}>{pct}%</div>
            <button className="btn btn-p btn-sm" onClick={()=>canEdit&&setC({...c,accompStageIndex:si})}>📍 Текущий</button>
          </div>

          {!isComplete&&<div className="wbox" style={{margin:'10px 13px',borderRadius:11}}>
            <i className="ti ti-alert-triangle" style={{color:'#d97706',fontSize:16,marginTop:2}}/>
            <div style={{flex:1}}><div style={{fontWeight:700,fontSize:12,color:'#92400e'}}>Незавершённые пункты:</div>
              <div className="wchips">{incomplete.map(item=><span key={item.id} className="wchip"><i className={`ti ${TI[item.tp||'check']}`} style={{fontSize:10,color:TC[item.tp||'check']}}/>{item.t}</span>)}</div>
            </div>
          </div>}

          {items.length>0&&<div style={{padding:'0 13px 4px'}}><Prog pct={pct} c={isComplete?'#10b981':'var(--A)'} sz='sm'/></div>}
        </div>

        {/* CHECKLIST */}
        {items.length>0&&<div className="card" style={{marginBottom:10,overflow:'hidden'}}>
          <div className="chd">📋 Чек-лист <span style={{fontWeight:500,color:'var(--mu)'}}>{done.length}/{items.length}</span></div>
          {items.map(item=>{const isDone=done.includes(item.id);return <div key={item.id} className="cli" onClick={()=>canEdit&&toggleCheck(si,item.id)}>
            <div className={`clb${isDone?' ck':''}`}>{isDone&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}</div>
            <div style={{width:26,height:26,borderRadius:7,background:TB[item.tp||'check'],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className={`ti ${TI[item.tp||'check']}`} style={{fontSize:13,color:TC[item.tp||'check']}}/></div>
            <div style={{flex:1,fontSize:13,fontWeight:500,textDecoration:isDone?'line-through':'none',color:isDone?'var(--mu)':'var(--tx)'}}>{item.t}</div>
            <span style={{fontSize:9,fontWeight:700,background:TB[item.tp||'check'],color:TC[item.tp||'check'],borderRadius:5,padding:'2px 6px'}}>{TL[item.tp||'check']}</span>
          </div>;})}
        </div>}

        {/* DOCUMENTS */}
        <div className="card" style={{marginBottom:10,overflow:'hidden'}}>
          <div className="chd">📎 Документы этапа <span style={{fontWeight:500}}>{stageDocs.length}</span></div>
          {stageDocs.map(doc=>{
            const dt=DOC_TYPES.find(x=>x.id===doc.type)||DOC_TYPES[DOC_TYPES.length-1];
            const isImg=doc.base64&&doc.base64.startsWith('data:image');
            return <div key={doc.id} className="doc-item">
              {isImg?<img src={doc.base64} alt={doc.name} className="file-preview"/>:<div className="doc-ico" style={{background:'#eff6ff'}}><i className={`ti ${dt.i}`} style={{color:'#3b82f6'}}/></div>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{doc.name}</div>
                <div style={{fontSize:11,color:'var(--mu)'}}>{dt.l} · {doc.uploadDate}{doc.size?' · '+fmtSize(doc.size):''}</div>
                {doc.note&&<div style={{fontSize:11,color:'var(--mu)'}}>{doc.note}</div>}
              </div>
              {doc.base64&&<a href={doc.base64} download={doc.name} className="btn btn-gh btn-sm btn-ico"><i className="ti ti-download" style={{fontSize:14}}/></a>}
              {doc.driveUrl&&<a href={doc.driveUrl} target="_blank" className="btn btn-gh btn-sm btn-ico"><i className="ti ti-external-link" style={{fontSize:14}}/></a>}
              {canEdit&&<button className="btn btn-r btn-sm btn-ico" onClick={()=>delDoc(si,doc.id)}><i className="ti ti-trash" style={{fontSize:13}}/></button>}
            </div>;
          })}
          {canEdit&&<div style={{padding:'10px 13px'}}>
            <div className="doc-drop" onDragOver={e=>{e.preventDefault();setDocDrag(si)}} onDragLeave={()=>setDocDrag(null)} onDrop={e=>{e.preventDefault();setDocDrag(null);handleFiles(si,e.dataTransfer.files);}} style={{borderColor:docDrag===si?'var(--A)':'var(--br2)',background:docDrag===si?'var(--Ab)':''}} onClick={()=>fileRefs.current[si]?.click()}>
              <i className="ti ti-cloud-upload" style={{fontSize:28,color:'var(--lt)',display:'block',marginBottom:6}}/>
              <div style={{fontWeight:600,fontSize:13,color:'var(--mu)'}}>Перетащите файлы или нажмите</div>
              <div style={{fontSize:11,color:'var(--lt)',marginTop:3}}>Фото, PDF, документы</div>
            </div>
            <input ref={el=>fileRefs.current[si]=el} type="file" multiple accept="image/*,.pdf,.doc,.docx" style={{display:'none'}} onChange={e=>handleFiles(si,e.target.files)}/>
          </div>}
        </div>

        {/* TASKS */}
        <div className="card" style={{marginBottom:10,overflow:'hidden'}}>
          <div className="chd">✅ Задачи этапа <span className="badge" style={{background:'var(--Ab)',color:'var(--A)',fontWeight:700}}>{stageTasks.filter(t=>!t.done).length} открытых</span></div>
          {stageTasks.map(t=><div key={t.id} className="task-r">
            <div className={`tchk${t.done?' dn':''}`} onClick={()=>toggleTask(si,t.id)}>{t.done&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13,textDecoration:t.done?'line-through':'none',color:t.done?'var(--mu)':'var(--tx)'}}>{t.type}</div>
              {t.text&&<div style={{fontSize:11,color:'var(--mu)'}}>{t.text}</div>}
              {t.due&&<div style={{fontSize:11,color:t.due<today()&&!t.done?'var(--R)':'var(--lt)',fontWeight:t.due<today()&&!t.done?700:400}}>📅 {t.due}</div>}
            </div>
          </div>)}
          {canEdit&&<div style={{padding:'11px 13px',background:'#f8fafc',borderTop:'1px solid var(--br)'}}>
            <div style={{display:'flex',gap:7,marginBottom:7}}>
              <select className="inp" style={{width:180}} value={nt.type} onChange={e=>setNewTask(x=>({...x,[si]:{...(x[si]||{}),type:e.target.value}}))}>{TASK_T.map(t=><option key={t}>{t}</option>)}</select>
              <input className="inp" type="date" style={{width:150}} value={nt.due||''} onChange={e=>setNewTask(x=>({...x,[si]:{...(x[si]||{}),due:e.target.value}}))}/>
            </div>
            <div style={{display:'flex',gap:7}}>
              <input className="inp" value={nt.text||''} onChange={e=>setNewTask(x=>({...x,[si]:{...(x[si]||{}),text:e.target.value}}))} placeholder="Задача..." onKeyDown={e=>e.key==='Enter'&&addTask(si)}/>
              <button className="btn btn-p btn-sm" onClick={()=>addTask(si)}><i className="ti ti-plus"/></button>
            </div>
          </div>}
        </div>

        {/* COMMENTS */}
        <div className="card" style={{marginBottom:10,overflow:'hidden'}}>
          <div className="chd">💬 Комментарии <span style={{fontWeight:500,color:'var(--mu)'}}>{stageCmts.length}</span></div>
          {stageCmts.length===0&&<div style={{padding:'13px 15px',fontSize:13,color:'var(--mu)',fontStyle:'italic'}}>Нет комментариев</div>}
          {stageCmts.map(cm=><div key={cm.id} className="cmt">
            <div className="cmeta"><i className="ti ti-message" style={{fontSize:11}}/><b>{cm.author}</b><span>{cm.date}</span>
              {canEdit&&<button className="btn btn-gh" style={{padding:'0 3px',fontSize:11,color:'var(--R)',marginLeft:'auto'}} onClick={()=>delCmt(si,cm.id)}><i className="ti ti-trash" style={{fontSize:11}}/></button>}
            </div>
            <div style={{fontSize:13,lineHeight:1.55}}>{cm.text}</div>
          </div>)}
          {canEdit&&<div style={{display:'flex',gap:7,padding:'11px 13px',borderTop:'1px solid var(--br)'}}>
            <input className="inp" value={newCmt[si]||''} onChange={e=>setNewCmt(x=>({...x,[si]:e.target.value}))} placeholder={`Заметка к "${sName}"...`} onKeyDown={e=>e.key==='Enter'&&addCmt(si)} style={{flex:1}}/>
            <button className="btn btn-p btn-sm" onClick={()=>addCmt(si)}><i className="ti ti-send"/></button>
          </div>}
        </div>

        {/* NAV */}
        <div style={{display:'flex',gap:10,marginBottom:14}}>
          <button className="btn btn-gh" style={{flex:1,justifyContent:'center',opacity:si===0?.3:1}} onClick={()=>setAccIdx(Math.max(0,si-1))} disabled={si===0}><i className="ti ti-arrow-left"/>Предыдущий</button>
          <button className="btn btn-p" style={{flex:1,justifyContent:'center',opacity:si===ACCOMP.length-1?.3:1}} onClick={()=>setAccIdx(Math.min(ACCOMP.length-1,si+1))} disabled={si===ACCOMP.length-1}>Следующий<i className="ti ti-arrow-right"/></button>
        </div>
      </div>;
    })}
  </div>;
}

// ═══ TASKS TAB ═══
function TasksTab({c,setC,user,canEdit}){
  const [nTask,setNTask]=useState({type:TASK_T[0],text:'',due:''});
  function add(){if(!nTask.text.trim())return;setC({...c,tasks:[...c.tasks,{id:uid(),...nTask,done:false,created:nowStr()}]});setNTask({type:TASK_T[0],text:'',due:''});}
  function tog(id){setC({...c,tasks:c.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)});}
  function del(id){setC({...c,tasks:c.tasks.filter(t=>t.id!==id)});}
  const open=c.tasks.filter(t=>!t.done);const done=c.tasks.filter(t=>t.done);
  return <div>
    {canEdit&&<div style={{background:'#f8fafc',borderRadius:12,padding:'13px',border:'1.5px solid var(--br)',marginBottom:13}}>
      <div className="r2">
        <Fl l="Тип" ch={<select className="inp" value={nTask.type} onChange={e=>setNTask(x=>({...x,type:e.target.value}))}>{TASK_T.map(t=><option key={t}>{t}</option>)}</select>}/>
        <Fl l="Срок" ch={<input className="inp" type="date" value={nTask.due} onChange={e=>setNTask(x=>({...x,due:e.target.value}))}/>}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <input className="inp" value={nTask.text} onChange={e=>setNTask(x=>({...x,text:e.target.value}))} placeholder="Описание..." onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1}}/>
        <button className="btn btn-p btn-sm" onClick={add}><i className="ti ti-plus"/>Добавить</button>
      </div>
    </div>}
    {open.length===0&&done.length===0&&<div className="empty"><i className="ti ti-checkbox"/><p>Нет задач</p></div>}
    {open.map(t=><div key={t.id} className="task-r">
      <div className="tchk" style={{borderColor:'var(--br2)'}} onClick={()=>tog(t.id)}/>
      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{t.type}</div>{t.text&&<div style={{fontSize:12,color:'var(--mu)'}}>{t.text}</div>}{t.due&&<div style={{fontSize:11,color:t.due<today()?'var(--R)':'var(--lt)',fontWeight:t.due<today()?700:400}}>📅 {t.due}{t.due<today()?' ⚠️':''}</div>}</div>
      {canEdit&&<button className="btn btn-gh btn-ico btn-sm" style={{color:'var(--R)'}} onClick={()=>del(t.id)}><i className="ti ti-trash"/></button>}
    </div>)}
    {done.length>0&&<div style={{marginTop:14,opacity:.6}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',marginBottom:8}}>Завершённые ({done.length})</div>
      {done.map(t=><div key={t.id} className="task-r" style={{background:'var(--Gb)',borderLeft:'3px solid #10b981'}}>
        <div className="tchk dn" onClick={()=>tog(t.id)}><i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/></div>
        <div style={{flex:1,textDecoration:'line-through',color:'var(--mu)',fontSize:13}}>{t.type}{t.text?` — ${t.text}`:''}</div>
      </div>)}
    </div>}
  </div>;
}

// ═══ HISTORY TAB ═══
function HistoryTab({c,setC,user}){
  const [txt,setTxt]=useState('');
  function add(){if(!txt.trim())return;setC({...c,comments:[...c.comments,{id:uid(),text:txt,date:nowStr(),author:user.name}]});setTxt('');}
  return <div>
    <div style={{marginBottom:13}}>
      <div style={{display:'flex',gap:8}}>
        <textarea className="inp" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Результат звонка, статус переговоров..." style={{flex:1,minHeight:60}}/>
        <button className="btn btn-p btn-sm" style={{alignSelf:'flex-end',flexShrink:0}} onClick={add}><i className="ti ti-send"/></button>
      </div>
    </div>
    {c.comments.length===0&&<div className="empty"><i className="ti ti-messages"/><p>История пустая</p></div>}
    {[...c.comments].reverse().map(cm=><div key={cm.id} className="cmt">
      <div className="cmeta"><i className="ti ti-message" style={{fontSize:11}}/><b>{cm.author}</b><span>{cm.date}</span></div>
      <div style={{fontSize:13,lineHeight:1.55}}>{cm.text}</div>
    </div>)}
  </div>;
}

// ═══ IIN SEARCH ═══
// ═══ BIG CLIENT CARD ═══
function BigClientCard({c,managers,pipeline,checklists,onOpen}){
  const m=managers.find(x=>x.id===c.manager);
  const pl=pipeline||PIPELINE;
  const p=pl.find(x=>x.id===c.stage);
  const cr=CR[c.creditStatus];
  const ctObj=CT[c.contractType];
  const src=SRC[c.source];

  // Progress
  const cls=checklists||DEF_CL;
  const totalItems=ACCOMP.reduce((s,st)=>s+(cls[st]||[]).length,0);
  const totalDone=ACCOMP.reduce((s,st,i)=>s+((c.accompStages||{})[i]?.done||[]).length,0);
  const pct=totalItems>0?Math.round(totalDone/totalItems*100):0;

  // Payments
  const paid=(c.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0);
  const partial=(c.payments||[]).filter(p=>p.status==='partial').reduce((s,p)=>s+p.paidAmount,0);
  const payPct=c.contractAmount>0?Math.round((paid+partial)/c.contractAmount*100):0;
  const pendingPays=(c.payments||[]).filter(p=>p.status==='pending');

  // Tasks
  const openTasks=c.tasks.filter(t=>!t.done);
  const overdueTasks=openTasks.filter(t=>t.due&&t.due<today());

  // Last comment
  const lastCmt=[...c.comments].sort((a,b)=>b.date?.localeCompare(a.date||'')||0)[0];

  // Stage docs count
  const docsCount=ACCOMP.reduce((s,st,i)=>s+((c.accompStages||{})[i]?.docs||[]).length,0);

  const stageColor=p?.c||'#3b82f6';

  return <div onClick={()=>onOpen(c)} style={{background:'var(--card)',borderRadius:18,overflow:'hidden',marginBottom:14,cursor:'pointer',border:'1.5px solid var(--br)',boxShadow:'0 4px 20px rgba(0,0,0,.08)',transition:'all .18s'}}
    onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 32px rgba(0,0,0,.14)';}}
    onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 20px rgba(0,0,0,.08)';}}>

    {/* TOP COLOR BAR */}
    <div style={{height:5,background:`linear-gradient(90deg,${stageColor},${stageColor}88)`}}/>

    {/* HEADER */}
    <div style={{padding:'16px 18px 13px',background:`linear-gradient(135deg,${stageColor}11,transparent)`,borderBottom:'1px solid var(--br)'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
        <div style={{display:'flex',gap:12,alignItems:'center',flex:1,minWidth:0}}>
          {/* Avatar */}
          <div style={{width:48,height:48,borderRadius:14,background:stageColor+'22',color:stageColor,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:20,flexShrink:0,border:`2px solid ${stageColor}44`}}>
            {c.fio?c.fio[0]:'?'}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
              <span style={{fontWeight:900,fontSize:18,letterSpacing:'-.3px'}}>{c.fio||'—'}</span>
              {c.isWhatsApp&&<span style={{background:'#25d36622',color:'#25d366',border:'1px solid #25d36644',borderRadius:20,padding:'2px 8px',fontSize:10,fontWeight:700,display:'inline-flex',alignItems:'center',gap:3}}><i className="ti ti-brand-whatsapp" style={{fontSize:10}}/>WA</span>}
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{fontFamily:'monospace',fontSize:11,background:'#f1f5f9',padding:'2px 8px',borderRadius:5,color:'var(--mu)',border:'1px solid var(--br)'}}>{c.iin||'нет ИИН'}</span>
              <span style={{fontSize:12,color:'var(--mu)',display:'flex',alignItems:'center',gap:3}}><i className="ti ti-phone" style={{fontSize:11}}/>{c.phone||'—'}</span>
              <span style={{fontSize:12,color:'var(--mu)'}}>{c.city}</span>
            </div>
          </div>
        </div>
        {/* Stage badge */}
        {p&&<div style={{flexShrink:0,textAlign:'right'}}>
          <span className="badge" style={{background:p.c+'22',color:p.c,fontSize:12,padding:'5px 11px'}}>{p.l}</span>
          <div style={{fontSize:10,color:'var(--mu)',marginTop:4}}>{c.dateIn}</div>
        </div>}
      </div>
    </div>

    {/* BODY — KEY INFO GRID */}
    <div style={{padding:'13px 18px'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:13}}>
        {/* Manager */}
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px 11px',border:'1px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4,display:'flex',alignItems:'center',gap:4}}><i className="ti ti-user" style={{fontSize:11}}/>Менеджер</div>
          {m?<div style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:m.color,display:'inline-block',flexShrink:0}}/>
            <span style={{fontWeight:700,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.name}</span>
          </div>:<span style={{fontWeight:700,fontSize:12,color:'var(--mu)'}}>Не назначен</span>}
        </div>
        {/* Source */}
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px 11px',border:'1px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}><i className="ti ti-antenna" style={{fontSize:11}}/> Источник</div>
          {src?<span style={{background:src.c+'22',color:src.c,borderRadius:5,padding:'2px 7px',fontSize:11,fontWeight:700}}>{src.l}</span>:<span style={{fontWeight:700,fontSize:12,color:'var(--mu)'}}>—</span>}
        </div>
        {/* Credit */}
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px 11px',border:'1px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}><i className="ti ti-credit-card" style={{fontSize:11}}/> КИ</div>
          {cr?<span style={{background:cr.c+'22',color:cr.c,borderRadius:5,padding:'2px 7px',fontSize:11,fontWeight:700}}>{cr.l}</span>:<span style={{fontSize:12,color:'var(--mu)'}}>—</span>}
        </div>
        {/* Income */}
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px 11px',border:'1px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}><i className="ti ti-cash" style={{fontSize:11}}/> Доход</div>
          <div style={{fontWeight:700,fontSize:12}}>{c.officialIncome?fmt(+c.officialIncome)+' ₸':'—'}</div>
          {c.extraIncome&&<div style={{fontSize:10,color:'var(--mu)'}}>+{fmt(+c.extraIncome)} ₸ доп.</div>}
        </div>
      </div>

      {/* CONTRACT + PAYMENT */}
      {c.contractType&&<div style={{background:'linear-gradient(135deg,#eff6ff,#f5f3ff)',borderRadius:12,padding:'12px 14px',marginBottom:12,border:'1.5px solid #c7d2fe'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'#6366f1',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:2}}>💼 {ctObj?.l||'Договор'}</div>
            <div style={{fontWeight:900,fontSize:20,color:'#1d4ed8',letterSpacing:'-1px'}}>{fmt(c.contractAmount)} ₸</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:11,color:'var(--mu)',marginBottom:4}}>Получено: <b style={{color:'#10b981'}}>{fmt(paid+partial)} ₸</b></div>
            <div style={{fontWeight:800,fontSize:16,color:payPct===100?'#10b981':payPct>0?'#3b82f6':'#f59e0b'}}>{payPct}%</div>
          </div>
        </div>
        <Prog pct={payPct} c={payPct===100?'#10b981':payPct>0?'#3b82f6':'#f59e0b'} sz='sm'/>
        {pendingPays.length>0&&<div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
          {pendingPays.map(pp=><span key={pp.id} style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:6,padding:'3px 8px',fontSize:10,fontWeight:600,color:'#92400e'}}>
            ⏳ {pp.name}: {fmt(pp.amount)} ₸
          </span>)}
        </div>}
      </div>}

      {/* ACCOMP PROGRESS */}
      {c.stage==='accompaniment'&&<div style={{background:'#f0fdf4',borderRadius:12,padding:'12px 14px',marginBottom:12,border:'1.5px solid #bbf7d0'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:7}}>
          <div style={{fontWeight:700,fontSize:13,color:'#065f46'}}>🗺 Сопровождение</div>
          <div style={{fontWeight:900,fontSize:18,color:pct===100?'#10b981':'#3b82f6'}}>{pct}%</div>
        </div>
        <Prog pct={pct} c={pct===100?'#10b981':pct>50?'#3b82f6':'#f59e0b'} sz='sm'/>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:7,fontSize:11}}>
          <span style={{color:'#047857',fontWeight:600}}>📍 Текущий: <b>{ACCOMP[c.accompStageIndex]}</b></span>
          <span style={{color:'var(--mu)'}}>{totalDone}/{totalItems} пунктов</span>
        </div>
        {/* Mini stage dots */}
        <div style={{display:'flex',gap:3,marginTop:9,overflowX:'auto'}}>
          {ACCOMP.map((s,i)=>{
            const sd=(c.accompStages||{})[i]||{};const items=cls[s]||[];const done=(sd.done||[]).length;const allDone=items.length>0&&done===items.length;const isCur=c.accompStageIndex===i;
            return <div key={s} title={s} style={{width:isCur?28:20,height:20,borderRadius:6,background:allDone?'#10b981':isCur?'#3b82f6':'#e2e8f0',color:allDone||isCur?'#fff':'#94a3b8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,flexShrink:0,transition:'all .2s',border:isCur?'2px solid #1d4ed8':'none'}}>
              {allDone?'✓':i+1}
            </div>;
          })}
        </div>
      </div>}

      {/* TASKS + DOCS + LAST COMMENT */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:openTasks.length>0||lastCmt?12:0}}>
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px',border:`1.5px solid ${openTasks.length>0?overdueTasks.length>0?'#fecaca':'#bfdbfe':'var(--br)'}`}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>✅ Задачи</div>
          <div style={{fontWeight:800,fontSize:18,color:overdueTasks.length>0?'#ef4444':openTasks.length>0?'#3b82f6':'#10b981',letterSpacing:'-1px'}}>{openTasks.length}</div>
          {overdueTasks.length>0&&<div style={{fontSize:10,color:'#ef4444',fontWeight:700}}>⚠️ {overdueTasks.length} просрочено</div>}
          {openTasks.length===0&&<div style={{fontSize:10,color:'#10b981',fontWeight:600}}>Всё выполнено</div>}
        </div>
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px',border:'1.5px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>📎 Документы</div>
          <div style={{fontWeight:800,fontSize:18,color:'#8b5cf6',letterSpacing:'-1px'}}>{docsCount}</div>
          <div style={{fontSize:10,color:'var(--mu)'}}>{docsCount>0?'файлов загружено':'нет файлов'}</div>
        </div>
        <div style={{background:'#f8fafc',borderRadius:10,padding:'10px',border:'1.5px solid var(--br)'}}>
          <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}}>💬 Комментарии</div>
          <div style={{fontWeight:800,fontSize:18,color:'#14b8a6',letterSpacing:'-1px'}}>{c.comments.length}</div>
          <div style={{fontSize:10,color:'var(--mu)'}}>{c.comments.length>0?'записей':'нет записей'}</div>
        </div>
      </div>

      {/* LAST COMMENT */}

// ═══ TASKS PAGE ═══
function Tasks({clients,managers,onOpen}){
  const all=clients.flatMap(c=>c.tasks.map(t=>({...t,cFio:c.fio,cl:c})));
  const open=all.filter(t=>!t.done);
  const overdue=open.filter(t=>t.due&&t.due<today());
  const todayT=open.filter(t=>t.due===today());
  const rest=open.filter(t=>!t.due||(t.due>today()));
  const done=all.filter(t=>t.done);
  return <div>
    <div className="mg mg3" style={{marginBottom:14}}>
      {[{l:'Открытых',v:open.length,c:'#f59e0b'},{l:'🔴 Просрочено',v:overdue.length,c:'#ef4444'},{l:'✅ Завершено',v:done.length,c:'#10b981'}].map(({l,v,c})=><div key={l} className="mc" style={{'--c':c}}><div className="mc-l">{l}</div><div className="mc-v">{v}</div></div>)}
    </div>
    {overdue.length>0&&<div style={{background:'var(--Rb)',border:'2px solid #fecaca',borderRadius:13,overflow:'hidden',marginBottom:13}}>
      <div style={{padding:'11px 13px',fontWeight:800,fontSize:13,color:'var(--R)',borderBottom:'1px solid #fecaca',background:'#fff5f5'}}>🔴 Просроченные ({overdue.length})</div>
      {overdue.map(t=><div key={t.id} className="task-r" style={{cursor:'pointer'}} onClick={()=>onOpen(t.cl)}>
        <div className="tchk" style={{borderColor:'var(--R)'}}/>
        <div style={{flex:1}}><div style={{fontWeight:700,color:'var(--R)'}}>{t.type}</div>{t.text&&<div style={{fontSize:12,color:'var(--mu)'}}>{t.text}</div>}<div style={{fontSize:11,color:'var(--R)',fontWeight:700}}>{t.due}</div></div>
        <span style={{fontSize:12,fontWeight:700,color:'var(--mu)'}}>{t.cFio}</span>
      </div>)}
    </div>}
    {todayT.length>0&&<div style={{marginBottom:13}}>
      <div style={{fontWeight:800,fontSize:13,color:'var(--A)',marginBottom:9}}>📅 Сегодня ({todayT.length})</div>
      {todayT.map(t=><div key={t.id} className="task-r" style={{cursor:'pointer',marginBottom:6,borderRadius:11}} onClick={()=>onOpen(t.cl)}>
        <div className="tchk"/><div style={{flex:1,fontWeight:600,fontSize:13}}>{t.type}{t.text&&<span style={{color:'var(--mu)',fontWeight:400'}}> — {t.text}</span>}</div><span style={{fontSize:12,color:'var(--mu)',fontWeight:600}}>{t.cFio}</span>
      </div>)}
    </div>}
    {rest.length>0&&<div>
      <div style={{fontWeight:800,fontSize:13,color:'var(--mu)',marginBottom:9}}>📋 Остальные ({rest.length})</div>
      {rest.map(t=><div key={t.id} className="task-r" style={{cursor:'pointer',marginBottom:6,borderRadius:11}} onClick={()=>onOpen(t.cl)}>
        <div className="tchk"/><div style={{flex:1,fontWeight:600,fontSize:13}}>{t.type}{t.text&&<span style={{color:'var(--mu)',fontWeight:400}}> — {t.text}</span>}</div><span style={{fontSize:12,color:'var(--mu)'}}>{t.cFio}</span>
      </div>)}
    </div>}
  </div>;
}

// ═══ KPI PAGE ═══
function KPI({clients,managers,user}){
  const [period,setPeriod]=useState('month');
  const range=period==='week'?wkS():period==='month'?moS():'2000-01-01';
  const stats=managers.map(m=>{
    const all=clients.filter(c=>c.manager===m.id);const pCl=all.filter(c=>c.createdAt>=range);
    const ct=all.filter(c=>c.contractType);const pCt=pCl.filter(c=>c.contractType);
    const rev=ct.reduce((s,c)=>s+c.contractAmount,0);const pRev=pCt.reduce((s,c)=>s+c.contractAmount,0);
    const paidRev=all.flatMap(c=>c.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0);
    const appr=all.filter(c=>['approval','deal','issuance','closed'].includes(c.stage));
    const clsd=all.filter(c=>c.stage==='closed');
    const tasks=all.flatMap(c=>c.tasks);const ovrdue=tasks.filter(t=>!t.done&&t.due&&t.due<today());
    const conv=all.length?Math.round(ct.length/all.length*100):0;
    return {m,all:all.length,pLeads:pCl.length,contracts:ct.length,pCt:pCt.length,rev,pRev,paidRev,approved:appr.length,closed:clsd.length,conv,convCA:ct.length?Math.round(appr.length/ct.length*100):0,overdue:ovrdue.length,done:tasks.filter(t=>t.done).length,total:tasks.length};
  }).sort((a,b)=>b.rev-a.rev);
  const maxRev=Math.max(...stats.map(s=>s.rev),1);
  const totalRev=stats.reduce((s,x)=>s+x.rev,0);
  const totalPaid=stats.reduce((s,x)=>s+x.paidRev,0);

  return <div>
    <div style={{display:'flex',gap:7,marginBottom:18}}>
      {[{id:'week',l:'Неделя'},{id:'month',l:'Месяц'},{id:'all',l:'Всё время'}].map(p=><button key={p.id} className={`btn ${period===p.id?'btn-p':'btn-gh btn-o'}`} onClick={()=>setPeriod(p.id)}>{p.l}</button>)}
    </div>
    <div className="mg mg4" style={{marginBottom:16}}>
      {[{l:'Клиентов',v:clients.length,c:'#6366f1'},{l:'Договоров',v:clients.filter(c=>c.contractType).length,c:'#ec4899'},{l:'Выручка договоров',v:fmt(totalRev)+' ₸',c:'#8b5cf6'},{l:'Получено денег',v:fmt(totalPaid)+' ₸',c:'#10b981'}]
        .map(({l,v,c})=><div key={l} className="mc" style={{'--c':c}}><div className="mc-l">{l}</div><div className="mc-v">{v}</div></div>)}
    </div>
    {stats.map(s=><div key={s.m.id} style={{background:'var(--card)',border:'1.5px solid var(--br)',borderRadius:15,padding:'16px',marginBottom:11,boxShadow:'var(--sh)'}}>
      <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:12}}>
        <div style={{width:42,height:42,borderRadius:13,background:s.m.color+'22',color:s.m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:17,flexShrink:0}}>{s.m.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:800,fontSize:15}}>{s.m.name}</div><div style={{fontSize:12,color:'var(--mu)',marginTop:2}}>{s.all} клиентов · {s.contracts} договоров · {s.conv}% конверсия</div></div>
        <div style={{textAlign:'right'}}>
          <div style={{fontWeight:900,fontSize:20,color:s.m.color,letterSpacing:'-1px'}}>{fmt(s.rev)} ₸</div>
          <div style={{fontSize:11,color:'var(--G)',fontWeight:700}}>💰 {fmt(s.paidRev)} ₸ получено</div>
        </div>
      </div>
      <div style={{height:8,background:'var(--br)',borderRadius:20,overflow:'hidden',marginBottom:11}}>
        <div style={{height:'100%',width:`${Math.round(s.rev/maxRev*100)}%`,background:s.m.color,borderRadius:20,transition:'width .4s'}}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:6}}>
        {[['В работе',s.all-s.closed,'#0ea5e9'],['Дог.',s.contracts,'#ec4899'],['Одобр.',s.approved,'#10b981'],['Закр.',s.closed,'#22c55e'],['Лид→Дог',s.conv+'%',s.conv>=50?'#10b981':s.conv>=25?'#f59e0b':'#ef4444'],['Дог→Одоб',s.convCA+'%',s.convCA>=50?'#10b981':s.convCA>=25?'#f59e0b':'#ef4444'],['Задачи',`${s.done}/${s.total}`,'#14b8a6'],['Просроч.',s.overdue,s.overdue>0?'#ef4444':'#10b981']]
          .map(([l,v,c])=><div key={l} style={{background:'#f8fafc',border:'1px solid var(--br)',borderRadius:9,padding:'8px 5px',textAlign:'center'}}>
            <div style={{fontWeight:800,fontSize:15,color:c,letterSpacing:'-.5px'}}>{v}</div>
            <div style={{fontSize:9,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.04em',marginTop:2}}>{l}</div>
          </div>)}
      </div>
      <div style={{marginTop:9,padding:'8px 11px',background:'#f8fafc',borderRadius:9,display:'flex',gap:18,flexWrap:'wrap'}}>
        <span style={{fontSize:12}}><span style={{color:'var(--mu)'}}>За период: </span><b style={{color:s.m.color}}>{s.pLeads} лидов</b></span>
        <span style={{fontSize:12}}><span style={{color:'var(--mu)'}}>Договоров: </span><b style={{color:s.m.color}}>{s.pCt}</b></span>
        <span style={{fontSize:12}}><span style={{color:'var(--mu)'}}>Выручка: </span><b style={{color:s.m.color}}>{fmt(s.pRev)} ₸</b></span>
        <span style={{fontSize:12}}><span style={{color:'var(--mu)'}}>Получено: </span><b style={{color:'#10b981'}}>{fmt(s.paidRev)} ₸</b></span>
      </div>
    </div>)}
  </div>;
}

        <div style={{fontWeight:700,fontSize:12,color:'#065f46',marginBottom:6}}>Код кнопки для сайта (скопируйте и вставьте):</div>
        <div style={{background:'#022c22',borderRadius:8,padding:'11px',fontFamily:'monospace',fontSize:11,color:'#86efac',lineHeight:1.6,wordBreak:'break-all'}}>
          {'<a href="https://wa.me/77XXXXXXXXX?text=Здравствуйте!%20Хочу%20узнать%20про%20ипотечное%20сопровождение" target="_blank" style="background:#25d366;color:#fff;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px;">📱 Написать в WhatsApp</a>'}
        </div>
        <div style={{fontSize:11,color:'#047857',marginTop:6}}>⚠️ Замените 77XXXXXXXXX на ваш номер в формате без + (например: 77771234567)</div>
      </div>
    </div>

    {/* MANUAL ADD */}
    <div style={{marginBottom:16}}>
      {!showForm&&<button className="btn btn-g" onClick={()=>setShowForm(true)} style={{width:'100%',justifyContent:'center',padding:'12px'}}><i className="ti ti-brand-whatsapp"/>Добавить WhatsApp лид вручную</button>}
      {showForm&&<div style={{background:'var(--card)',borderRadius:14,padding:'16px',border:'2px solid #86efac'}}>
        <div style={{fontWeight:800,fontSize:14,marginBottom:13,color:'#065f46'}}>➕ Новый WhatsApp лид</div>
        <div className="r3">
          <Fl l="Имя клиента" ch={<input className="inp" value={form.fio} onChange={e=>sf('fio',e.target.value)} placeholder="Как написал в чате"/>}/>
          <Fl l="Телефон *" req ch={<input className="inp" value={form.phone} onChange={e=>sf('phone',e.target.value)} placeholder="+7 701 000-00-00"/>}/>
          <Fl l="Город" ch={<select className="inp" value={form.city} onChange={e=>sf('city',e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select>}/>
        </div>
        <Fl l="Назначить менеджеру" ch={<select className="inp" value={form.assignTo} onChange={e=>sf('assignTo',e.target.value)}><option value="">Не назначен</option>{managers.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>}/>
        <Fl l="Сообщение из чата" ch={<textarea className="inp" value={form.msg} onChange={e=>sf('msg',e.target.value)} placeholder="Вставьте текст переписки..." style={{minHeight:60}}/>}/>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-g" onClick={addLead} style={{flex:1,justifyContent:'center'}}><i className="ti ti-brand-whatsapp"/>Создать лид</button>
          <button className="btn btn-gh btn-o" onClick={()=>setShowForm(false)}>Отмена</button>
        </div>
      </div>}
    </div>

    {/* NEW WA LEADS */}
    {waNew.length>0&&<>
      <div style={{fontWeight:800,fontSize:15,marginBottom:11,display:'flex',alignItems:'center',gap:8}}>
        <span style={{background:'#fef9c3',color:'#854d0e',borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:700,border:'1px solid #fde68a'}}>🔔 Новые ({waNew.length})</span>
        <span style={{fontSize:12,color:'var(--mu)',fontWeight:400}}>Ждут назначения менеджера</span>
      </div>
      {waNew.map(c=><BigClientCard key={c.id} c={c} managers={managers} pipeline={pl} checklists={checklists} onOpen={onOpen}/>)}
    </>}

    {/* IN WORK */}
    {waWork.length>0&&<>
      <div style={{fontWeight:800,fontSize:15,marginBottom:11,marginTop:waNew.length?20:0,display:'flex',alignItems:'center',gap:8}}>
        <span style={{background:'#eff6ff',color:'#1d4ed8',borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:700,border:'1px solid #bfdbfe'}}>⚡ В работе ({waWork.length})</span>
      </div>
      {waWork.map(c=><BigClientCard key={c.id} c={c} managers={managers} pipeline={pl} checklists={checklists} onOpen={onOpen}/>)}
    </>}

    {waAll.length===0&&<div className="empty"><i className="ti ti-brand-whatsapp" style={{color:'#25d366',opacity:.4}}/><p>Нет WhatsApp лидов</p><div style={{fontSize:13,color:'var(--mu)',marginTop:4}}>Добавьте первый лид вручную или настройте интеграцию</div></div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
