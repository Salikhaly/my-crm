<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ипотека CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0f172a; --navy2: #1e293b; --navy3: #334155;
  --accent: #3b82f6; --accent2: #1d4ed8; --accent-bg: #eff6ff;
  --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --purple: #8b5cf6; --teal: #14b8a6; --pink: #ec4899; --orange: #f97316;
  --bg: #f1f5f9; --card: #ffffff;
  --border: #e2e8f0; --border2: #cbd5e1;
  --text: #0f172a; --muted: #64748b; --light: #94a3b8;
  --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13.5px; }
.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sb { width: 220px; background: var(--navy); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sb-logo { padding: 20px 18px 16px; border-bottom: 1px solid #1e293b; }
.sb-logo-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px; color: #fff; display: flex; align-items: center; gap: 8px; }
.sb-logo-sub { font-size: 11px; color: #64748b; margin-top: 3px; }
.sb-nav { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: #94a3b8; font-size: 13px; font-weight: 500; transition: all .12s; user-select: none; }
.sb-item:hover { background: #1e293b; color: #fff; }
.sb-item.active { background: var(--accent); color: #fff; }
.sb-item i { font-size: 17px; width: 20px; flex-shrink: 0; }
.sb-section { padding: 8px 18px 4px; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #475569; text-transform: uppercase; margin-top: 8px; }
.sb-footer { padding: 14px 16px; border-top: 1px solid #1e293b; font-size: 11px; color: #475569; }
.sb-user { display: flex; align-items: center; gap: 8px; }
.sb-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }

/* MAIN */
.main { flex: 1; overflow: auto; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
.topbar-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.content { padding: 24px 28px; }

/* BUTTONS */
.btn { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--card); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .12s; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn-primary:hover { background: var(--accent2); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn-ghost:hover { background: var(--bg); }
.btn-danger { background: #fef2f2; color: var(--danger); border-color: #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-success { background: #f0fdf4; color: var(--success); border-color: #bbf7d0; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-p { padding: 18px; }

/* METRICS */
.metric-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.metric-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--c, var(--accent)); }
.metric-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.metric-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--c, var(--text)); }
.metric-sub { font-size: 11px; color: var(--light); margin-top: 4px; }

/* TABLE */
table { width: 100%; border-collapse: collapse; }
th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); background: #f8fafc; }
td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #f8fafc; cursor: pointer; }

/* BADGE */
.badge { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }

/* INPUT */
.input { background: #f8fafc; border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; font-family: inherit; width: 100%; outline: none; transition: border .12s; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
select.input { cursor: pointer; }
textarea.input { resize: vertical; min-height: 70px; }
.field { margin-bottom: 13px; }
.field-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* KANBAN */
.kanban-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; min-height: 400px; }
.kanban-scroll::-webkit-scrollbar { height: 6px; }
.kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.k-col { background: #f1f5f9; border: 1px solid var(--border); border-radius: 12px; min-width: 200px; flex: 0 0 200px; display: flex; flex-direction: column; transition: border-color .12s, background .12s; }
.k-col.drag-over { border-color: var(--accent); background: var(--accent-bg); }
.k-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--border); }
.k-stage-row { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.k-count { font-size: 11px; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 1px 7px; color: var(--muted); margin-left: auto; }
.k-total { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }
.k-body { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; max-height: 70vh; }
.k-card { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 11px 12px; cursor: pointer; transition: all .12s; box-shadow: var(--shadow); }
.k-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.1); transform: translateY(-1px); }
.k-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.k-phone { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.k-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.k-amount { font-size: 13px; font-weight: 700; color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

/* MODAL */
.overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
.modal { background: var(--card); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.2); width: 860px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-sm { width: 460px; }
.modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-size: 17px; font-weight: 700; }
.modal-body { flex: 1; overflow-y: auto; }
.modal-ft { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

/* TABS */
.tabs { display: flex; gap: 2px; padding: 14px 22px 0; border-bottom: 1px solid var(--border); background: #f8fafc; overflow-x: auto; flex-shrink: 0; }
.tabs::-webkit-scrollbar { height: 3px; }
.tab { padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); transition: all .12s; white-space: nowrap; border: 1px solid transparent; border-bottom: none; margin-bottom: -1px; }
.tab.active { background: var(--card); color: var(--accent); border-color: var(--border); }
.tab:hover:not(.active) { color: var(--text); }
.tab-body { padding: 20px 22px; }

/* PROGRESS */
.prog-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 3px; transition: width .3s; }

/* CHECKLIST */
.cl-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.cl-item:last-child { border-bottom: none; }
.cl-item:hover { opacity: .8; }
.cl-box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s; }
.cl-box.done { background: var(--success); border-color: var(--success); }

/* TASK */
.task-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.task-row:last-child { border-bottom: none; }
.task-chk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .12s; }

/* STAGE PROGRESS BAR */
.accomp-stages { display: flex; gap: 0; margin: 12px 0; }
.accomp-step { flex: 1; text-align: center; position: relative; }
.accomp-step::before { content: ''; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 0; }
.accomp-step:first-child::before { left: 50%; }
.accomp-step:last-child::before { right: 50%; }
.accomp-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border2); background: var(--card); display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; font-size: 10px; font-weight: 700; position: relative; z-index: 1; transition: all .12s; }
.accomp-dot.done { background: var(--success); border-color: var(--success); color: #fff; }
.accomp-dot.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,.2); }
.accomp-label { font-size: 9px; color: var(--muted); font-weight: 500; line-height: 1.2; }

/* SEARCH BAR */
.search-wrap { position: relative; }
.search-wrap i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }
.search-wrap input { padding-left: 34px; }

/* FILTER BAR */
.filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

/* KPI TABLE */
.kpi-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.kpi-fill { height: 100%; background: var(--accent); border-radius: 4px; }

/* COMMENT */
.comment-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment-item:last-child { border-bottom: none; }
.comment-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; }
.comment-text { font-size: 13px; line-height: 1.5; }

/* TAGS */
.source-badge { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

/* LOADING */
.loading { display: flex; align-items: center; justify-content: center; height: 300px; color: var(--muted); font-size: 14px; gap: 10px; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 9999; box-shadow: var(--shadow-md); }

/* CONTRACT HIGHLIGHT */
.contract-box { background: linear-gradient(135deg, #eff6ff, #f5f3ff); border: 1px solid #c7d2fe; border-radius: 10px; padding: 16px; }
.contract-amount { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }

/* CREDIT STATUS */
.credit-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.credit-option { border: 2px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: center; transition: all .12s; }
.credit-option.selected { border-color: var(--accent); background: var(--accent-bg); }
.credit-option:hover:not(.selected) { border-color: var(--border2); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>

function MH({title,subtitle,onClose}){
  return <div className="modal-hd">
    <div><div className="modal-title">{title}</div>{subtitle&&<div style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{subtitle}</div>}</div>
    <button className="btn btn-ghost btn-sm" onClick={onClose}><i className="ti ti-x"/></button>
  </div>;
}
function Fl({label,children}){return <div className="field"><div className="field-label">{label}</div>{children}</div>}
function MA({onClose,onSave,label='Сохранить',danger}){
  return <div className="modal-ft">
    <button className="btn" onClick={onClose}>Отмена</button>
    <button className={`btn ${danger?'btn-danger':'btn-primary'}`} onClick={onSave}>{label}</button>

}
function StageTag({stageId}){
  const s=PL_MAP[stageId];
  if(!s)return null;
  return <span className="badge" style={{background:s.color+'22',color:s.color}}>{s.label}</span>;
}
function CreditTag({statusId}){
  const c=CR_MAP[statusId];
  if(!c)return null;
  return <span className="badge" style={{background:c.color+'22',color:c.color}}>{c.label}</span>;
}
function SourceTag({src}){
  const s=SOURCES.find(x=>x.id===src);
  return <span className="source-badge" style={{background:SOURCE_COLORS[src]+'22',color:SOURCE_COLORS[src]}}>{s?.label||src}</span>;
}

// ═══════════════════════════ APP ══════════════════════════════════
function App(){
  const [page,setPage]=useState('dashboard');
  const [clients,setClients]=useState(()=>{
    try{const s=localStorage.getItem(SK);return s?JSON.parse(s):DEMO;}catch{return DEMO;}
  });
  const [modal,setModal]=useState(null);
  const [search,setSearch]=useState('');
  const [filterManager,setFilterManager]=useState('');
  const [filterStage,setFilterStage]=useState('');
  const [dragId,setDragId]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [toast,setToast]=useState(null);
  const toastRef=useRef(null);

  useEffect(()=>{try{localStorage.setItem(SK,JSON.stringify(clients));}catch{}},[clients]);

  function showToast(msg){setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2500);}
  function upd(fn){setClients(cs=>{const n=[...cs];fn(n);return n;});}
  function saveClient(c){
    upd(cs=>{const idx=cs.findIndex(x=>x.id===c.id);idx>=0?cs.splice(idx,1,c):cs.push(c);});
    showToast(c.fio?`${c.fio} сохранён`:'Клиент добавлен');
    setModal(null);
  }
  function delClient(id){upd(cs=>cs.splice(cs.findIndex(x=>x.id===id),1));showToast('Удалено');setModal(null);}
  function moveClient(id,stage){upd(cs=>{const c=cs.find(x=>x.id===id);if(c)c.stage=stage;});showToast(`Переведён: ${PL_MAP[stage]?.label}`);}

  const filtered=clients.filter(c=>{
    if(search&&!c.fio.toLowerCase().includes(search.toLowerCase())&&!c.phone.includes(search)&&!c.iin.includes(search))return false;
    if(filterManager&&c.manager!==filterManager)return false;
    if(filterStage&&c.stage!==filterStage)return false;
    return true;
  });

  const NAV=[
    {id:'dashboard',label:'Дашборд',icon:'ti-layout-dashboard'},
    {id:'clients',label:'Клиенты',icon:'ti-users'},
    {id:'tasks',label:'Задачи',icon:'ti-checkbox'},
    {id:'kpi',label:'KPI сотрудников',icon:'ti-chart-bar'},
  ];

  return <div className="app">
    {/* SIDEBAR */}
    <div className="sb">
      <div className="sb-logo">
        <div className="sb-logo-title"><i className="ti ti-home-filled" style={{color:'var(--accent)'}}/>Ипотека CRM</div>
        <div className="sb-logo-sub">Система управления клиентами</div>
      </div>
      <div className="sb-nav">
        <div className="sb-section">Навигация</div>
        {NAV.map(n=><div key={n.id} className={`sb-item${page===n.id?' active':''}`} onClick={()=>setPage(n.id)}>
          <i className={`ti ${n.icon}`}/>{n.label}
        </div>)}
        <div className="sb-section" style={{marginTop:16}}>Воронка</div>
        {PIPELINE.map(p=>{
          const cnt=clients.filter(c=>c.stage===p.id).length;
          return <div key={p.id} className="sb-item" style={{justifyContent:'space-between'}} onClick={()=>{setPage('clients');setFilterStage(p.id);}}>
            <span style={{display:'flex',alignItems:'center',gap:8}}><span className="dot" style={{background:p.color}}/>{p.label}</span>
            {cnt>0&&<span style={{background:p.color+'33',color:p.color,borderRadius:20,padding:'1px 7px',fontSize:11,fontWeight:700}}>{cnt}</span>}
          </div>;
        })}
      </div>
      <div className="sb-footer">
        <div className="sb-user">
          <div className="sb-avatar">АБ</div>
          <div><div style={{fontSize:12,fontWeight:600,color:'#94a3b8'}}>Руководитель</div><div style={{fontSize:11,color:'#475569'}}>Полный доступ</div></div>
        </div>
      </div>
    </div>

    {/* MAIN */}
    <div className="main">
      <div className="topbar">
        <div className="topbar-title">{NAV.find(n=>n.id===page)?.label||'CRM'}</div>
        <div className="topbar-right">
          {page==='clients'&&<>
            <div className="search-wrap"><i className="ti ti-search"/><input className="input" style={{width:220}} placeholder="Поиск клиента..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
            <select className="input" style={{width:150}} value={filterManager} onChange={e=>setFilterManager(e.target.value)}>
              <option value="">Все менеджеры</option>{MANAGERS.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
            <select className="input" style={{width:160}} value={filterStage} onChange={e=>setFilterStage(e.target.value)}>
              <option value="">Все этапы</option>{PIPELINE.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
            </select>
          </>}
          <button className="btn btn-primary" onClick={()=>setModal({type:'client',item:emptyClient()})}>
            <i className="ti ti-plus"/>Новый клиент
          </button>
        </div>
      </div>
      <div className="content">
        {page==='dashboard'&&<Dashboard clients={clients} onOpen={c=>setModal({type:'client',item:c})}/>}
        {page==='clients'&&<ClientsPage clients={filtered} allClients={clients} onOpen={c=>setModal({type:'client',item:c})} dragId={dragId} setDragId={setDragId} dragOver={dragOver} setDragOver={setDragOver} onMove={moveClient}/>}
        {page==='tasks'&&<TasksPage clients={clients} onOpen={c=>setModal({type:'client',item:c})} onSave={saveClient}/>}
        {page==='kpi'&&<KPIPage clients={clients}/>}
      </div>
    </div>

    {/* MODALS */}
    {modal?.type==='client'&&<ClientModal key={modal.item.id} client={modal.item} onSave={saveClient} onDelete={delClient} onClose={()=>setModal(null)}/>}
    {toast&&<div className="toast"><i className="ti ti-check"/> {toast}</div>}
  </div>;
}

// ═══════════════════════════ DASHBOARD ════════════════════════════
function Dashboard({clients,onOpen}){
  const now=new Date(),month=now.getMonth(),year=now.getFullYear();
  const thisMonth=clients.filter(c=>{const d=new Date(c.createdAt);return d.getMonth()===month&&d.getFullYear()===year;});
  const active=clients.filter(c=>!['closed'].includes(c.stage));
  const withContract=clients.filter(c=>c.contractType);
  const revenue=withContract.reduce((s,c)=>s+c.contractAmount,0);
  const inAccomp=clients.filter(c=>c.stage==='accompaniment');
  const approved=clients.filter(c=>['approval','deal','issuance','closed'].includes(c.stage));
  const closed=clients.filter(c=>c.stage==='closed');

  const managerStats=MANAGERS.map(m=>{
    const mc=clients.filter(c=>c.manager===m);
    const contracts=mc.filter(c=>c.contractType);
    const rev=contracts.reduce((s,c)=>s+c.contractAmount,0);
    const conv=mc.length?Math.round(contracts.length/mc.length*100):0;
    return {name:m,leads:mc.length,contracts:contracts.length,revenue:rev,conversion:conv};
  }).sort((a,b)=>b.revenue-a.revenue);

  const maxRev=Math.max(...managerStats.map(m=>m.revenue),1);

  // Funnel conversions
  const funnelData=[
    {label:'Лиды',count:clients.length},
    {label:'В работе',count:clients.filter(c=>c.stage!=='new_lead').length},
    {label:'Консультация',count:clients.filter(c=>['consultation','contract','accompaniment','approval','deal','issuance','closed'].includes(c.stage)).length},
    {label:'Договор',count:withContract.length},
    {label:'Одобрение',count:approved.length},
    {label:'Закрыто',count:closed.length},
  ];

  return <div>
    <div className="metric-grid">
      {[
        {label:'Новых лидов (месяц)',value:thisMonth.length,sub:`${clients.length} всего`,color:'#6366f1'},
        {label:'Активных клиентов',value:active.length,sub:`${inAccomp.length} в сопровождении`,color:'#0ea5e9'},
        {label:'Договоров',value:withContract.length,sub:`${Math.round(withContract.length/Math.max(clients.length,1)*100)}% конверсия`,color:'#ec4899'},
        {label:'Выручка',value:fmt(revenue)+' ₸',sub:`среднее: ${fmt(revenue/Math.max(withContract.length,1))} ₸`,color:'#10b981'},
      ].map(({label,value,sub,color})=><div key={label} className="metric-card" style={{'--c':color}}>
        <div className="metric-label">{label}</div>
        <div className="metric-value">{value}</div>
        <div className="metric-sub">{sub}</div>
      </div>)}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
      {/* FUNNEL */}
      <div className="card card-p">
        <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>Воронка продаж</div>
        {funnelData.map((f,i)=>{
          const pct=Math.round(f.count/Math.max(funnelData[0].count,1)*100);
          return <div key={f.label} style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
              <span style={{fontWeight:500}}>{f.label}</span>
              <span style={{color:'var(--muted)'}}>{f.count} клиентов</span>
            </div>
            <div className="prog-wrap">
              <div className="prog-bar" style={{width:`${pct}%`,background:PIPELINE[Math.min(i,PIPELINE.length-1)].color}}/>
            </div>
          </div>;
        })}
      </div>

      {/* PIPELINE SUMMARY */}
      <div className="card card-p">
        <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>Этапы воронки</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {PIPELINE.map(p=>{
            const cnt=clients.filter(c=>c.stage===p.id).length;
            const rev=clients.filter(c=>c.stage===p.id&&c.contractAmount).reduce((s,c)=>s+c.contractAmount,0);
            return <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',borderRadius:8,background:'#f8fafc',border:'1px solid var(--border)'}}>
              <span className="dot" style={{background:p.color}}/>
              <span style={{flex:1,fontSize:13,fontWeight:500}}>{p.label}</span>
              <span style={{background:p.color+'22',color:p.color,borderRadius:20,padding:'2px 8px',fontSize:11,fontWeight:700}}>{cnt}</span>
              {rev>0&&<span style={{fontSize:11,color:'var(--muted)'}}>{fmt(rev)} ₸</span>}
            </div>;
          })}
        </div>
      </div>
    </div>

    {/* MANAGERS TABLE */}
    <div className="card" style={{overflow:'hidden'}}>
      <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:14}}>Рейтинг менеджеров</div>
      <table>
        <thead><tr>
          {['Менеджер','Лиды','Договоры','Выручка','Конверсия','Прогресс'].map(h=><th key={h}>{h}</th>)}
        </tr></thead>
        <tbody>
          {managerStats.map((m,i)=><tr key={m.name}>
            <td>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="avatar" style={{background:['#6366f1','#10b981','#f59e0b','#ec4899'][i%4]+'22',color:['#6366f1','#10b981','#f59e0b','#ec4899'][i%4],fontSize:12}}>{m.name[0]}</div>
                <div style={{fontWeight:600}}>{m.name}</div>
              </div>
            </td>
            <td>{m.leads}</td>
            <td><span style={{background:'#eff6ff',color:'var(--accent)',borderRadius:20,padding:'2px 8px',fontSize:12,fontWeight:700}}>{m.contracts}</span></td>
            <td style={{fontWeight:700,color:'var(--success)'}}>{m.revenue>0?fmt(m.revenue)+' ₸':'—'}</td>
            <td><span style={{color:m.conversion>=50?'var(--success)':m.conversion>=25?'var(--warn)':'var(--danger)',fontWeight:700}}>{m.conversion}%</span></td>
            <td style={{width:140}}>
              <div className="kpi-bar"><div className="kpi-fill" style={{width:`${Math.round(m.revenue/maxRev*100)}%`,background:['#6366f1','#10b981','#f59e0b','#ec4899'][i%4]}}/></div>
            </td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

function ClientModal({client,onSave,onDelete,onClose}){
  const [f,sf]=useState({...client});
  const [tab,setTab]=useState('profile');
  const [newComment,setNewComment]=useState('');
  const [newTask,setNewTask]=useState({type:TASK_TYPES[0],text:'',due:''});

  function set(k,v){sf(x=>({...x,[k]:v}));}
  function save(){onSave({...f});}

  const ct=CT_MAP[f.contractType];
  const totalDone=Object.values(f.checklists).flat().length;
  const allItems=Object.keys(CHECKLISTS).reduce((s,k)=>s+CHECKLISTS[k].items.length,0);

  function addComment(){
    if(!newComment.trim())return;
    set('comments',[...f.comments,{id:uid(),text:newComment,date:nowStr(),author:'Вы'}]);
    setNewComment('');
  }
  function addTask(){
    if(!newTask.text.trim())return;
    set('tasks',[...f.tasks,{id:uid(),...newTask,done:false,created:nowStr()}]);
    setNewTask({type:TASK_TYPES[0],text:'',due:''});
  }
  function toggleTask(id){set('tasks',f.tasks.map(t=>t.id===id?{...t,done:!t.done}:t));}
  function delTask(id){set('tasks',f.tasks.filter(t=>t.id!==id));}
  function toggleCheck(prog,item){
    const cur=(f.checklists[prog]||[]);
    set('checklists',{...f.checklists,[prog]:cur.includes(item)?cur.filter(x=>x!==item):[...cur,item]});
  }
  function selectContract(id){
    const ct=CT_MAP[id];
    sf(x=>({...x,contractType:id,contractAmount:ct?.amount||0}));
  }

  const TABS=[
    {id:'profile',label:'Профиль'},
    {id:'analysis',label:'Анализ'},
    {id:'credit',label:'Кредитная история'},
    {id:'contract',label:'Договор'},
    {id:'reassignment',label:'Переуступка'},
    {id:'accompaniment',label:'Сопровождение'},
    {id:'checklist',label:'Чек-лист'},
    {id:'tasks',label:`Задачи (${f.tasks.filter(t=>!t.done).length})`},
    {id:'history',label:`История (${f.comments.length})`},
  ];

  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>

      <div style={{padding:'10px 22px',borderBottom:'1px solid var(--border)',background:'#f8fafc',display:'flex',gap:6,overflowX:'auto'}}>
        {PIPELINE.map(p=><button key={p.id} onClick={()=>set('stage',p.id)}
          style={{padding:'4px 10px',borderRadius:20,border:`1.5px solid ${f.stage===p.id?p.color:'transparent'}`,background:f.stage===p.id?p.color+'22':'transparent',color:f.stage===p.id?p.color:'var(--muted)',fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',transition:'all .12s'}}>
          {p.label}
        </button>)}
      </div>

      <div className="tabs">
        {TABS.map(t=><div key={t.id} className={`tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</div>)}
      </div>

      <div className="modal-body">
        <div className="tab-body">

          {/* ── PROFILE ── */}
          {tab==='profile'&&<>
            <div className="field-row3">
              <Fl label="ФИО *"><input className="input" value={f.fio} onChange={e=>set('fio',e.target.value)} placeholder="Фамилия Имя Отчество"/></Fl>
              <Fl label="ИИН *"><input className="input" value={f.iin} onChange={e=>set('iin',e.target.value)} placeholder="123456789012" maxLength={12}/></Fl>
              <Fl label="Телефон *"><input className="input" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="+7 701 000-00-00"/></Fl>
            </div>
            <div className="field-row">
              <Fl label="Город"><select className="input" value={f.city} onChange={e=>set('city',e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select></Fl>
              <Fl label="Менеджер"><select className="input" value={f.manager} onChange={e=>set('manager',e.target.value)}>{MANAGERS.map(m=><option key={m}>{m}</option>)}</select></Fl>
            </div>
            <div className="field-row">
              <Fl label="Дата поступления"><input className="input" type="date" value={f.dateIn} onChange={e=>set('dateIn',e.target.value)}/></Fl>
              <Fl label="Источник лида"><select className="input" value={f.source} onChange={e=>set('source',e.target.value)}>{SOURCES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}</select></Fl>
            </div>
            <Fl label="Статус связи">
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {CONTACT_STATUSES.map(s=><button key={s} onClick={()=>set('contactStatus',s)}
                  style={{padding:'5px 12px',borderRadius:20,border:`1.5px solid ${f.contactStatus===s?'var(--accent)':'var(--border2)'}`,background:f.contactStatus===s?'var(--accent-bg)':'transparent',color:f.contactStatus===s?'var(--accent)':'var(--muted)',fontSize:12,cursor:'pointer',fontWeight:f.contactStatus===s?700:400}}>
                  {s}
                </button>)}
              </div>
            </Fl>
          </>}

          {/* ── ANALYSIS ── */}
          {tab==='analysis'&&<>
            <div style={{fontWeight:700,fontSize:13,marginBottom:12,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Личные данные</div>
            <div className="field-row">
              <Fl label="Семейное положение"><select className="input" value={f.maritalStatus} onChange={e=>set('maritalStatus',e.target.value)}><option value="">Не указано</option>{MARITAL_STATUSES.map(s=><option key={s}>{s}</option>)}</select></Fl>
              <Fl label="Количество детей"><input className="input" type="number" min="0" value={f.children} onChange={e=>set('children',e.target.value)} placeholder="0"/></Fl>
            </div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:12,marginTop:8,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Финансы</div>
            <div className="field-row">
              <Fl label="Официальный доход (₸)"><input className="input" type="number" value={f.officialIncome} onChange={e=>set('officialIncome',e.target.value)} placeholder="0"/></Fl>
              <Fl label="Дополнительный доход (₸)"><input className="input" type="number" value={f.extraIncome} onChange={e=>set('extraIncome',e.target.value)} placeholder="0"/></Fl>
            </div>
            <div className="field-row">
              <Fl label="Пенсионные отчисления (₸)"><input className="input" type="number" value={f.pensionContributions} onChange={e=>set('pensionContributions',e.target.value)} placeholder="0"/></Fl>
              <Fl label="Рабочий стаж (лет)"><input className="input" type="number" value={f.workExperience} onChange={e=>set('workExperience',e.target.value)} placeholder="0"/></Fl>
            </div>
            <div className="field-row">
              <Fl label="Тип занятости"><select className="input" value={f.workType} onChange={e=>set('workType',e.target.value)}>{WORK_TYPES.map(w=><option key={w.id} value={w.id}>{w.label}</option>)}</select></Fl>
              <Fl label="Подтверждается доп. доход?">
                <div style={{display:'flex',gap:8,marginTop:4}}>
                  {['Да','Нет'].map(v=><button key={v} onClick={()=>set('extraIncomeConfirmed',v==='Да')} style={{flex:1,padding:'8px',borderRadius:8,border:`1.5px solid ${f.extraIncomeConfirmed===(v==='Да')?'var(--accent)':'var(--border2)'}`,background:f.extraIncomeConfirmed===(v==='Да')?'var(--accent-bg)':'transparent',cursor:'pointer',fontWeight:600,fontSize:13,color:f.extraIncomeConfirmed===(v==='Да')?'var(--accent)':'var(--muted)'}}>{v}</button>)}
                </div>
              </Fl>
            </div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:12,marginTop:8,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Первоначальный взнос</div>
            <div className="field-row">
              <Fl label="Сумма ПВ (₸)"><input className="input" type="number" value={f.downPayment} onChange={e=>set('downPayment',e.target.value)} placeholder="0"/></Fl>
              <Fl label="Тип ПВ"><select className="input" value={f.downPaymentType} onChange={e=>set('downPaymentType',e.target.value)}>{DOWN_TYPES.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</select></Fl>
            </div>
            {(f.downPaymentType==='deposit'||f.downPaymentType==='mixed')&&<div className="field-row3">
              <Fl label="Банк депозита"><input className="input" value={f.depositBank} onChange={e=>set('depositBank',e.target.value)} placeholder="Название банка"/></Fl>
              <Fl label="Сумма депозита (₸)"><input className="input" type="number" value={f.depositAmount} onChange={e=>set('depositAmount',e.target.value)}/></Fl>
              <Fl label="Срок накопления"><input className="input" value={f.depositTerm} onChange={e=>set('depositTerm',e.target.value)} placeholder="36 мес"/></Fl>
            </div>}
          </>}

          {/* ── CREDIT ── */}
          {tab==='credit'&&<>
            <Fl label="Статус кредитной истории">
              <div className="credit-grid">
                {CREDIT_STATUSES.map(s=><div key={s.id} className={`credit-option${f.creditStatus===s.id?' selected':''}`} onClick={()=>set('creditStatus',s.id)}>
                  <span className="dot" style={{background:s.color,marginBottom:4,display:'block',margin:'0 auto 4px'}}/>
                  <div style={{fontSize:11,fontWeight:600,color:f.creditStatus===s.id?s.color:'var(--text)'}}>{s.label}</div>
                </div>)}
              </div>
            </Fl>
            <div style={{marginTop:16}}>
              <div className="field-row">
                <Fl label="Количество кредитов"><input className="input" type="number" value={f.creditsCount} onChange={e=>set('creditsCount',e.target.value)} placeholder="0"/></Fl>
                <Fl label="Ежемес. нагрузка (₸)"><input className="input" type="number" value={f.monthlyLoad} onChange={e=>set('monthlyLoad',e.target.value)} placeholder="0"/></Fl>
              </div>
              <div className="field-row">
                {[['hasOverdue','Есть просрочки'],['hadBankRefusal','Был отказ банка'],['hasRefinancing','Рефинансирование'],['problematicCredits','Проблемные кредиты'],['courtRestrictions','Суд. ограничения']].map(([k,label])=><div key={k} style={{display:'flex',alignItems:'center',gap:8,padding:'10px',border:'1px solid var(--border)',borderRadius:8,cursor:'pointer',background:f[k]?'#fef2f2':'transparent'}} onClick={()=>set(k,!f[k])}>
                  <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${f[k]?'var(--danger)':'var(--border2)'}`,background:f[k]?'var(--danger)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {f[k]&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}
                  </div>
                  <span style={{fontSize:12,fontWeight:500,color:f[k]?'var(--danger)':'var(--text)'}}>{label}</span>
                </div>)}
              </div>
            </div>
          </>}

          {/* ── CONTRACT ── */}
          {tab==='contract'&&<>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
              {CONTRACT_TYPES.map(ct=><div key={ct.id} onClick={()=>selectContract(ct.id)}
                style={{padding:'12px 14px',borderRadius:10,border:`2px solid ${f.contractType===ct.id?'var(--accent)':'var(--border)'}`,background:f.contractType===ct.id?'var(--accent-bg)':'var(--bg)',cursor:'pointer',transition:'all .12s'}}>
                <div style={{fontWeight:600,fontSize:13,color:f.contractType===ct.id?'var(--accent)':'var(--text)'}}>{ct.label}</div>
                {ct.amount>0&&<div style={{fontWeight:800,fontSize:16,color:f.contractType===ct.id?'var(--accent)':'var(--muted)',marginTop:3}}>{fmt(ct.amount)} ₸</div>}
              </div>)}
            </div>
            {f.contractType&&<div className="contract-box">
              <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>Итого по договору</div>
              <div style={{display:'flex',alignItems:'center',gap:16}}>
                <div className="contract-amount">{fmt(f.contractAmount)} ₸</div>
                <div>
                  <div style={{fontWeight:600}}>{CT_MAP[f.contractType]?.label}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>Менеджер: {f.manager}</div>
                </div>
              </div>
              <div style={{marginTop:12}}>
                <Fl label="Сумма по договору (если другая)">
                  <input className="input" type="number" value={f.contractAmount} onChange={e=>set('contractAmount',+e.target.value)}/>
                </Fl>
              </div>
            </div>}
            <div style={{marginTop:16}}>
              <div className="field-row">
                <Fl label="Ссылка на Miro"><input className="input" value={f.miroLink} onChange={e=>set('miroLink',e.target.value)} placeholder="https://miro.com/..."/></Fl>
                <Fl label="Ссылка на Roadmap"><input className="input" value={f.roadmapLink} onChange={e=>set('roadmapLink',e.target.value)} placeholder="https://..."/></Fl>
              </div>
              <Fl label="Google Drive (документы)"><input className="input" value={f.driveLink} onChange={e=>set('driveLink',e.target.value)} placeholder="https://drive.google.com/..."/></Fl>
              {(f.miroLink||f.roadmapLink||f.driveLink)&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                {f.miroLink&&<a href={f.miroLink} target="_blank" className="btn btn-sm"><i className="ti ti-external-link"/>Miro</a>}
                {f.roadmapLink&&<a href={f.roadmapLink} target="_blank" className="btn btn-sm"><i className="ti ti-map"/>Roadmap</a>}
                {f.driveLink&&<a href={f.driveLink} target="_blank" className="btn btn-sm"><i className="ti ti-brand-google-drive"/>Drive</a>}
              </div>}
            </div>
          </>}

          {/* ── REASSIGNMENT ── */}
          {tab==='reassignment'&&<>
            <div style={{marginBottom:14}}>
              <Fl label="Переуступка?">
                <div style={{display:'flex',gap:8}}>
                  {['Да','Нет'].map(v=><button key={v} onClick={()=>set('isReassignment',v==='Да')} style={{flex:1,padding:'8px',borderRadius:8,border:`1.5px solid ${f.isReassignment===(v==='Да')?'var(--accent)':'var(--border2)'}`,background:f.isReassignment===(v==='Да')?'var(--accent-bg)':'transparent',cursor:'pointer',fontWeight:600,fontSize:13,color:f.isReassignment===(v==='Да')?'var(--accent)':'var(--muted)'}}>{v}</button>)}
                </div>
              </Fl>
            </div>
            {f.isReassignment&&<>
              <div className="field-row">
                <Fl label="Жилой комплекс"><input className="input" value={f.reassignmentComplex} onChange={e=>set('reassignmentComplex',e.target.value)} placeholder="Название ЖК"/></Fl>
                <Fl label="Застройщик"><input className="input" value={f.reassignmentDeveloper} onChange={e=>set('reassignmentDeveloper',e.target.value)} placeholder="Название застройщика"/></Fl>
              </div>
              <div className="field-row3">
                <Fl label="Сумма переуступки (₸)"><input className="input" type="number" value={f.reassignmentAmount} onChange={e=>set('reassignmentAmount',e.target.value)}/></Fl>
                <Fl label="Остаток ипотеки (₸)"><input className="input" type="number" value={f.mortgageBalance} onChange={e=>set('mortgageBalance',e.target.value)}/></Fl>
                <Fl label="Банк"><input className="input" value={f.reassignmentBank} onChange={e=>set('reassignmentBank',e.target.value)} placeholder="Название банка"/></Fl>
              </div>
              <div style={{display:'flex',gap:16,marginTop:8}}>
                {[['hasDebt','Есть задолженность'],['urgentSale','Срочная продажа']].map(([k,label])=><div key={k} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',border:'1px solid var(--border)',borderRadius:8,cursor:'pointer',flex:1,background:f[k]?'#fffbeb':'transparent'}} onClick={()=>set(k,!f[k])}>
                  <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${f[k]?'var(--warn)':'var(--border2)'}`,background:f[k]?'var(--warn)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {f[k]&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}
                  </div>
                  <span style={{fontSize:13,fontWeight:600}}>{label}</span>
                </div>)}
              </div>
            </>}
          </>}

          {/* ── ACCOMPANIMENT ── */}
          {tab==='accompaniment'&&<>
            <div className="field-row">
              <Fl label="Ответственный менеджер"><select className="input" value={f.responsibleManager} onChange={e=>set('responsibleManager',e.target.value)}><option value="">Не назначен</option>{MANAGERS.map(m=><option key={m}>{m}</option>)}</select></Fl>
              <Fl label="Ипотечный специалист"><input className="input" value={f.mortgageSpecialist} onChange={e=>set('mortgageSpecialist',e.target.value)} placeholder="ФИО специалиста"/></Fl>
            </div>
            <div style={{fontWeight:700,fontSize:13,margin:'8px 0 12px',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}}>Этап сопровождения</div>
            <div className="accomp-stages">
              {ACCOMP_STAGES.map((s,i)=><div key={s} className="accomp-step" onClick={()=>set('accompStageIndex',i)}>
                <div className={`accomp-dot${i<f.accompStageIndex?' done':i===f.accompStageIndex?' active':''}`}>
                  {i<f.accompStageIndex?<i className="ti ti-check" style={{fontSize:10}}/>:i+1}
                </div>
                <div className="accomp-label">{s}</div>
              </div>)}
            </div>
            <div style={{marginTop:16,padding:'12px',background:'var(--accent-bg)',borderRadius:10,border:'1px solid #bfdbfe'}}>
              <div style={{fontWeight:700,fontSize:13,color:'var(--accent)'}}>Текущий этап: {ACCOMP_STAGES[f.accompStageIndex]}</div>
              <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>Завершено {f.accompStageIndex} из {ACCOMP_STAGES.length} этапов</div>
            </div>
          </>}

          {/* ── CHECKLIST ── */}
          {tab==='checklist'&&<>
            {Object.keys(CHECKLISTS).map(prog=>{
              const cl=CHECKLISTS[prog];
              const done=(f.checklists[prog]||[]);
              const pct=Math.round(done.length/cl.items.length*100);
              return <div key={prog} style={{marginBottom:20,background:'#f8fafc',borderRadius:10,padding:'14px',border:'1px solid var(--border)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:14}}>{cl.name}</div>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:'var(--muted)',fontWeight:600}}>{done.length}/{cl.items.length}</span>
                    <span style={{fontSize:12,fontWeight:700,color:pct===100?'var(--success)':'var(--accent)'}}>{pct}%</span>
                  </div>
                </div>
                <div className="prog-wrap" style={{marginBottom:10}}>
                  <div className="prog-bar" style={{width:`${pct}%`,background:pct===100?'var(--success)':'var(--accent)'}}/>
                </div>
                {cl.items.map(item=>{
                  const isDone=done.includes(item);
                  return <div key={item} className="cl-item" onClick={()=>toggleCheck(prog,item)}>
                    <div className={`cl-box${isDone?' done':''}`}>{isDone&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}</div>
                    <span style={{fontSize:13,textDecoration:isDone?'line-through':'none',color:isDone?'var(--muted)':'var(--text)'}}>{item}</span>
                  </div>;
                })}
              </div>;
            })}
          </>}

          {/* ── TASKS ── */}
          {tab==='tasks'&&<>
            <div style={{background:'#f8fafc',borderRadius:10,padding:'14px',border:'1px solid var(--border)',marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Добавить задачу</div>
              <div className="field-row">
                <Fl label="Тип задачи"><select className="input" value={newTask.type} onChange={e=>setNewTask(x=>({...x,type:e.target.value}))}>{TASK_TYPES.map(t=><option key={t}>{t}</option>)}</select></Fl>
                <Fl label="Срок"><input className="input" type="date" value={newTask.due} onChange={e=>setNewTask(x=>({...x,due:e.target.value}))}/></Fl>
              </div>
              <Fl label="Описание"><input className="input" value={newTask.text} onChange={e=>setNewTask(x=>({...x,text:e.target.value}))} placeholder="Детали задачи..." onKeyDown={e=>e.key==='Enter'&&addTask()}/></Fl>
              <button className="btn btn-primary btn-sm" onClick={addTask}><i className="ti ti-plus"/>Добавить задачу</button>
            </div>
            {f.tasks.length===0&&<div style={{textAlign:'center',color:'var(--light)',padding:30}}>Нет задач</div>}
            {f.tasks.map(t=><div key={t.id} className="task-row">
              <div className={`task-chk`} style={{background:t.done?'var(--success)':'transparent',borderColor:t.done?'var(--success)':'var(--border2)'}} onClick={()=>toggleTask(t.id)}>
                {t.done&&<i className="ti ti-check" style={{fontSize:11,color:'#fff'}}/>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13,textDecoration:t.done?'line-through':'none',color:t.done?'var(--muted)':'var(--text)'}}>{t.type}</div>
                {t.text&&<div style={{fontSize:12,color:'var(--muted)'}}>{t.text}</div>}
                {t.due&&<div style={{fontSize:11,color:'var(--light)'}}>До: {t.due}</div>}
              </div>
              <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>delTask(t.id)}><i className="ti ti-trash"/></button>
            </div>)}
          </>}

          {/* ── HISTORY ── */}
          {tab==='history'&&<>
            <div style={{marginBottom:14}}>
              <Fl label="Новый комментарий">
                <div style={{display:'flex',gap:8}}>
                  <textarea className="input" value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder="Добавьте заметку, результат звонка, статус..." style={{minHeight:60}}/>
                  <button className="btn btn-primary" style={{alignSelf:'flex-end',flexShrink:0}} onClick={addComment}><i className="ti ti-send"/>Добавить</button>
                </div>
              </Fl>
            </div>
            {f.comments.length===0&&<div style={{textAlign:'center',color:'var(--light)',padding:30}}>Нет записей</div>}
            {[...f.comments].reverse().map(c=><div key={c.id} className="comment-item">
              <div className="comment-meta"><i className="ti ti-message" style={{fontSize:12}}/><span>{c.author}</span><span>{c.date}</span></div>
              <div className="comment-text">{c.text}</div>
            </div>)}
          </>}

        </div>
      </div>

      <div className="modal-ft">
        <button className="btn btn-danger btn-sm" onClick={()=>onDelete(f.id)}><i className="ti ti-trash"/>Удалить</button>
        <div style={{flex:1}}/>
        <button className="btn" onClick={onClose}>Отмена</button>
        <button className="btn btn-primary" onClick={save}><i className="ti ti-device-floppy"/>Сохранить</button>
      </div>
    </div>
  </div>;
}

// ═══════════════════════════ TASKS PAGE ═══════════════════════════
function TasksPage({clients,onOpen,onSave}){
  const allTasks=clients.flatMap(c=>c.tasks.map(t=>({...t,clientId:c.id,clientName:c.fio,client:c})));
  const open=allTasks.filter(t=>!t.done);
  const done=allTasks.filter(t=>t.done);

  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
      {[
        {label:'Открытых задач',value:open.length,color:'var(--warn)'},
        {label:'Завершено',value:done.length,color:'var(--success)'},
        {label:'Всего',value:allTasks.length,color:'var(--accent)'},
      ].map(({label,value,color})=><div key={label} className="metric-card" style={{'--c':color}}>
        <div className="metric-label">{label}</div>
        <div className="metric-value">{value}</div>
      </div>)}
    </div>
    {open.length===0&&<div style={{textAlign:'center',color:'var(--muted)',padding:60,background:'var(--card)',borderRadius:12,border:'1px solid var(--border)'}}>
      <i className="ti ti-circle-check" style={{fontSize:40,color:'var(--success)',display:'block',marginBottom:12}}/>Все задачи выполнены!
    </div>}
    {open.length>0&&<div className="card" style={{overflow:'hidden',marginBottom:16}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:14}}>Открытые задачи ({open.length})</div>
      <table>
        <thead><tr>{['Задача','Клиент','Тип','Срок',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>
          {open.map(t=><tr key={t.id} onClick={()=>onOpen(t.client)}>
            <td style={{fontWeight:600}}>{t.text||t.type}</td>
            <td>{t.clientName}</td>
            <td><span className="badge" style={{background:'var(--accent-bg)',color:'var(--accent)'}}>{t.type}</span></td>
            <td style={{color:t.due&&t.due<today()?'var(--danger)':'var(--muted)',fontWeight:t.due&&t.due<today()?700:400}}>{t.due||'—'}</td>
            <td><button className="btn btn-sm btn-ghost"><i className="ti ti-arrow-right"/></button></td>
          </tr>)}
        </tbody>
      </table>
    </div>}
    {done.length>0&&<div className="card" style={{overflow:'hidden'}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:14,color:'var(--muted)'}}>Завершённые задачи ({done.length})</div>
      <table>
        <thead><tr>{['Задача','Клиент','Тип',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>
          {done.map(t=><tr key={t.id} onClick={()=>onOpen(t.client)}>
            <td style={{textDecoration:'line-through',color:'var(--muted)'}}>{t.text||t.type}</td>
            <td>{t.clientName}</td>
            <td><span className="badge" style={{background:'#f0fdf4',color:'var(--success)'}}>{t.type}</span></td>
            <td><i className="ti ti-circle-check" style={{color:'var(--success)'}}/></td>
          </tr>)}
        </tbody>
      </table>
    </div>}
  </div>;
}

// ═══════════════════════════ KPI PAGE ════════════════════════════
function KPIPage({clients}){
  const stats=MANAGERS.map(m=>{
    const mc=clients.filter(c=>c.manager===m);
    const contracts=mc.filter(c=>c.contractType);
    const revenue=contracts.reduce((s,c)=>s+c.contractAmount,0);
    const inWork=mc.filter(c=>c.stage!=='new_lead'&&c.stage!=='closed');
    const approved=mc.filter(c=>['approval','deal','issuance','closed'].includes(c.stage));
    const closed=mc.filter(c=>c.stage==='closed');
    const convLD=mc.length?Math.round(contracts.length/mc.length*100):0;
    const convCA=contracts.length?Math.round(approved.length/contracts.length*100):0;
    const tasks=mc.flatMap(c=>c.tasks);
    return {name:m,leads:mc.length,inWork:inWork.length,contracts:contracts.length,revenue,approved:approved.length,closed:closed.length,convLD,convCA,tasks:tasks.length,tasksDone:tasks.filter(t=>t.done).length};
  }).sort((a,b)=>b.revenue-a.revenue);
  const maxRev=Math.max(...stats.map(s=>s.revenue),1);

  return <div>
    <div className="metric-grid" style={{marginBottom:20}}>
      {[
        {label:'Всего клиентов',value:clients.length,color:'#6366f1'},
        {label:'Договоров подписано',value:clients.filter(c=>c.contractType).length,color:'#ec4899'},
        {label:'Общая выручка',value:fmt(clients.reduce((s,c)=>s+c.contractAmount,0))+' ₸',color:'#10b981'},
        {label:'Успешно закрыто',value:clients.filter(c=>c.stage==='closed').length,color:'#22c55e'},
      ].map(({label,value,color})=><div key={label} className="metric-card" style={{'--c':color}}>
        <div className="metric-label">{label}</div>
        <div className="metric-value">{value}</div>
      </div>)}
    </div>
    {stats.map((s,i)=>{
      const colors=['#6366f1','#10b981','#f59e0b','#ec4899'];
      const col=colors[i%4];
      return <div key={s.name} className="card card-p" style={{marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div className="avatar" style={{background:col+'22',color:col,width:40,height:40,fontSize:15}}>{s.name[0]}</div>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>{s.name}</div>
              <div style={{fontSize:12,color:'var(--muted)'}}>{s.leads} лидов · {s.contracts} договоров</div>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontWeight:800,fontSize:22,color:col,letterSpacing:'-1px'}}>{fmt(s.revenue)} ₸</div>
            <div style={{fontSize:12,color:'var(--muted)'}}>выручка</div>
          </div>
        </div>
        <div className="kpi-bar" style={{marginBottom:16}}><div className="kpi-fill" style={{width:`${Math.round(s.revenue/maxRev*100)}%`,background:col}}/></div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8}}>
          {[
            {label:'В работе',value:s.inWork,color:'#0ea5e9'},
            {label:'Договоры',value:s.contracts,color:'#ec4899'},
            {label:'Одобрений',value:s.approved,color:'#10b981'},
            {label:'Закрыто',value:s.closed,color:'#22c55e'},
            {label:'Лид→Дог',value:s.convLD+'%',color:s.convLD>=50?'#10b981':s.convLD>=25?'#f59e0b':'#ef4444'},
            {label:'Дог→Одоб',value:s.convCA+'%',color:s.convCA>=50?'#10b981':s.convCA>=25?'#f59e0b':'#ef4444'},
          ].map(({label,value,color})=><div key={label} style={{background:'#f8fafc',borderRadius:8,padding:'10px',border:'1px solid var(--border)',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color}}>{value}</div>
            <div style={{fontSize:10,color:'var(--muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em',marginTop:2}}>{label}</div>
          </div>)}
        </div>
      </div>;
    })}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
