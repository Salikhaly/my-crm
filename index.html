<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ипотека CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --A:#3b82f6;--A2:#2563eb;--Ab:#eff6ff;
  --G:#10b981;--Gb:#f0fdf4;
  --W:#f59e0b;--Wb:#fffbeb;
  --R:#ef4444;--Rb:#fef2f2;
  --P:#8b5cf6;--T:#14b8a6;--O:#f97316;--K:#ec4899;
  --N:#0f172a;--N2:#1e293b;
  --bg:#f1f5f9;--card:#fff;
  --br:#e2e8f0;--br2:#cbd5e1;
  --tx:#0f172a;--mu:#64748b;--lt:#94a3b8;
  --r:12px;--sh:0 1px 4px rgba(0,0,0,.07);--sh2:0 8px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;outline:none}
a{text-decoration:none}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;transition:all .15s;white-space:nowrap;line-height:1;border:2px solid transparent}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--A);color:#fff}.btn-p:hover{background:var(--A2)}
.btn-g{background:var(--G);color:#fff}.btn-g:hover{background:#059669}
.btn-r{background:var(--Rb);color:var(--R);border-color:#fecaca}.btn-r:hover{background:#fee2e2}
.btn-w{background:var(--Wb);color:var(--W);border-color:#fde68a}
.btn-o{background:var(--bg);color:var(--mu);border-color:var(--br2)}.btn-o:hover{background:var(--bg)}
.btn-gh{background:transparent;color:var(--mu)}.btn-gh:hover{background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:15px;border-radius:14px}
.btn-bl{width:100%}
.btn-ico{width:34px;height:34px;padding:0;border-radius:8px}

/* INPUTS */
.inp{background:#f8fafc;border:2px solid var(--br2);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:14px;width:100%;transition:all .15s}
.inp:focus{border-color:var(--A);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
select.inp{cursor:pointer;-webkit-appearance:none}
textarea.inp{resize:none;min-height:72px}
.inp-lg{font-size:16px;padding:12px 14px;border-radius:12px}
.fi{margin-bottom:13px}
.fl{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* LAYOUT */
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sb{width:220px;background:var(--N);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.sb-logo{padding:16px 15px 13px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-em{font-size:20px;margin-bottom:4px}
.sb-t{font-size:14px;font-weight:800;color:#fff}
.sb-s{font-size:10px;color:#475569;margin-top:1px}
.sb-nav{padding:9px 8px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-sec{padding:8px 10px 3px;font-size:9px;font-weight:700;letter-spacing:.09em;color:#374151;text-transform:uppercase;margin-top:5px}
.sb-b{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;color:#64748b;font-size:12.5px;font-weight:500;transition:all .14s;width:100%;text-align:left}
.sb-b:hover{background:rgba(255,255,255,.07);color:#94a3b8}
.sb-b.act{background:var(--A);color:#fff;font-weight:700}
.sb-b i{font-size:16px;width:17px;flex-shrink:0}
.sb-cnt{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:rgba(255,255,255,.12)}
.sb-b.act .sb-cnt{background:rgba(255,255,255,.25)}
.sb-foot{padding:11px;border-top:1px solid rgba(255,255,255,.07)}
.u-pill{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(255,255,255,.06);border-radius:10px;cursor:pointer;width:100%;transition:background .14s}
.u-pill:hover{background:rgba(255,255,255,.1)}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.u-nm{font-size:11px;font-weight:600;color:#94a3b8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-rl{font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;display:inline-block;margin-top:2px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto}
.topbar{background:var(--card);border-bottom:1px solid var(--br);padding:11px 20px;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.tb-title{font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1}
.page{padding:18px 20px;flex:1}

/* BOTTOM NAV (mobile) */
.bot-nav{display:none;background:var(--card);border-top:1px solid var(--br);position:fixed;bottom:0;left:0;right:0;z-index:200;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bot-items{display:flex}
.bot-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer;border:none;background:transparent;color:var(--lt);transition:color .14s;font-family:inherit;position:relative}
.bot-item.act{color:var(--A)}
.bot-item i{font-size:21px}
.bot-item span{font-size:9px;font-weight:700;letter-spacing:.02em}
.bot-badge{position:absolute;top:3px;right:calc(50% - 16px);background:var(--R);color:#fff;border-radius:20px;font-size:9px;font-weight:800;padding:1px 5px;min-width:15px;text-align:center}

/* CARDS */
.card{background:var(--card);border:1.5px solid var(--br);border-radius:14px;box-shadow:var(--sh)}
.cp{padding:15px}
.chd{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1.5px solid var(--br);background:#f8fafc;border-radius:14px 14px 0 0;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}

/* METRICS */
.mg{display:grid;gap:9px;margin-bottom:16px}
.mg4{grid-template-columns:repeat(4,1fr)}
.mg3{grid-template-columns:repeat(3,1fr)}
.mg2{grid-template-columns:repeat(2,1fr)}
.mc{background:var(--card);border:1.5px solid var(--br);border-radius:14px;padding:14px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--A))}
.mc-l{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.mc-v{font-size:24px;font-weight:800;letter-spacing:-1px;color:var(--c,var(--tx));line-height:1}
.mc-s{font-size:11px;color:var(--lt);margin-top:3px}
.mc-i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.07}

/* TABLE */
.tw{border:1.5px solid var(--br);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--br);background:#f8fafc}
td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--br);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:#f8fafc}

/* BADGE */
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.dot{border-radius:50%;display:inline-block;flex-shrink:0}

/* PROGRESS */
.prog{background:var(--br);border-radius:20px;overflow:hidden}
.pb{border-radius:20px;transition:width .4s}
.prog-h{height:7px}.prog-sm{height:5px}.prog-xs{height:4px}

/* TOGGLE */
.tgl{width:40px;height:22px;background:var(--br2);border-radius:20px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;display:inline-block}
.tgl.on{background:var(--A)}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on::after{left:21px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.22);max-width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.xl{width:980px}.lg{width:660px}.md{width:500px}.sm{width:400px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:15px 19px;border-bottom:1.5px solid var(--br);flex-shrink:0}
.mt{font-size:16px;font-weight:800;letter-spacing:-.3px}
.mb{flex:1;overflow-y:auto}
.mft{padding:12px 19px;border-top:1.5px solid var(--br);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#f8fafc}

/* TABS (inside modal) */
.tabs{display:flex;gap:2px;padding:0 19px;border-bottom:1.5px solid var(--br);background:#f8fafc;overflow-x:auto;flex-shrink:0}
.tabs::-webkit-scrollbar{height:3px}
.tab{padding:11px 13px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .14s;margin-bottom:-1.5px}
.tab.act{color:var(--A);border-bottom-color:var(--A)}
.tb{padding:18px 19px}

/* KANBAN */
.kb{display:flex;gap:9px;overflow-x:auto;padding-bottom:9px}
.kb::-webkit-scrollbar{height:6px}
.kb::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.kc{background:#f1f5f9;border:1.5px solid var(--br);border-radius:14px;min-width:185px;flex:0 0 185px;display:flex;flex-direction:column;transition:all .14s}
.kc.dov{border-color:var(--A);background:var(--Ab)}
.kh{padding:11px 11px 9px;border-bottom:1.5px solid var(--br)}
.ks{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.kn{margin-left:auto;font-size:10px;font-weight:700;background:#fff;border:1px solid var(--br);border-radius:20px;padding:1px 6px;color:var(--mu)}
.kbody{padding:7px;flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:62vh}
.kcard{background:var(--card);border:1.5px solid var(--br);border-radius:11px;padding:11px;cursor:pointer;transition:all .14s;box-shadow:var(--sh)}
.kcard:hover{border-color:var(--A);box-shadow:0 0 0 3px rgba(59,130,246,.1);transform:translateY(-1px)}

/* CLIENT HERO */
.chero{border-radius:14px;padding:18px;margin-bottom:13px;color:#fff;background:linear-gradient(135deg,var(--N),var(--N2))}
.chero-nm{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:5px}
.chero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.htag{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.hgi{background:rgba(255,255,255,.1);border-radius:9px;padding:9px}
.hgl{font-size:9px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.hgv{font-size:12px;font-weight:700}

/* ACCOMP STAGES */
.sdots{display:flex;overflow-x:auto;padding:3px 0;gap:0}
.sdots::-webkit-scrollbar{height:4px}
.ss{flex:1;min-width:62px;text-align:center;position:relative;cursor:pointer}
.ss::before{content:'';position:absolute;top:11px;left:0;right:0;height:2px;background:var(--br);z-index:0}
.ss:first-child::before{left:50%}
.ss:last-child::before{right:50%}
.sd{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--br2);background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:9.5px;font-weight:700;color:var(--mu);position:relative;z-index:1;transition:all .2s;cursor:pointer}
.sd.dn{background:var(--G);border-color:var(--G);color:#fff}
.sd.ac{background:var(--A);border-color:var(--A);color:#fff;box-shadow:0 0 0 5px rgba(59,130,246,.18)}
.sl{font-size:8.5px;color:var(--mu);line-height:1.2;font-weight:500;padding:0 1px}
.sl.ac{color:var(--A);font-weight:700}
.sl.dn{color:var(--G)}

/* CHECKLIST */
.cli{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--br);cursor:pointer;transition:background .1s}
.cli:last-child{border-bottom:none}
.cli:hover{background:#f8fafc}
.cli:active{background:#f0f4f8}
.clb{width:20px;height:20px;border-radius:6px;border:2.5px solid var(--br2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.clb.ck{background:var(--G);border-color:var(--G)}

/* PAYMENT */
.pay-card{border:1.5px solid var(--br);border-radius:12px;padding:13px;margin-bottom:9px;transition:all .14s}
.pay-card.paid{border-color:var(--G);background:var(--Gb)}
.pay-card.partial{border-color:var(--W);background:var(--Wb)}
.pay-card.pending{border-color:var(--br)}

/* DOCS */
.doc-drop{border:2.5px dashed var(--br2);border-radius:12px;padding:24px;text-align:center;transition:all .15s;cursor:pointer}
.doc-drop:hover,.doc-drop.hover{border-color:var(--A);background:var(--Ab)}
.doc-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--br)}
.doc-item:last-child{border-bottom:none}
.doc-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}

/* STATUS CHIPS */
.sc{padding:8px 13px;border-radius:20px;border:2px solid var(--br);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;transition:all .14s;color:var(--mu)}
.sc.act{border-color:var(--A);background:var(--Ab);color:var(--A)}

/* COMMENT */
.cmt{padding:11px 14px;border-bottom:1px solid var(--br)}
.cmt:last-child{border-bottom:none}
.cmeta{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--mu);margin-bottom:3px}

/* TASK */
.task-r{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--br);cursor:pointer}
.task-r:last-child{border-bottom:none}
.task-r:hover{background:#f8fafc}
.tchk{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--br2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;cursor:pointer}
.tchk.dn{background:var(--G);border-color:var(--G)}

/* AUTO BANNER */
.abanner{background:var(--Gb);border:2px solid #86efac;border-radius:14px;padding:14px;margin-bottom:13px;display:flex;align-items:center;gap:12px;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* WARN BOX */
.wbox{background:var(--Wb);border:1.5px solid #fde68a;border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
.wchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.wchip{background:#fff;border:1px solid #fde68a;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;color:#92400e;display:inline-flex;align-items:center;gap:3px}

/* ADMIN */
.adm-sec{background:var(--card);border:1.5px solid var(--br);border-radius:14px;overflow:hidden;margin-bottom:12px}
.adm-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1.5px solid var(--br);background:#f8fafc}
.adm-row{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--br);transition:background .1s}
.adm-row:last-child{border-bottom:none}
.adm-row:hover{background:#f8fafc}

/* COLORS */
.cr{display:flex;gap:7px;flex-wrap:wrap}
.crd{width:24px;height:24px;border-radius:7px;cursor:pointer;transition:all .14s;flex-shrink:0}
.crd.sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px #1a1a1a}

/* STAGE POPUP */
.spop{background:var(--card);border:1.5px solid var(--br);border-radius:14px;box-shadow:var(--sh2);min-width:280px;max-width:340px;overflow:hidden;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

/* EXIT DIALOG */
.exit-dlg{background:var(--card);border-radius:18px;padding:28px;width:340px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.22)}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--N);color:#fff;padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;z-index:9999;box-shadow:var(--sh2);display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;white-space:nowrap}
@keyframes toastIn{from{transform:translateX(-50%) translateY(8px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* MISC */
.src{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase}
.empty{text-align:center;padding:44px 20px;color:var(--mu)}
.empty i{font-size:40px;display:block;margin-bottom:10px;opacity:.2}
.sh{height:1px;background:var(--br);margin:14px 0}
.sec-hdr{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 9px;padding-bottom:7px;border-bottom:1.5px solid var(--br);display:flex;align-items:center;justify-content:space-between}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--br)}
.info-row:last-child{border-bottom:none}
.ir-l{font-size:12px;color:var(--mu);font-weight:500}
.ir-v{font-size:13px;font-weight:700}
.file-preview{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--br)}

/* MOBILE */
@media(max-width:768px){
  .sb{display:none}
  .bot-nav{display:block}
  .main{padding-bottom:60px}
  .mg4{grid-template-columns:repeat(2,1fr)}
  .mg3{grid-template-columns:repeat(2,1fr)}
  .r3{grid-template-columns:1fr 1fr}
  .hgrid{grid-template-columns:repeat(2,1fr)}
  .xl,.lg,.md{width:calc(100vw - 28px);max-width:none}
  .sm{width:calc(100vw - 28px)}
  .page{padding:13px}
  .topbar{padding:10px 13px}
  .kc{min-width:160px;flex:0 0 160px}
}
@media(max-width:480px){
  .mg4,.mg3{grid-template-columns:1fr 1fr}
  .r2,.r3{grid-template-columns:1fr}
  .hgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const SK='crm_v5';

// ═══ DATA ═══
const PIPELINE=[
  {id:'new_lead',l:'Новый лид',c:'#6366f1'},
  {id:'in_work',l:'Взят в работу',c:'#0ea5e9'},
  {id:'analysis',l:'Анализ',c:'#f59e0b'},
  {id:'consultation',l:'Консультация',c:'#a855f7'},
  {id:'contract',l:'Договор',c:'#ec4899'},
  {id:'accompaniment',l:'Сопровождение',c:'#14b8a6'},
  {id:'approval',l:'Одобрение',c:'#10b981'},
  {id:'deal',l:'Сделка',c:'#f97316'},
  {id:'issuance',l:'Выдача ипотеки',c:'#22c55e'},
  {id:'closed',l:'Закрыто',c:'#64748b'},

    {id:'kpi',l:'KPI',i:'ti-chart-bar'},
  ];

  if(!user)return <Login users={store.users||DEF_USERS} onLogin={u=>{setUser(u);setPage('dashboard');}}/>;

  const role=ROLE[user.role];

  if(selClient){
    return <ClientDetail
      client={selClient} clients={store.clients} managers={mgrs} pipeline={pl}
      checklists={cls} user={user} allUsers={store.users||DEF_USERS}

      onBack={goBack} toast$={toast$} setHasChanges={setHasChanges}
    />;
  }

  return <div className="app">
    {/* SIDEBAR */}
    <div className="sb">
      <div className="sb-logo"><div className="sb-em">🏠</div><div className="sb-t">Ипотека CRM</div><div className="sb-s">Система управления клиентами</div></div>
      <div className="sb-nav">
        {NAV.map(n=><button key={n.id} className={`sb-b${page===n.id?' act':''}`} onClick={()=>navTo(n.id)}>
          <i className={`ti ${n.i}`}/>{n.l}
          {n.cnt>0&&<span className="sb-cnt" style={n.warn?{background:'#ef4444'}:{}}>{n.cnt}</span>}
        </button>)}
        <div className="sb-sec">Воронка</div>
        {pl.map(p=>{const cnt=myCl.filter(c=>c.stage===p.id).length;return <button key={p.id} className="sb-b" style={{justifyContent:'space-between'}} onClick={()=>{setPage('clients');setFStage(p.id);}}>
          <span style={{display:'flex',alignItems:'center',gap:7}}><span className="dot" style={{background:p.c,width:7,height:7}}/>{p.l}</span>
          {cnt>0&&<span style={{background:p.c+'33',color:p.c,borderRadius:20,padding:'1px 6px',fontSize:10,fontWeight:700}}>{cnt}</span>}
        </button>;})}
      </div>
      <div className="sb-foot">
        <button className="u-pill" onClick={()=>{if(hasChanges){setExitDlg({onConfirm:()=>{setHasChanges(false);setUser(null);setExitDlg(null);}});}else setUser(null);}}>
          <div className="u-av" style={{background:role?.c||'#3b82f6'}}>{user.name[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="u-nm">{user.name}</div>
            <span className="u-rl" style={{background:role?.c+'22',color:role?.c}}>{role?.l}</span>
          </div>
          <i className="ti ti-logout" style={{fontSize:13,color:'#475569'}}/>
        </button>
      </div>
    </div>

    {/* MAIN */}
    <div className="main">
      <div className="topbar">
        <div className="tb-title">{NAV.find(n=>n.id===page)?.l||'CRM'}</div>
        {page==='clients'&&<>
          <div style={{display:'flex',alignItems:'center',gap:8,background:'#f1f5f9',borderRadius:10,padding:'8px 11px',flex:'1',maxWidth:230}}>
            <i className="ti ti-search" style={{color:'var(--mu)',fontSize:15,flexShrink:0}}/>
            <input style={{border:'none',background:'transparent',fontSize:13,color:'var(--tx)',width:'100%',outline:'none'}} placeholder="Имя, телефон, ИИН..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          {!isMgr&&<select className="inp" style={{width:145}} value={fMgr} onChange={e=>setFMgr(e.target.value)}><option value="">Все менеджеры</option>{mgrs.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>}
          <select className="inp" style={{width:155}} value={fStage} onChange={e=>setFStage(e.target.value)}><option value="">Все этапы</option>{pl.map(p=><option key={p.id} value={p.id}>{p.l}</option>)}</select>
        </>}
        <button className="btn btn-p" onClick={()=>{const c=emptyClient(user.mid||'');setModal({type:'new_client',c});}}>
          <i className="ti ti-plus"/>Новый клиент
        </button>
      </div>

      <div className="page">
        {page==='dashboard'&&<Dashboard clients={myCl} managers={mgrs} pipeline={pl} user={user} onOpen={c=>setSelClient(c)} onNew={()=>{const c=emptyClient(user.mid||'');setModal({type:'new_client',c});}} onStageClick={(sid,e)=>setStagePopup(stagePopup?.id===sid?null:{id:sid,clients:myCl.filter(c=>c.stage===sid)})}/>}
        {page==='clients'&&<Clients clients={filtered} managers={mgrs} pipeline={pl} onOpen={c=>setSelClient(c)} drag={drag} setDrag={setDrag} dragOv={dragOv} setDragOv={setDragOv} onMove={moveClient}/>}
        {page==='search'&&<IINSearch clients={myCl} managers={mgrs} pipeline={pl} checklists={cls} onOpen={c=>setSelClient(c)}/>}
        {page==='tasks'&&<Tasks clients={myCl} managers={mgrs} onOpen={c=>setSelClient(c)}/>}
        {page==='wa'&&<WALeadsPage clients={myCl} managers={mgrs} pipeline={pl} checklists={cls} onOpen={c=>setSelClient(c)} onImport={c=>{upd(s=>s.clients.push(c));toast$('✅ WhatsApp лид добавлен!');}} onSave={saveClient}/>}
        {page==='kpi'&&<KPI clients={myCl} managers={mgrs} user={user}/>}
        {page==='admin'&&isAdmin&&<AdminPanel store={store} managers={mgrs} pipeline={pl} checklists={cls} onSaveMgr={saveMgr} onDelMgr={delMgr} onSaveUser={saveUser} onSaveCL={saveCL} onSavePL={savePL} onModal={setModal} toast$={toast$} upd={upd}/>}
      </div>
    </div>

    {/* BOTTOM NAV */}
    <nav className="bot-nav">
      <div className="bot-items">
        {BOT_NAV.map(n=><button key={n.id} className={`bot-item${page===n.id?' act':''}`} onClick={()=>navTo(n.id)} style={n.wa&&page===n.id?{color:'#25d366'}:n.wa?{color:'#25d366',opacity:.7}:{}}>
          <div className="nav-icon-wrap" style={{position:'relative'}}>
            <i className={`ti ${n.i}`}/>
            {n.cnt>0&&<span className="bot-badge" style={n.warn?{background:'#ef4444'}:n.wa?{background:'#25d366'}:{}}>{n.cnt}</span>}
          </div>
          <span>{n.l}</span>
        </button>)}
      </div>
    </nav>

    {/* STAGE POPUP */}
    {stagePopup&&<div style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:300}} onClick={()=>setStagePopup(null)}>
      <div className="spop" style={{position:'absolute',top:'70px',left:'50%',transform:'translateX(-50%)',zIndex:301}} onClick={e=>e.stopPropagation()}>
        <div className="chd" style={{borderRadius:'14px 14px 0 0'}}>
          {(store.pipeline||PIPELINE).find(p=>p.id===stagePopup.id)?.l} ({stagePopup.clients.length} клиентов)
          <button className="btn btn-gh btn-sm btn-ico" onClick={()=>setStagePopup(null)}><i className="ti ti-x"/></button>
        </div>
        <div style={{maxHeight:320,overflowY:'auto'}}>
          {stagePopup.clients.length===0&&<div className="empty" style={{padding:'24px'}}><p>Нет клиентов</p></div>}
          {stagePopup.clients.map(c=>{
            const m=mgrs.find(x=>x.id===c.manager);
            const p=(store.pipeline||PIPELINE).find(x=>x.id===c.stage);
            const totalItems=ACCOMP.reduce((s,st)=>s+(cls[st]||[]).length,0);
            const totalDone=ACCOMP.reduce((s,st,i)=>s+((c.accompStages||{})[i]?.done||[]).length,0);
            const pct=totalItems>0?Math.round(totalDone/totalItems*100):0;
            return <div key={c.id} style={{display:'flex',gap:10,padding:'11px 14px',borderBottom:'1px solid var(--br)',cursor:'pointer',transition:'background .1s'}} onClick={()=>{setStagePopup(null);setSelClient(c);}} onMouseEnter={e=>e.currentTarget.style.background='#f8fafc'} onMouseLeave={e=>e.currentTarget.style.background=''}>
              <div style={{width:34,height:34,borderRadius:10,background:(p?.c||'#3b82f6')+'22',color:p?.c||'#3b82f6',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14,flexShrink:0}}>{c.fio?c.fio[0]:'?'}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.fio||'—'}</div>
                <div style={{fontSize:11,color:'var(--mu)'}}>{c.phone} · {m?.name||'—'}</div>
                {c.stage==='accompaniment'&&<div style={{marginTop:4}}>
                  <Prog pct={pct} c={pct===100?'#10b981':'#3b82f6'} sz='xs'/>
                  <div style={{fontSize:10,color:'var(--mu)',marginTop:2}}>Прогресс: {pct}% · {ACCOMP[c.accompStageIndex]}</div>
                </div>}
              </div>
              {c.contractAmount>0&&<div style={{fontSize:12,fontWeight:800,color:'#10b981',flexShrink:0}}>{fmt(c.contractAmount)} ₸</div>}
            </div>;
          })}
        </div>
      </div>
    </div>}

    {/* MODALS */}
    {modal?.type==='new_client'&&<NewClientModal client={modal.c} managers={mgrs} pipeline={pl} onSave={saveClient} onClose={()=>setModal(null)}/>}
    {modal?.type==='mgr_edit'&&<MgrModal item={modal.item} onSave={saveMgr} onClose={()=>setModal(null)}/>}
    {modal?.type==='user_edit'&&<UserModal item={modal.item} managers={mgrs} onSave={saveUser} onClose={()=>setModal(null)}/>}
    {modal?.type==='cl_edit'&&<CLModal stage={modal.stage} items={modal.items} onSave={saveCL} onClose={()=>setModal(null)}/>}
    {modal?.type==='pl_edit'&&<PLModal pipeline={pl} onSave={savePL} onClose={()=>setModal(null)}/>}

    {/* EXIT DIALOG */}
    {exitDlg&&<div className="ov"><div className="exit-dlg">
      <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
      <div style={{fontWeight:800,fontSize:18,marginBottom:8}}>Несохранённые изменения</div>
      <div style={{fontSize:14,color:'var(--mu)',marginBottom:22}}>Вы уверены, что хотите выйти? Все несохранённые изменения будут потеряны.</div>
      <div style={{display:'flex',gap:9,justifyContent:'center'}}>
        <button className="btn btn-o" onClick={()=>setExitDlg(null)}>Остаться</button>
        <button className="btn btn-r" onClick={()=>{exitDlg.onConfirm();}}><i className="ti ti-arrow-left"/>Выйти без сохранения</button>
      </div>
    </div></div>}

    {toast&&<div className="toast" style={{background:toast.type==='err'?'#dc2626':'var(--N)'}}>{toast.msg}</div>}
  </div>;
}

// ═══ LOGIN ═══
function Login({users,onLogin}){
  const [lg,setLg]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');
  function go(){const u=users.find(x=>x.login===lg&&x.pwd===pw);u?onLogin(u):setErr('Неверный логин или пароль');}
  const hints=[{l:'admin',p:'admin123',r:'Техник'},{l:'head',p:'head123',r:'Руководитель'},{l:'aigerim',p:'a123',r:'Менеджер'},{l:'daniyar',p:'d123',r:'Менеджер'}];
  return <div style={{minHeight:'100vh',background:'linear-gradient(160deg,#0f172a,#1e3a5f)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style={{background:'var(--card)',borderRadius:22,padding:'34px 30px',width:'100%',maxWidth:380,boxShadow:'0 24px 80px rgba(0,0,0,.3)'}}>
      <div style={{textAlign:'center',marginBottom:26}}>
        <div style={{fontSize:42,marginBottom:8}}>🏠</div>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:'-.5px'}}>Ипотека CRM</div>
        <div style={{fontSize:13,color:'var(--mu)',marginTop:4}}>Войдите в систему</div>
      </div>
      <Fl l="Логин" ch={<input className="inp inp-lg" value={lg} onChange={e=>{setLg(e.target.value);setErr('')}} placeholder="Ваш логин" onKeyDown={e=>e.key==='Enter'&&go()}/>}/>
      <Fl l="Пароль" ch={<input className="inp inp-lg" type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr('')}} placeholder="Ваш пароль" onKeyDown={e=>e.key==='Enter'&&go()}/>}/>
      {err&&<div style={{background:'var(--Rb)',color:'var(--R)',border:'1.5px solid #fecaca',borderRadius:10,padding:'10px 13px',fontSize:13,fontWeight:600,marginBottom:12,textAlign:'center'}}>{err}</div>}
      <button className="btn btn-p btn-lg btn-bl" onClick={go} style={{justifyContent:'center',marginBottom:18}}><i className="ti ti-login"/>Войти</button>
      <div style={{background:'#f8fafc',borderRadius:12,border:'1px solid var(--br)',overflow:'hidden'}}>
        <div style={{padding:'9px 13px',fontSize:10,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.06em',borderBottom:'1px solid var(--br)'}}>Нажмите для входа:</div>
        {hints.map(h=><div key={h.l} onClick={()=>{setLg(h.l);setPw(h.p);setErr('')}} style={{display:'flex',justifyContent:'space-between',padding:'10px 13px',borderBottom:'1px solid var(--br)',cursor:'pointer',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background='#e2e8f0'} onMouseLeave={e=>e.currentTarget.style.background=''}>
          <span style={{fontWeight:700,fontSize:13}}>{h.l} / {h.p}</span><span style={{color:'var(--mu)',fontSize:12}}>{h.r}</span>
        </div>)}
      </div>
    </div>
  </div>;
}

// ═══ DASHBOARD ═══
function Dashboard({clients,managers,pipeline,user,onOpen,onNew,onStageClick}){
  const withCt=clients.filter(c=>c.contractType);
  const rev=withCt.reduce((s,c)=>s+c.contractAmount,0);
  const paidRev=clients.flatMap(c=>c.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0);
  const pendingRev=clients.flatMap(c=>c.payments||[]).filter(p=>p.status!=='paid').reduce((s,p)=>s+(p.amount-p.paidAmount),0);
  const waNew=clients.filter(c=>c.isWhatsApp&&c.stage==='new_lead');
  const overdue=clients.flatMap(c=>c.tasks).filter(t=>!t.done&&t.due&&t.due<today());
  const topMgrs=managers.map(m=>{const mc=clients.filter(c=>c.manager===m.id);const ct=mc.filter(c=>c.contractType);const r=ct.reduce((s,c)=>s+c.contractAmount,0);return {...m,l:mc.length,ct:ct.length,rev:r,conv:mc.length?Math.round(ct.length/mc.length*100):0};}).sort((a,b)=>b.rev-a.rev);
  const maxRev=Math.max(...topMgrs.map(m=>m.rev),1);

  return <div>
    <div className="mg mg4">
      {[{l:'Всего клиентов',v:clients.length,s:`${clients.filter(c=>c.createdAt>=moS()).length} за месяц`,c:'#6366f1',i:'ti-users'},{l:'Договоров',v:withCt.length,s:`${Math.round(withCt.length/Math.max(clients.length,1)*100)}% конверсия`,c:'#ec4899',i:'ti-file-certificate'},{l:'Получено денег',v:fmt(paidRev)+' ₸',s:`Ожидается: ${fmt(pendingRev)} ₸`,c:'#10b981',i:'ti-cash'},{l:'Просроченных задач',v:overdue.length,s:`${waNew.length} WA лидов`,c:overdue.length>0?'#ef4444':'#10b981',i:'ti-checkbox'}]
        .map(({l,v,s,c,i})=><div key={l} className="mc" style={{'--c':c}}><div className="mc-l">{l}</div><div className="mc-v">{v}</div><div className="mc-s">{s}</div><i className={`ti ${i} mc-i`}/></div>)}
    </div>

    {/* Payment summary */}
    <div className="card cp" style={{marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>💰 Финансовый обзор</div>
      <div className="mg mg3">
        {[{l:'Выручка договоров',v:fmt(rev)+' ₸',c:'#6366f1'},{l:'Получено',v:fmt(paidRev)+' ₸',c:'#10b981'},{l:'Ожидается',v:fmt(pendingRev)+' ₸',c:'#f59e0b'}]
          .map(({l,v,c})=><div key={l} style={{background:'#f8fafc',borderRadius:10,padding:'12px',border:'1.5px solid var(--br)'}}>
            <div style={{fontSize:10,fontWeight:700,color:'var(--mu)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>{l}</div>
            <div style={{fontSize:20,fontWeight:800,color:c,letterSpacing:'-1px'}}>{v}</div>
          </div>)}
      </div>
    </div>

    {overdue.length>0&&<div style={{background:'var(--Rb)',border:'2px solid #fecaca',borderRadius:13,padding:'13px',marginBottom:13,display:'flex',gap:11,alignItems:'center'}}>
      <div style={{width:38,height:38,borderRadius:11,background:'var(--R)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-alert-triangle" style={{color:'#fff',fontSize:19}}/></div>
      <div style={{flex:1}}><div style={{fontWeight:800,fontSize:14,color:'var(--R)'}}>⚠️ {overdue.length} просроченных задач!</div><div style={{fontSize:12,color:'var(--mu)',marginTop:2}}>Требуют немедленного внимания</div></div>
    </div>}

    {waNew.length>0&&<div style={{background:'var(--Gb)',border:'2px solid #86efac',borderRadius:13,padding:'13px',marginBottom:13,display:'flex',gap:11,alignItems:'center',cursor:'pointer'}}>
      <div style={{width:38,height:38,borderRadius:11,background:'#25d366',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-brand-whatsapp" style={{color:'#fff',fontSize:19}}/></div>
      <div style={{flex:1}}><div style={{fontWeight:800,fontSize:14,color:'#065f46'}}>🔔 {waNew.length} WhatsApp лидов ждут</div></div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>{waNew.slice(0,3).map(c=><div key={c.id} onClick={()=>onOpen(c)} style={{background:'#fff',border:'1px solid #bbf7d0',borderRadius:8,padding:'5px 9px',fontSize:12,fontWeight:700,cursor:'pointer'}}>{c.fio||c.phone}</div>)}</div>
    </div>}

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:13,marginBottom:13}}>
      <div className="card cp">
        <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>Воронка <span style={{fontSize:11,color:'var(--mu)',fontWeight:400}}>(нажмите на этап)</span></div>
        {pipeline.map(p=>{const cnt=clients.filter(c=>c.stage===p.id).length;const pct=Math.round(cnt/Math.max(clients.length,1)*100);
          return <div key={p.id} style={{marginBottom:9,cursor:'pointer'}} onClick={()=>onStageClick(p.id)} onMouseEnter={e=>e.currentTarget.style.opacity='.8'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}>
              <span style={{display:'flex',alignItems:'center',gap:6,fontWeight:500}}><span className="dot" style={{background:p.c,width:7,height:7}}/>{p.l}</span>
              <span style={{fontWeight:700,color:'var(--mu)'}}>{cnt}</span>
            </div><Prog pct={pct} c={p.c} sz='xs'/>
          </div>;})}
      </div>
      <div className="card cp">
        <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>Рейтинг менеджеров</div>
        {topMgrs.map(m=><div key={m.id} style={{display:'flex',alignItems:'center',gap:9,marginBottom:11}}>
          <div style={{width:24,height:24,borderRadius:'50%',background:m.color+'22',color:m.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:11,flexShrink:0}}>{m.name[0]}</div>
          <div style={{flex:1}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span style={{fontWeight:700,fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:100}}>{m.name}</span><span style={{fontWeight:800,color:'var(--G)',fontSize:12,flexShrink:0}}>{m.rev>0?fmt(m.rev)+' ₸':'—'}</span></div>
            <Prog pct={Math.round(m.rev/maxRev*100)} c={m.color} sz='xs'/>
          </div><span style={{fontSize:11,color:'var(--mu)',fontWeight:700,width:28,textAlign:'right',flexShrink:0}}>{m.conv}%</span>
        </div>)}
      </div>
    </div>

    <div style={{fontWeight:800,fontSize:14,marginBottom:11}}>Последние клиенты</div>
    <div className="tw">
      <table><thead><tr>{['Клиент','Менеджер','Этап','Договор','Оплата',''].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{[...clients].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,8).map(c=>{
        const m=managers.find(x=>x.id===c.manager);
        const paid=c.payments?.filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0)||0;
        const payPct=c.contractAmount>0?Math.round(paid/c.contractAmount*100):0;
        return <tr key={c.id} onClick={()=>onOpen(c)}>
          <td><div style={{fontWeight:700}}>{c.fio||'—'}</div><div style={{fontSize:11,color:'var(--mu)'}}>{c.phone}</div></td>
          <td>{m?<span style={{display:'flex',alignItems:'center',gap:5}}><span className="dot" style={{background:m.color,width:6,height:6}}/>{m.name}</span>:'—'}</td>
          <td><StTag id={c.stage} pl={pipeline}/></td>
          <td style={{fontWeight:700,color:'var(--G)'}}>{c.contractAmount>0?fmt(c.contractAmount)+' ₸':'—'}</td>
          <td>{c.contractAmount>0?<div style={{minWidth:80}}><div style={{fontSize:11,color:'var(--mu)',marginBottom:3}}>{payPct}% получено</div><Prog pct={payPct} c={payPct===100?'var(--G)':payPct>0?'var(--A)':'var(--br2)'} sz='xs'/></div>:'—'}</td>
          <td><i className="ti ti-arrow-right" style={{color:'var(--lt)'}}/></td>
        </tr>;})}
      </tbody></table>
    </div>
  </div>;
}

// ═══ CLIENTS KANBAN ═══
function Clients({clients,managers,pipeline,onOpen,drag,setDrag,dragOv,setDragOv,onMove}){
  return <div className="kb">
    {pipeline.map(p=>{
      const sc=clients.filter(c=>c.stage===p.id);
      const sv=sc.reduce((s,c)=>s+c.contractAmount,0);
      return <div key={p.id} className={`kc${dragOv===p.id?' dov':''}`} onDragOver={e=>{e.preventDefault();setDragOv(p.id)}} onDragLeave={()=>setDragOv(null)} onDrop={e=>{e.preventDefault();if(drag)onMove(drag,p.id);setDrag(null);setDragOv(null);}}>
        <div className="kh"><div className="ks"><span className="dot" style={{background:p.c,width:7,height:7}}/><span style={{color:p.c}}>{p.l}</span><span className="kn">{sc.length}</span></div>{sv>0&&<div style={{fontSize:10,color:'var(--mu)',marginTop:2,fontWeight:500}}>{fmt(sv)} ₸</div>}</div>
        <div className="kbody">
          {sc.map(c=>{
            const m=managers.find(x=>x.id===c.manager);const cr=CR[c.creditStatus];
            const paid=c.payments?.filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0)||0;
            const payPct=c.contractAmount>0?Math.round(paid/c.contractAmount*100):0;
            return <div key={c.id} className="kcard" draggable onDragStart={e=>{e.stopPropagation();setDrag(c.id)}} onDragEnd={()=>{setDrag(null);setDragOv(null)}} onClick={()=>onOpen(c)}>
              <div style={{display:'flex',gap:5,marginBottom:2,alignItems:'flex-start'}}>{c.isWhatsApp&&<i className="ti ti-brand-whatsapp" style={{fontSize:12,color:'#25d366',marginTop:2}}/>}<div style={{fontWeight:700,fontSize:12.5}}>{c.fio||'—'}</div></div>
              <div style={{fontSize:11,color:'var(--mu)',marginBottom:5}}>{c.phone}</div>
              <div style={{display:'flex',gap:3,flexWrap:'wrap',marginBottom:c.contractAmount?5:0}}><SrTag id={c.source}/>{cr&&<Tag c={cr.c} ch={cr.l}/>}</div>
              {c.contractAmount>0&&<><div style={{fontWeight:800,fontSize:12,color:p.c}}>{fmt(c.contractAmount)} ₸</div>
              {c.payments?.length>0&&<div style={{marginTop:3}}><Prog pct={payPct} c={payPct===100?'var(--G)':payPct>0?'var(--A)':'var(--br2)'} sz='xs'/><div style={{fontSize:9,color:'var(--mu)',marginTop:2}}>{fmt(paid)} ₸ получено</div></div>}</>}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:5}}>
                <span style={{fontSize:10,color:'var(--lt)'}}>{c.dateIn}</span>
                {m&&<span style={{fontSize:10,color:'var(--mu)',fontWeight:600,display:'flex',alignItems:'center',gap:3}}><span className="dot" style={{background:m.color,width:5,height:5}}/>{m.name.split(' ')[0]}</span>}
              </div>
            </div>;
          })}
          {sc.length===0&&<div style={{textAlign:'center',color:'var(--lt)',fontSize:11,padding:'16px 0',fontStyle:'italic'}}>Пусто</div>}
        </div>
      </div>;})}
  </div>;
}

// ═══ CLIENT DETAIL ═══
function ClientDetail({client,clients,managers,pipeline,checklists,user,allUsers,onSave,onDelete,onMove,onBack,toast$,setHasChanges}){
  const [c,setC]=useState(JSON.parse(JSON.stringify(client)));
  const [tab,setTab]=useState('profile');
  const [accIdx,setAccIdx]=useState(c.accompStageIndex||0);
  const [autoBanner,setAutoBanner]=useState(null);
  const [isDirty,setIsDirty]=useState(false);
  const isAdmin=user.role==='admin'||user.role==='head';
  const canEdit=user.role!=='qa';
  const pl=pipeline||PIPELINE;

  function set(k,v){setC(x=>({...x,[k]:v}));setIsDirty(true);setHasChanges(true);}
  function save(){onSave({...c});setIsDirty(false);}

  const mgr=managers.find(m=>m.id===c.manager);
  const stageObj=pl.find(p=>p.id===c.stage);
  const cr=CR[c.creditStatus];
  const ctObj=CT[c.contractType];

  // Payments
  const totalPaid=(c.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+p.paidAmount,0);
  const totalPartial=(c.payments||[]).filter(p=>p.status==='partial').reduce((s,p)=>s+p.paidAmount,0);
  const payPct=c.contractAmount>0?Math.round((totalPaid+totalPartial)/c.contractAmount*100):0;

  // Accomp
  const aStages=c.accompStages||{};
  function getSD(i){return aStages[i]||{done:[],comments:[],tasks:[],docs:[]};}
  function setSD(i,data){set('accompStages',{...aStages,[i]:data});}

  function toggleCheck(si,itemId){
    const sd=getSD(si);const done=sd.done||[];
    const newDone=done.includes(itemId)?done.filter(x=>x!==itemId):[...done,itemId];
    const newSd={...sd,done:newDone};
    const items=checklists[ACCOMP[si]]||[];
    if(newDone.length===items.length&&items.length>0&&si<ACCOMP.length-1)setAutoBanner({fromIdx:si,toIdx:si+1,fromName:ACCOMP[si],toName:ACCOMP[si+1]});
    else setAutoBanner(null);
    setSD(si,newSd);
  }

  const totalItems=ACCOMP.reduce((s,st)=>s+(checklists[st]||[]).length,0);
  const totalDone=ACCOMP.reduce((s,st,i)=>s+((aStages[i]?.done)||[]).length,0);
  const overallPct=totalItems>0?Math.round(totalDone/totalItems*100):0;

  // Drive folder name
  const driveName=c.driveFolderName||(c.fio&&c.iin?`${c.fio}_${c.iin}`:'');

  const ALL_TABS=[
    {id:'profile',l:'👤 Профиль'},{id:'analysis',l:'📊 Анализ'},
    {id:'credit',l:'💳 КИ'},{id:'otbasy',l:'🏦 Отбасы'},
    {id:'contract',l:'📄 Договор'},{id:'payments',l:`💰 Оплата (${(c.payments||[]).length})`},
    {id:'reassignment',l:'🔄 Переуступка'},{id:'accomp',l:'🗺 Сопровождение'},
    {id:'tasks',l:`✅ Задачи (${c.tasks.filter(t=>!t.done).length})`},
    {id:'history',l:`💬 История (${c.comments.length})`},
  ];

  return <div className="app">
    <div className="sb">
      <div className="sb-logo"><div className="sb-em">🏠</div><div className="sb-t">Ипотека CRM</div><div className="sb-s">Карточка клиента</div></div>
      <div className="sb-nav" style={{paddingTop:8}}>
        <button className="sb-b" onClick={onBack}><i className="ti ti-arrow-left"/>Назад к списку</button>
        <div className="sb-sec">Этап воронки</div>
        {pl.map(p=><button key={p.id} className={`sb-b${c.stage===p.id?' act':''}`} onClick={()=>canEdit&&set('stage',p.id)} style={{justifyContent:'space-between'}}>
          <span style={{display:'flex',alignItems:'center',gap:7}}><span className="dot" style={{background:p.c,width:7,height:7}}/>{p.l}</span>
          {c.stage===p.id&&<i className="ti ti-check" style={{fontSize:12}}/>}
        </button>)}
        {(c.miroLink||c.driveLink||c.roadmapLink)&&<>
          <div className="sb-sec">Быстрые ссылки</div>
          {c.miroLink&&<a href={c.miroLink} target="_blank" className="sb-b"><i className="ti ti-brand-miro" style={{color:'#f5c842'}}/>Miro</a>}
          {c.driveLink&&<a href={c.driveLink} target="_blank" className="sb-b"><i className="ti ti-brand-google-drive" style={{color:'#0ea5e9'}}/>Google Drive</a>}
          {c.roadmapLink&&<a href={c.roadmapLink} target="_blank" className="sb-b"><i className="ti ti-map"/>Roadmap</a>}
        </>}
      </div>
      <div className="sb-foot">
        <button className="u-pill">
          <div className="u-av" style={{background:ROLE[user.role]?.c||'#3b82f6'}}>{user.name[0]}</div>
          <div className="user-info" style={{flex:1,minWidth:0}}>

        {canEdit&&<button className="btn btn-gh btn-sm" onClick={()=>{if(window.confirm('Удалить клиента?'))onDelete(c.id);}} style={{color:'var(--R)'}}><i className="ti ti-trash"/></button>}
        {canEdit&&<button className="btn btn-p" onClick={save}><i className="ti ti-device-floppy"/>Сохранить</button>}

          {c.contractAmount>0&&(c.payments||[]).length>0&&<div style={{marginTop:11}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4,opacity:.8}}><span>Получено денег</span><span>{payPct}%</span></div>

          </div>}
        </div>

        {/* STATUS */}
        <div style={{marginBottom:13}}>

        {/* TABS */}
        <div className="card" style={{overflow:'visible'}}>

                  <div style={{fontWeight:700,fontSize:12,color:c.contractType===ct.id?'var(--A)':'var(--tx)'}}>{ct.l}</div>
                  {ct.a>0?<div style={{fontWeight:800,fontSize:15,color:c.contractType===ct.id?'var(--A)':'var(--mu)',marginTop:2}}>{fmt(ct.a)} ₸</div>:<div style={{fontSize:11,color:'var(--lt)',marginTop:2}}>сумма вручную</div>}
